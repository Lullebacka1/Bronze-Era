l_english:
 LOADING_TIP_0: " #T \"The foreign countries made a conspiracy in their islands. All at once the lands were removed and scattered in the fray.\"#! \n #tooltip_subheading — Inscription of Ramesses III at Medinet Habu, c. 1175 BC#!"
 LOADING_TIP_1: " #T \"Better is bread when the heart is happy than riches with sorrow.\"#! \n #tooltip_subheading — #italic Instruction of Amenemope#!, c. 1100 BC#!"
 LOADING_TIP_2: " #T \"Is there not a ship upon the sea that belongs to Amun? Is not the sea his, and Lebanon his?\"#! \n #tooltip_subheading — #italic Tale of Wenamun#!, c. 1075 BC#!"
 LOADING_TIP_3: " #T \"When on high the heaven had not been named, firm ground below had not been called by name...\"#! \n #tooltip_subheading — #italic Enuma Elish#!, c. 1100 BC#!"
 LOADING_TIP_4: " #T \"They chose new gods; then was war in the gates: was there a shield or spear seen among forty thousand in Israel?\"#! \n #tooltip_subheading — #italic Song of Deborah#!, c. 1100 BC#!"
 LOADING_TIP_5: " #T \"Whence all creation had its origin, he, whether he fashioned it or whether he did not—he knows, or perhaps even he knows not.\"#! \n #tooltip_subheading — #italic Rigveda#!, Hymn 10.129, c. 1200 BC#!"
 LOADING_TIP_6: " #T \"There is one omen, and one only—that a man should fight for his country.\"#! \n #tooltip_subheading — Homer, #italic Iliad#!, c. 750 BC#!"
 LOADING_TIP_7: " #T \"Hateful to me as the gates of Hades is that man who hides one thing in his heart and speaks another.\"#! \n #tooltip_subheading — Homer, #italic Iliad#!, c. 750 BC#!"
 LOADING_TIP_8: " #T \"Of all creatures that breathe and move upon the earth, nothing is bred that is weaker than man.\"#! \n #tooltip_subheading — Homer, #italic Odyssey#!, c. 700 BC#!"
 LOADING_TIP_9: " #T \"Before the gates of excellence the high gods have placed sweat; long is the road thereto and steep and rough at the first.\"#! \n #tooltip_subheading — Hesiod, #italic Works and Days#!, c. 700 BC#!"
 LOADING_TIP_10: " #T \"We know how to speak many false things as though they were true; but we know, when we will, to utter true things.\"#! \n #tooltip_subheading — Hesiod, #italic Theogony#!, c. 700 BC#!"
 LOADING_TIP_11: " #T \"Some say cavalry, some infantry, some ships are the fairest thing upon the black earth; I say it is whatsoever one loves.\"#! \n #tooltip_subheading — Sappho, Fragment 16, c. 600 BC#!"
 LOADING_TIP_12: " #T \"I do not like a tall general, straddling in his stance, proud of his hair. Let mine be short, firmly set upon his feet, full of courage.\"#! \n #tooltip_subheading — Archilochus, Fragment 114, c. 650 BC#!"
 LOADING_TIP_13: " #T \"It is a beautiful thing for a good man to die, falling in the front ranks, fighting for his fatherland.\"#! \n #tooltip_subheading — Tyrtaeus, Fragment 10, c. 650 BC#!"
 LOADING_TIP_14: " #T \"No visible limit to wealth appears for men.\"#! \n #tooltip_subheading — Solon, Fragment 13, c. 590 BC#!"
 LOADING_TIP_15: " #T \"The journey of a thousand li commenced with a single step.\"#! \n #tooltip_subheading — Laozi, #italic Tao Te Ching#!, Chapter 64, c. 4th century BC#!"
 LOADING_TIP_16: " #T \"If the people be led by laws and uniformity sought by punishments, they will try to avoid punishment, but have no sense of shame.\"#! \n #tooltip_subheading — Confucius, #italic Analects#!, Book II, c. 5th–3rd century BC#!"
 LOADING_TIP_17: " #T \"When we see men of worth, we should think of equaling them; when we see men of a contrary character, we should turn inwards and examine ourselves.\"#! \n #tooltip_subheading — Confucius, #italic Analects#!, Book IV, c. 5th–3rd century BC#!"
 LOADING_TIP_18: " #T \"All warfare is based on deception.\"#! \n #tooltip_subheading — Sun Tzu, #italic The Art of War#!, c. 5th century BC#!"
 LOADING_TIP_19: " #T \"Supreme excellence consists in breaking the enemy's resistance without fighting.\"#! \n #tooltip_subheading — Sun Tzu, #italic The Art of War#!, c. 5th century BC#!"
 LOADING_TIP_20: " #T \"War is father of all and king of all; some he shows as gods, others as men; some he makes slaves, others free.\"#! \n #tooltip_subheading — Heraclitus, Fragment 53, c. 500 BC#!"
 LOADING_TIP_21: " #T \"The people must fight for its law as for its walls.\"#! \n #tooltip_subheading — Heraclitus, Fragment 44, c. 500 BC#!"
 LOADING_TIP_22: " #T \"By suffering comes learning.\"#! \n #tooltip_subheading — Aeschylus, #italic Agamemnon#!, 458 BC#!"
 LOADING_TIP_23: " #T \"Time, as he grows old, teaches all things.\"#! \n #tooltip_subheading — Aeschylus, #italic Prometheus Bound#!, 5th century BC#!"
 LOADING_TIP_24: " #T \"Creatures of a day! What is a man? What is he not? A dream of a shadow is our mortal being.\"#! \n #tooltip_subheading — Pindar, #italic Pythian Ode 8#!, c. 446 BC#!"
 LOADING_TIP_25: " #T \"Wonders are many, and none is more wonderful than man.\"#! \n #tooltip_subheading — Sophocles, #italic Antigone#!, c. 441 BC#!"
 LOADING_TIP_26: " #T \"All things the long and countless years first draw from darkness, and then bury from light.\"#! \n #tooltip_subheading — Sophocles, #italic Ajax#!, c. 440 BC#!"
 LOADING_TIP_27: " #T \"In peace sons bury their fathers, but in war fathers bury their sons.\"#! \n #tooltip_subheading — Herodotus, #italic Histories#!, c. 430 BC#!"
 LOADING_TIP_28: " #T \"Custom is king of all.\"#! \n #tooltip_subheading — Herodotus, #italic Histories#!, Book III, c. 430 BC#!"
 LOADING_TIP_29: " #T \"The strong do what they can and the weak suffer what they must.\"#! \n #tooltip_subheading — Thucydides, #italic History of the Peloponnesian War#!, c. 400 BC#!"
 LOADING_TIP_30: " #T \"Its administration favours the many instead of the few; this is why it is called a democracy.\"#! \n #tooltip_subheading — Thucydides, #italic History of the Peloponnesian War#!, c. 400 BC#!"
 LOADING_TIP_31: " #T \"War is a stern teacher.\"#! \n #tooltip_subheading — Thucydides, #italic History of the Peloponnesian War#!, c. 400 BC#!"
 LOADING_TIP_32: " #T \"Of all things that have life and sense we women are the most hapless creatures.\"#! \n #tooltip_subheading — Euripides, #italic Medea#!, 431 BC#!"
 LOADING_TIP_33: " #T \"How are ye blind, ye treaders down of cities, that temples desolate and tombs, the hallowed homes of dead men, ye thereby yourselves must die!\"#! \n #tooltip_subheading — Euripides, #italic The Trojan Women#!, 415 BC#!"
 LOADING_TIP_34: " #T \"The unexamined life is not worth living.\"#! \n #tooltip_subheading — Plato, #italic Apology#!, c. 399 BC#!"
 LOADING_TIP_35: " #T \"Until philosophers are kings, or the kings and princes of this world have the spirit and power of philosophy, cities will never have rest from their evils.\"#! \n #tooltip_subheading — Plato, #italic Republic#!, c. 375 BC#!"
 LOADING_TIP_36: " #T \"The beginning is the most important part of any work, especially in the case of a young and tender thing.\"#! \n #tooltip_subheading — Plato, #italic Republic#!, c. 375 BC#!"
 LOADING_TIP_37: " #T \"The sea! The sea!\"#! \n #tooltip_subheading — Xenophon, #italic Anabasis#!, c. 370 BC#!"
 LOADING_TIP_38: " #T \"Agriculture is the mother and nurse of all the other arts.\"#! \n #tooltip_subheading — Xenophon, #italic Oeconomicus#!, c. 360 BC#!"
 LOADING_TIP_39: " #T \"Man is by nature a political animal.\"#! \n #tooltip_subheading — Aristotle, #italic Politics#!, c. 350 BC#!"
 LOADING_TIP_40: " #T \"One swallow does not make a summer, nor does one day; and so too one day, or a short time, does not make a man blessed and happy.\"#! \n #tooltip_subheading — Aristotle, #italic Nicomachean Ethics#!, c. 340 BC#!"
 LOADING_TIP_41: " #T \"All men by nature desire to know.\"#! \n #tooltip_subheading — Aristotle, #italic Metaphysics#!, c. 340 BC#!"
 LOADING_TIP_42: " #T \"Small opportunities are often the beginning of great enterprises.\"#! \n #tooltip_subheading — Demosthenes, #italic First Olynthiac#!, 349 BC#!"
 LOADING_TIP_43: " #T \"So far has our city distanced the rest of mankind in thought and speech that her pupils have become the teachers of others.\"#! \n #tooltip_subheading — Isocrates, #italic Panegyricus#!, 380 BC#!"
 LOADING_TIP_44: " #T \"Death, therefore, the most awful of evils, is nothing to us.\"#! \n #tooltip_subheading — Epicurus, #italic Letter to Menoeceus#!, c. 300 BC#!"
 LOADING_TIP_45: " #T \"It is impossible to live a pleasant life without living wisely and well and justly.\"#! \n #tooltip_subheading — Epicurus, #italic Principal Doctrines#!, c. 300 BC#!"
 LOADING_TIP_46: " #T \"Once Zhuang Zhou dreamed that he was a butterfly, a butterfly flitting and fluttering around, happy with himself and doing as he pleased.\"#! \n #tooltip_subheading — Zhuangzi, #italic Zhuangzi#!, c. 3rd century BC#!"
 LOADING_TIP_47: " #T \"The people are the most important element in a nation; the spirits of the land and grain are the next; the sovereign is the lightest.\"#! \n #tooltip_subheading — Mencius, #italic Mengzi#!, c. 3rd century BC#!"
 LOADING_TIP_48: " #T \"If the people of the world all loved one another, the strong would not oppress the weak, and the many would not plunder the few.\"#! \n #tooltip_subheading — Mozi, #italic Universal Love#!, c. 4th century BC#!"
 LOADING_TIP_49: " #T \"The Beloved of the Gods considers victory by Dhamma to be the foremost victory.\"#! \n #tooltip_subheading — Ashoka, Major Rock Edict XIII, c. 257 BC#!"
 LOADING_TIP_50: " #T \"By the favor of Ahuramazda I am king; Ahuramazda bestowed the kingdom upon me.\"#! \n #tooltip_subheading — Darius I, Behistun Inscription, c. 520 BC#!"
 LOADING_TIP_51: " #T \"I returned the images of the gods to their places and gathered all their inhabitants and returned them to their dwellings.\"#! \n #tooltip_subheading — Cyrus the Great, Cyrus Cylinder, c. 539 BC#!"
 LOADING_TIP_52: " #T \"Though death befalls all men alike, it may be weightier than Mount Tai or lighter than a feather.\"#! \n #tooltip_subheading — Sima Qian, #italic Letter to Ren An#!, c. 93 BC#!"
 LOADING_TIP_53: " #T \"Who is so worthless or indolent as not to wish to know by what means the Romans succeeded in subjecting nearly the whole inhabited world?\"#! \n #tooltip_subheading — Polybius, #italic Histories#!, c. 140 BC#!"
 LOADING_TIP_54: " #T \"All Gaul is divided into three parts.\"#! \n #tooltip_subheading — Julius Caesar, #italic Commentaries on the Gallic War#!, c. 50 BC#!"
 LOADING_TIP_55: " #T \"Of all these, the Belgae are the bravest.\"#! \n #tooltip_subheading — Julius Caesar, #italic Commentaries on the Gallic War#!, c. 50 BC#!"
 LOADING_TIP_56: " #T \"We are not born for ourselves alone; our country and our friends have a share in us.\"#! \n #tooltip_subheading — Cicero, #italic On Duties#!, 44 BC#!"
 #
 LOADING_TIP_d008_0: " #T \"Perhaps even these things will one day be pleasing to remember.\"#! \n #tooltip_subheading — Virgil, #italic Aeneid#!, c. 19 BC#!"
 LOADING_TIP_d008_1: " #T \"I fear the Greeks, even when they bear gifts.\"#! \n #tooltip_subheading — Virgil, #italic Aeneid#!, c. 19 BC#!"
 LOADING_TIP_d008_2: " #T \"Seize the day, trusting as little as possible in the future.\"#! \n #tooltip_subheading — Horace, #italic Odes#!, 23 BC#!"
 LOADING_TIP_d008_3: " #T \"Woe to the vanquished!\"#! \n #tooltip_subheading — Livy, #italic History of Rome#!, c. 9 BC#!"
 LOADING_TIP_57: " #T \"We are all servants of the laws in order that we may be free.\"#! \n #tooltip_subheading — Cicero, #italic Pro Cluentio#!, 66 BC#!"
 LOADING_TIP_58: " #T \"All men who wish to rise above the other animals ought to strive with all their power not to pass through life in silence.\"#! \n #tooltip_subheading — Sallust, #italic The Conspiracy of Catiline#!, c. 42 BC#!"
 LOADING_TIP_59: " #T \"Nothing can ever be created by divine power out of nothing.\"#! \n #tooltip_subheading — Lucretius, #italic On the Nature of Things#!, c. 55 BC#!"
