l_french:
 village_community: "Communaute villageoise"
 village_community_desc: "Une union tres decentralisee de villages agricoles, de familles et de clans, tenue par une assemblee commune plutot que par une cour hereditaire."
 village_clan_elective: "Election de l'assemblee des clans"
 village_clan_elective_desc: "Le dirigeant est choisi par election parmi les principaux chefs de village, de clan et de maison pour un mandat de quatre ans. Les candidats viennent des pouvoirs locaux plutot que d'une dynastie hereditaire."
 village_community_reform: "Communaute villageoise"
 village_community_reform_desc: "Le pouvoir repose sur les villages autonomes et les groupes de parente. L'assemblee commune peut choisir un premier ancien, mais la fiscalite, le controle et l'administration permanente restent faibles hors des environs immediats."
 maintain_clan_assembly_reform: "Maintenir l'assemblee des clans"
 maintain_clan_assembly_reform_desc: "L'assemblee reste le centre de la vie politique. Les villages conservent leur autonomie, tandis que les clans acceptent un rythme plus formel de debat et d'election."
 clan_confederation_reform: "Confederation de clans"
 clan_confederation_reform_desc: "Plusieurs communautes villageoises acceptent de coordonner guerre, diplomatie et tribut au moyen d'un conseil confederal plus solide. L'autorite centrale reste limitee, mais la communaute peut agir au-dela d'un seul groupe de villages."
 hereditary_chiefdom_reform: "Chefferie hereditaire"
 hereditary_chiefdom_reform_desc: "Un clan dominant transforme la precedence elective en autorite hereditaire. La communaute devient une chefferie tribale tout en conservant certaines traditions d'assemblee locale."
 village_community_adopt_monarchy_reform: "Adopter la monarchie"
 village_community_adopt_monarchy_reform_desc: "Une communaute vaste et centralisee peut abandonner entierement l'election clanique et adopter une monarchie dynastique par la transition normale de gouvernement."
 village_community_clan_interest_law: "Interets de l'assemblee des clans"
 village_community_clan_interest_law_desc: "L'assemblee donne la priorite a un grand bloc d'interets claniques sans simuler chaque famille. Ces politiques representent l'influence pratique de differents groupes de candidats."
 cultivator_clan_interest_policy: "Clans cultivateurs"
 cultivator_clan_interest_policy_desc: "Les lignages cultivateurs orientent l'assemblee vers les cereales, les reserves, le travail des sols et la croissance rurale."
 herder_clan_interest_policy: "Clans eleveurs"
 herder_clan_interest_policy_desc: "Les lignages eleveurs orientent l'assemblee vers le betail, la mobilite saisonniere, le ravitaillement et les hommes disponibles."
 warrior_clan_interest_policy: "Clans guerriers"
 warrior_clan_interest_policy_desc: "Les lignages guerriers orientent l'assemblee vers les levees villageoises, la defense locale et le prestige militaire, au prix d'une confiance exterieure plus faible."
 elder_clan_interest_policy: "Clans des anciens"
 elder_clan_interest_policy_desc: "Les anciens des maisons orientent l'assemblee vers la coutume, la mediation et la stabilite entre villages."
