l_french:
 ASGARD_f: "Asgard"
 ASGARD_f_desc: "Les routes maritimes, les forets et les halles de bronze du Nord peuvent etre rassemblees sous une haute couronne. Asgard n'est pas un royaume divin, mais un royaume humain qui revendique le prestige du domaine des Ases."
 bronze_asgard_high_kingship: "Haute royaute d'Asgard"
 bronze_asgard_high_kingship_desc: "Les souverains d'Asgard lient les chefs nordiques, les lieux de culte et les routes maritimes dans un ordre royal durable."
 bronze_asgard_remaining_claims_tt: "Recoit des revendications, mais pas de cores, sur les locations restantes d'Asgard."
 bronze_formed_asgard: "Asgard forme"
 bronze_formed_asgard_desc: "Ce pays a forme Asgard et se tient desormais au-dessus des couronnes nordiques regionales."
