l_french:
 ARM: "Arménie"
 ARM_ADJ: "arménien"
 AZZI_HAJAS: "Azzi-Hayasa-Urartu"
 AZZI_HAJAS_ADJ: "azzi-hayasa-urartéen"
 armenian_culture: "Arménien"
 armenian_culture_ADJ: "arménien"
 armenian_pagan: "Rites arméniens"
 armenian_pagan_ADJ: "arménien"
 armenian_pagan_desc: "Une tradition religieuse des hautes terres centrée sur les montagnes sacrées, les ancêtres royaux, les cultes guerriers et les sanctuaires locaux."
 BRONZE_ARMENIA_f: "Former le Grand Royaume d'Arménie"
 BRONZE_ARMENIA_f_desc: "Les hautes terres autour de l'Ararat, de Van et du haut Euphrate peuvent être réunies dans un nouveau royaume arménien, mêlant les traditions hayasiennes, urartéennes et caucasiennes sous une seule maison royale."
 bronze_azzi_hayasa_unify_confederation: "Unifier la confédération des hautes terres"
 bronze_azzi_hayasa_unify_confederation_desc: "Intégrer les partenaires juniors de l'union des hautes terres dans une confédération arménienne réunissant Azzi, Hayasa et Urartu."
 bronze_azzi_hayasa_unify_tt: "Les partenaires de l'union sont intégrés. Notre État adopte une identité arménienne, et les communautés urartéennes de la carte adoptent la culture arménienne."
 bronze_armenia_urartian_conversion_tt: "Les communautés urartéennes de la carte adoptent la culture arménienne."
 bronze_azzi_hayasa_confederation: "Confédération Azzi-Hayasa"
 bronze_azzi_hayasa_confederation_desc: "Les maisons des hautes terres d'Azzi, de Hayasa et d'Urartu ont été réunies dans une seule confédération, renforçant le contrôle royal sur les hautes terres arméniennes."
 bronze_armenia_foundation: "Grande royauté arménienne"
 bronze_armenia_foundation_desc: "La maison royale revendique l'autorité sur les hautes terres arméniennes et les corridors montagneux entre l'Anatolie, le Caucase et la Mésopotamie."
 bronze_yerevan_foundation_site: "Fondation royale à Yerevan"
 bronze_yerevan_foundation_site_desc: "De nouvelles murailles, réserves et ateliers palatiaux font de Yerevan un centre royal des hautes terres."
 bronze_armenia.1.title: "La fondation de Yerevan"
 bronze_armenia.1.desc: "Les terres hautes autour de Yerevan sont devenues un point de rassemblement naturel pour les chefs, les scribes et les suites guerrières. Avec assez de trésor royal, l'établissement peut devenir une cité fortifiée et un centre palatial, offrant aux hautes terres arméniennes un cœur politique durable."
 bronze_armenia.1.a: "Élever les murailles et le palais."
 bronze_yerevan_foundation_1a_tt: "Dépense #negative_value 200#! d'or. Yerevan devient une cité, reçoit des Murailles urbaines et un Complexe palatial, puis notre pays adopte le nom Arménie. Nous gagnons #positive_value 10#! de Stabilité, #positive_value 20#! de Légitimité et #positive_value 20#! de Prestige."
