l_french:
 ISRAEL_f: "Israel"
 ISRAEL_f_desc: "Les hautes terres de Safed, Sichem, Jaffa et Irbid peuvent etre rassemblees en un royaume cananeen lorsque toute tutelle etrangere a ete rejetee."
 JUDAH_f: "Juda"
 JUDAH_f_desc: "Jerusalem, Hebron et Beersheba peuvent former un royaume des collines du sud, fonde sur les rites cananeens et l'autorite royale locale."
 MOAB_f: "Moab"
 MOAB_f_desc: "Madaba et Karak peuvent etre unies dans le royaume de Moab, une couronne transjordanienne compacte controlant les routes a l'est de la mer Morte."
 EDOM_f: "Edom"
 EDOM_f_desc: "Sughar, Shoubak et Maan peuvent etre unies en Edom, royaume de hautes terres, de pistes caravanieres et de marches defensives."
 ARDAM_f: "Aram-Damas"
 ARDAM_f_desc: "Les oasis, plaines et routes autour de Damas peuvent etre rassemblees en un royaume arameen centre sur la cite royale de Damas."
 AMMON_f: "Ammon"
 AMMON_f_desc: "Amman et Bosra peuvent etre unies en Ammon, royaume des collines controlant les approches orientales de Canaan."
 PHILST_f: "Etats philistins"
 PHILST_f_desc: "Gaza et Majdal peuvent former un royaume cotier peleset, appuye sur le commerce maritime, les traditions de raid et les ports fortifies."
 PHO_f: "Phenicie"
 PHO_f_desc: "Les royaumes portuaires pheniciens de Sidon, Byblos, Berit et Arwad peuvent etre unis avec Akshaph en un royaume maritime de pourpre, de cedre et de commerce oriental."
 bronze_canaanite_kingdom_foundation: "Fondation royale cananeenne"
 bronze_canaanite_kingdom_foundation_desc: "Ce royaume a uni ses cites locales en une couronne cananeenne durable. Les levees, la legitimite et le controle local progressent modestement."
 bronze_philistine_maritime_states: "Etats maritimes peleset"
 bronze_philistine_maritime_states_desc: "Les cites philistines organisent navires, ports et ateliers cotiers en une economie maritime plus forte."
 bronze_phoenician_maritime_kingdom: "Royaume maritime phenicien"
 bronze_phoenician_maritime_kingdom_desc: "Les cites pheniciennes coordonnent ports, routes du bois, ateliers de teinture et equipages dans une puissance commerciale maritime plus forte."
 bronze_phoenician_merchant_republic: "Conseil des ports"
 bronze_phoenician_merchant_republic_desc: "Maisons marchandes, tresors des temples et anciens des ports guident l'Etat phenicien par des assemblees civiques et le patronage commercial."
 bronze_phoenician_royal_thalassocracy: "Thalassocratie royale"
 bronze_phoenician_royal_thalassocracy_desc: "Une maison royale revendique le commandement des ports pheniciens, liant navires, levees et legitimite dynastique en une couronne maritime."
 bronze_formed_canaanite_kingdom: "Royaume cananeen forme"
 bronze_formed_canaanite_kingdom_desc: "Ce pays a forme l'un des royaumes regionaux cananeens."
 bronze_formed_philistine_states: "Etats philistins formes"
 bronze_formed_philistine_states_desc: "Ce pays a forme les Etats philistins."
 bronze_formed_phoenicia: "Phenicie formee"
 bronze_formed_phoenicia_desc: "Ce pays a uni les royaumes des cites pheniciennes."
 bronze_phoenicia.1.title: "Les ports decident"
 bronze_phoenicia.1.desc: "Sidon, Byblos, Berit, Arwad et Akshaph obeissent desormais a une seule autorite phenicienne. Les ports sont riches, mais le nouveau royaume doit choisir si le pouvoir revient a une maison royale ou aux conseils des marchands, tresors des temples et anciens des ports."
 bronze_phoenicia.1.a: "Laissons gouverner les conseils portuaires."
 bronze_phoenicia.1.b: "Elevons un roi sur la cote pourpre."
 bronze_phoenicia_1a_tt: "La Phenicie devient une republique et gagne un bonus permanent modeste en tradition republicaine, investissement de stabilite et vitesse de construction."
 bronze_phoenicia_1b_tt: "La Phenicie reste une monarchie et gagne un bonus permanent modeste en legitimite, levees et moral terrestre."
 MACED_f: "Macédoine"
 MACED_f_desc: "Les marches grecques et peoniennes du nord peuvent etre rassemblees en Macedoine apres le debut de l'Age de Fer, remplacant les pouvoirs locaux disperses par un Etat royal militaire."
 THESS_f: "Thessalie"
 THESS_f_desc: "La plaine thessalienne et ses ports peuvent etre unis en duche lorsque l'Age de Fer ouvre de nouvelles formes politiques apres l'age palatial."
 MOLSI_f: "Molossie"
 MOLSI_f_desc: "Les hautes terres et vallees grecques occidentales d'Epire peuvent etre liees en un royaume molossien sous une maison royale hellenique."
 bronze_macedonian_iron_kingship: "Royauté de fer macédonienne"
 bronze_macedonian_iron_kingship_desc: "La nouvelle monarchie macedonienne unit levees des hautes terres, compagnons royaux et passes fortifies dans une couronne militaire plus durable."
 bronze_thessalian_duchy: "Seigneurs cavaliers thessaliens"
 bronze_thessalian_duchy_desc: "Les plaines thessaliennes soutiennent l'elevage des chevaux, les levees locales et le prestige aristocratique autour de Larissa."
 bronze_molossian_highland_kingship: "Royauté molossienne des hautes terres"
 bronze_molossian_highland_kingship_desc: "La couronne molossienne repose sur des vallees defendues, des guerriers montagnards et une maison royale hellenique."
 bronze_formed_greek_iron_realm: "Royaume grec de l'Age de Fer forme"
 bronze_formed_greek_iron_realm_desc: "Ce pays a forme un royaume grec regional apres l'ordre palatial de l'Age du Bronze."
 MHELL_f: "Hi Megáli Hellás"
 MHELL_f_desc: "Les cites grecques et royaumes cotiers de la mer occidentale peuvent etre rassembles en un grand royaume hellenique lorsque l'Age de Fer commence."
 bronze_megale_hellas_kinship: "Parente hellenique occidentale"
 bronze_megale_hellas_kinship_desc: "Ce pays est respecte pour avoir rassemble les Grecs occidentaux dans Hi Megali Hellas."
 bronze_formed_megale_hellas: "Hi Megali Hellas formee"
 bronze_formed_megale_hellas_desc: "Ce pays a forme Hi Megali Hellas."
