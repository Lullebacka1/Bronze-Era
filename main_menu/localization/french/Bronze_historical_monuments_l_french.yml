l_french:
 bronze_monument_giza_pyramid_complex: "Complexe pyramidal de Gizeh"
 bronze_monument_giza_pyramid_complex_desc: "Les pyramides royales de Gizeh proclament l'autorité divine et durable des souverains d'Égypte."
 bronze_monument_karnak_complex: "Complexe de Karnak"
 bronze_monument_karnak_complex_desc: "Une vaste enceinte sacrée entretenue par les dons royaux, le service des prêtres et les richesses du Nil."
 bronze_monument_luxor_temple: "Temple de Louxor"
 bronze_monument_luxor_temple_desc: "Un sanctuaire royal consacré à la royauté divine et au renouvellement de l'autorité souveraine."
 bronze_monument_abu_simbel: "Temples d'Abou Simbel"
 bronze_monument_abu_simbel_desc: "Des temples creusés dans la roche unissant culte royal, puissance frontalière et paysage sacré nubien."
 bronze_monument_theban_necropolis: "Nécropole thébaine"
 bronze_monument_theban_necropolis_desc: "Tombeaux royaux, temples funéraires et domaines sacerdotaux préservent la mémoire des souverains d'Égypte."
 bronze_monument_hattusa_complex: "Complexe monumental de Hattusa"
 bronze_monument_hattusa_complex_desc: "Le Grand Temple, les portes royales et le sanctuaire voisin incarnent l'autorité du Grand Roi."
 bronze_monument_mycenae_citadel: "Citadelle de Mycènes"
 bronze_monument_mycenae_citadel_desc: "Les murs cyclopéens, les tombes royales et la Porte des Lions dominent l'Argolide depuis le siège du wanax."
 bronze_monument_tiryns_cyclopean: "Fortifications cyclopéennes de Tirynthe"
 bronze_monument_tiryns_cyclopean_desc: "D'immenses murailles de pierre protègent l'une des plus puissantes citadelles du monde mycénien."
 bronze_monument_pylos_palace: "Palais de Pylos"
 bronze_monument_pylos_palace_desc: "Un palais d'archives, de réserves, d'ateliers et d'administration agricole."
 bronze_monument_troy_citadel: "Citadelle de Troie"
 bronze_monument_troy_citadel_desc: "Une citadelle fortifiée contrôlant les passages entre l'Égée et les détroits."
 bronze_monument_knossos_complex: "Complexe palatial de Knossos"
 bronze_monument_knossos_complex_desc: "Le complexe palatial subsistant demeure un puissant symbole de l'administration crétoise et de la royauté sacrée."
 bronze_monument_ugarit_complex: "Complexe royal d'Ougarit"
 bronze_monument_ugarit_complex_desc: "Palais, archives, temples et commerce portuaire relient la cité à toutes les rives de la mer orientale."
 bronze_monument_ur_ziggurat: "Grande ziggourat d'Ur"
 bronze_monument_ur_ziggurat_desc: "La monumentale plateforme du temple d'Ur domine la vie sacrée et politique de la cité."
 bronze_monument_assur_complex: "Complexe sacré d'Assur"
 bronze_monument_assur_complex_desc: "Temples, palais et institutions marchandes entourent la ville sainte des Assyriens."
 bronze_monument_chogha_zanbil: "Ziggourat de Chogha Zanbil"
 bronze_monument_chogha_zanbil_desc: "Une cité sacrée élamite centrée sur une haute ziggourat élevée pour les dieux des hautes et basses terres."
 bronze_monument_yin_xu: "Complexe royal de Yin Xu"
 bronze_monument_yin_xu_desc: "Palais, sanctuaires ancestraux, tombes royales et ateliers forment le cœur cérémoniel du pouvoir Shang."
 bronze_monument_su_nuraxi: "Complexe nuragique de Su Nuraxi"
 bronze_monument_su_nuraxi_desc: "Un nuraghe fortifié et son habitat commandent l'intérieur de la Sardaigne."
 bronze_monument_stonehenge: "Stonehenge"
 bronze_monument_stonehenge_desc: "Le grand cercle de pierres demeure un lieu de cérémonie, de mémoire et de rassemblement saisonnier."
 bronze_monument_avebury: "Paysage sacré d'Avebury"
 bronze_monument_avebury_desc: "Cercles, avenues et terrassements composent un vaste paysage cérémoniel."
 bronze_monument_bru_na_boinne: "Brú na Bóinne"
 bronze_monument_bru_na_boinne_desc: "D'anciens tombeaux à couloir et tertres sacrés conservent l'autorité des lointains ancêtres."
 bronze_monument_great_pyramid_new: "Complexe de grande pyramide"
 bronze_monument_great_pyramid_new_desc: "Une nouvelle pyramide royale et son complexe funéraire bâtis après des décennies d'extraction, de transport et de travail organisé."
 bronze_monument_great_pyramid_unfinished: "Grande pyramide inachevée"
 bronze_monument_great_pyramid_unfinished_desc: "Pierres extraites, rampes, fondations et camps abandonnés marquent un immense projet royal attendant son achèvement."
