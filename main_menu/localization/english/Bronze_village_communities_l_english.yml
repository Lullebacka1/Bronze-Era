l_english:
 village_community: "Village Community"
 village_community_desc: "A very decentralized union of farming villages, families and clans, held together by a common assembly rather than a hereditary court."
 village_clan_elective: "Clan Assembly Election"
 village_clan_elective_desc: "The ruler is chosen by election from important village, clan and household leaders for a four-year term. Candidates are drawn from the local estates instead of a hereditary dynasty."
 village_community_reform: "Village Community"
 village_community_reform_desc: "Power rests with autonomous villages and kinship groups. The common assembly can choose a first elder, but tax collection, control and permanent administration remain weak outside the nearest settlements."
 maintain_clan_assembly_reform: "Maintain the Clan Assembly"
 maintain_clan_assembly_reform_desc: "The assembly remains the center of political life. The villages preserve their autonomy, while the clans accept a more formal rhythm for debate and election."
 clan_confederation_reform: "Clan Confederation"
 clan_confederation_reform_desc: "Several village communities agree to coordinate war, diplomacy and tribute through a stronger confederal council. Central authority is still limited, but the community can act beyond a single cluster of settlements."
 hereditary_chiefdom_reform: "Hereditary Chiefdom"
 hereditary_chiefdom_reform_desc: "One leading clan turns elected precedence into hereditary authority. The community becomes a tribal chiefdom while preserving some local assembly traditions."
 village_community_adopt_monarchy_reform: "Adopt Monarchy"
 village_community_adopt_monarchy_reform_desc: "A large and centralized community may abandon clan election entirely and adopt a dynastic monarchy through the normal government transition."
 village_community_clan_interest_law: "Clan Assembly Interests"
 village_community_clan_interest_law_desc: "The assembly gives priority to one broad bloc of clan interests without simulating every family. These policies stand in for the practical influence of different candidate groups."
 cultivator_clan_interest_policy: "Cultivator Clans"
 cultivator_clan_interest_policy_desc: "Cultivator lineages focus the assembly on grain, storage, soil work and rural population growth."
 herder_clan_interest_policy: "Herder Clans"
 herder_clan_interest_policy_desc: "Herder lineages focus the assembly on livestock, seasonal mobility, supply and useful manpower."
 warrior_clan_interest_policy: "Warrior Clans"
 warrior_clan_interest_policy_desc: "Warrior lineages focus the assembly on village levies, local defense and military prestige, at the cost of external trust."
 elder_clan_interest_policy: "Elder Clans"
 elder_clan_interest_policy_desc: "Senior household heads focus the assembly on custom, mediation and keeping relations between villages stable."
