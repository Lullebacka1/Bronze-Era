l_english:
 egyptian_rule_in_canaan: "Egyptian Rule in Canaan"
 egyptian_rule_in_canaan_desc: "Egyptian garrisons and vassal treaties bind Canaan to the Nile, but the city kings watch Egypt's strength carefully. Authority rises through paid garrisons and loyal subjects, and falls through defiance, lost strongholds, famine and the wider Bronze Age collapse."
 egyptian_rule_in_canaan_overview_card: "Canaanite Protectorate"
 egyptian_rule_in_canaan_overview_card_desc: "Egypt begins with a strong but fragile imperial network in Canaan. The local city kingdoms remain on their land, while Egyptian garrisons mark the main roads and ports."
 egyptian_rule_in_canaan_panel_phase: "Phase"
 egyptian_rule_in_canaan_panel_phase_value: "#Y [GetSituationByKey('egyptian_rule_in_canaan').MakeScope.GetVariable('egyptian_rule_in_canaan_phase').GetValue|V0]#!/3"
 egyptian_rule_in_canaan_panel_authority: "Egyptian Authority"
 egyptian_rule_in_canaan_panel_authority_value: "#Y [GetSituationByKey('egyptian_rule_in_canaan').MakeScope.GetVariable('egyptian_authority_in_canaan').GetValue|V0]#!/100"
 egyptian_rule_in_canaan_panel_subjects: "Canaanite Vassals"
 egyptian_rule_in_canaan_panel_subjects_value: "#Y [GetSituationByKey('egyptian_rule_in_canaan').MakeScope.GetVariable('egyptian_rule_in_canaan_subjects').GetValue|V0]#!/10"
 egyptian_rule_in_canaan_actions_card: "Available Actions"
 egyptian_rule_in_canaan_actions_card_desc: "Egypt may spend wealth and manpower to reinforce the garrisons. Canaanite vassals may defy Egyptian authority, gaining unrest and diplomatic risk."
 egyptian_rule_in_canaan_map_card: "Map Markers"
 egyptian_rule_in_canaan_map_card_desc: "Yellow marks Canaanite city kingdoms. Egyptian-colored sites hold Egyptian garrisons. Red secondary coloring marks occupied garrison locations."
 hint_egyptian_rule_in_canaan: "Egyptian Rule in Canaan"
 hint_egyptian_rule_in_canaan_hint_text: "Egypt controls Canaan through vassal city kingdoms and foreign garrisons. If authority reaches zero, Egypt must either abandon Canaan or pay a severe one-time cost to hold the protectorate together."
 egyptian_rule_in_canaan_phase_1: "Egyptian Hegemony"
 egyptian_rule_in_canaan_phase_2: "Declining Authority"
 egyptian_rule_in_canaan_phase_3: "Canaanite Defiance"
 egyptian_rule_reinforce_canaanite_garrisons: "Reinforce the Canaanite Garrisons"
 egyptian_rule_reinforce_canaanite_garrisons_desc: "Send troops, scribes and silver to the Canaanite strongholds. The cost is real, but visible Egyptian force can delay rebellion."
 egyptian_rule_reinforce_canaanite_garrisons_tt: "Egyptian Authority in Canaan increases by #P 8#!. Egyptian noble satisfaction falls slightly while men and resources are sent abroad."
 egyptian_rule_defy_egyptian_authority: "Defy Egyptian Authority"
 egyptian_rule_defy_egyptian_authority_desc: "Withhold tribute, shelter local warbands and test the reach of Pharaoh's officials."
 egyptian_rule_defy_egyptian_authority_tt: "Egyptian Authority in Canaan falls by #N 4#!. This country gains liberty desire and worsens relations with Egypt."
 egyptian_rule_in_canaan.1.title: "The Canaanite Protectorate"
 egyptian_rule_in_canaan.1.desc: "The roads of Canaan still answer to Egypt. Garrisons watch Gaza, Jaffa and Shechem, while city kings send tribute to the Nile. Yet the balance depends on fear, gold and the reputation of Pharaoh's armies."
 egyptian_rule_in_canaan.1.a: "The vassal kings will remember Egypt."
 egyptian_rule_in_canaan_1a_tt: "The Egyptian Rule in Canaan situation begins with #Y 80#! authority."
 egyptian_rule_in_canaan.2.title: "Under Pharaoh's Shadow"
 egyptian_rule_in_canaan.2.desc: "Egyptian scribes count grain, soldiers guard the roads and messengers carry demands from the south. Your city keeps its throne, but not full freedom."
 egyptian_rule_in_canaan.2.a: "We will endure this order."
 egyptian_rule_in_canaan_2a_tt: "You are part of the Egyptian Rule in Canaan situation as a Canaanite vassal."
 egyptian_rule_in_canaan.10.title: "Tribute Refused"
 egyptian_rule_in_canaan.10.desc: "Several Canaanite city kings delay tribute and send evasive letters. The garrisons ask for silver, envoys demand punishment and the scribes warn that Egyptian authority is becoming negotiable."
 egyptian_rule_in_canaan.10.a: "Let the warning stand."
 egyptian_rule_in_canaan_10a_tt: "Egyptian Authority in Canaan falls by #N 4#!."
 egyptian_rule_in_canaan.10.b: "Pay the arrears ourselves."
 egyptian_rule_in_canaan_10b_tt: "Costs #N 45#! gold. Egyptian Authority in Canaan rises by #P 3#! and Canaanite vassal liberty desire falls slightly."
 egyptian_rule_in_canaan.20.title: "A Garrison Is Cut Off"
 egyptian_rule_in_canaan.20.desc: "A fortified Egyptian post in Canaan has been occupied or isolated from its local ruler. The loss is not only military. Every nearby king now measures Egyptian authority against the smoke rising from the road."
 egyptian_rule_in_canaan.20.a: "The news will travel."
 egyptian_rule_in_canaan_20a_tt: "Egyptian Authority in Canaan has fallen because a garrison location was occupied."
 egyptian_rule_in_canaan.100.title: "The Protectorate Breaks"
 egyptian_rule_in_canaan.100.desc: "The Canaanite cities no longer obey from habit or fear. Pharaoh's messengers are ignored, garrisons are costly islands of control and the treasury must choose whether Canaan is worth another great sacrifice."
 egyptian_rule_in_canaan.100.a: "Withdraw from Canaan."
 egyptian_rule_in_canaan_100a_tt: "All remaining Canaanite vassals are released, Egyptian garrisons are removed and the situation ends."
 egyptian_rule_in_canaan.100.b: "Canaan must be held."
 egyptian_rule_in_canaan_100b_tt: "One-time emergency measure. Costs #N 180#! gold, #N 500#! manpower and stability. Authority is reset to #Y 30#!, but all Canaanite vassals become more defiant."
 egyptian_rule_in_canaan.200.title: "Canaan Endures Under Egypt"
 egyptian_rule_in_canaan.200.desc: "The storms of the wider collapse have passed without breaking Egyptian authority in Canaan. The garrisons remain expensive, but the vassal kings have not shattered the protectorate."
 egyptian_rule_in_canaan.200.a: "The roads remain open to Egypt."
 egyptian_rule_in_canaan_200a_tt: "Egypt gains prestige and the situation ends while Canaan remains under Egyptian vassalage."
