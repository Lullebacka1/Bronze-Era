l_english:
 nuragic_simple_nuraghe: "Simple Nuraghe"
 nuragic_simple_nuraghe_desc: "A local stone tower used as a defensive refuge, watch point, and communal landmark."
 nuragic_complex_nuraghe: "Complex Nuraghe"
 nuragic_complex_nuraghe_desc: "A larger tower complex with attached spaces for storage, assembly, and the authority of local leaders."
 nuragic_giants_tombs: "Giants' Tombs"
 nuragic_giants_tombs_desc: "Collective stone tombs used for ancestral rites and the memory of extended kin groups."
 nuragic_circular_house_village: "Circular House Village"
 nuragic_circular_house_village_desc: "A dispersed Nuragic village of round stone houses, animal pens, storage spaces, and household workshops."
 nuragic_bronze_workshop: "Nuragic Bronze Workshop"
 nuragic_bronze_workshop_desc: "Small-scale casting and finishing workshops produce tools, ornaments, and votive bronzes for local exchange."
 nuragic_communal_cistern: "Communal Cistern"
 nuragic_communal_cistern_desc: "A managed water point and storage system supporting herders, households, and seasonal gatherings."

 nuragic_simple_nuraghe_maintenance: "Tower Upkeep"
 nuragic_simple_nuraghe_maintenance_desc: "Stone, timber, and tools maintain the tower and its immediate defensive works."
 nuragic_complex_nuraghe_maintenance: "Complex Upkeep"
 nuragic_complex_nuraghe_maintenance_desc: "Masons, carpenters, and guards maintain a larger Nuragic tower complex."
 nuragic_giants_tombs_maintenance: "Ancestral Offerings"
 nuragic_giants_tombs_maintenance_desc: "Offerings and periodic repairs preserve the collective tombs and their ritual approaches."
 nuragic_household_compounds: "Household Compounds"
 nuragic_household_compounds_desc: "Families keep animals, store grain, and maintain pottery and domestic tools within circular house clusters."
 nuragic_bronze_casting: "Bronze Casting"
 nuragic_bronze_casting_desc: "Copper, tin, tools, and skilled labor are used for modest bronze production."
 nuragic_votive_casting: "Votive Casting"
 nuragic_votive_casting_desc: "Bronze and wax are shaped into small ritual objects and prestige goods."
 nuragic_cistern_maintenance: "Water Stewardship"
 nuragic_cistern_maintenance_desc: "Stonework, pottery vessels, and tools keep the shared cistern usable through dry seasons."
