# Tag specific. Please keep alphabetical order
 country_history_EGY: "The [**GetCountry(***'EGY'***)**.**GetLongName**] stands at the heart of the ancient world, blessed by the waters of the Nile and enriched by centuries of agriculture, craftsmanship, and trade. From the fertile lands of the Delta to the great cities of Upper Egypt, the kingdom draws its strength from the river that sustains its people. Its position between the Mediterranean and the lands of the Red Sea also gives it access to merchants and goods arriving from distant lands.\n\nYet the prosperity of the Nile does not guarantee security. Powerful kingdoms and peoples surround [**GetCountry(***'EGY'***)**.**GetLongName**], while rival powers seek influence over the eastern Mediterranean and the lands beyond the Sinai. To the south, the ancient kingdoms of [**ShowRegionName(***'nubia_region'***)**] remain both trading partners and potential rivals, while to the east lie the wealthy lands of [**ShowRegionName(***'arabia_region'***)**] and the great routes leading toward the heart of Asia. Whoever controls the Nile, the Delta, and the roads connecting Egypt to its neighbors will command one of the richest lands of the ancient world.\n\nHow should the ruler of [**GetCountry(***'EGY'***)**] face the challenges to come? Will [**GetCountry(***'EGY'***)**.**GetGovernment.GetRuler.GetHeShe**] strengthen the kingdom along the Nile and preserve its ancient traditions? Will [**GetCountry(***'EGY'***)**.**GetGovernment.GetRuler.GetHeShe**] seek dominion over the eastern Mediterranean and the lands beyond the Sinai? Or will [**GetCountry(***'EGY'***)**.**GetGovernment.GetRuler.GetHeShe**] turn south and bring the lands of [**ShowRegionName(***'nubia_region'***)**] firmly under the authority of the Nile?"
 country_history_0001G: "The [**GetCountry(***'0001G'***)**.**GetLongName**] stands as the greatest power among the kingdoms of the Aegean, its strength built upon the mighty citadel of Mycenae and the many lands now brought together under a single crown. For generations, the Greek kings have guarded their independence while competing with one another for wealth, prestige, and influence. Now, for the first time, [**GetCountry(***'0001G'***)**.**GetGovernment.GetRuler.GetName**] has succeeded in bringing these rival kingdoms together beneath the authority of Mycenae.\n\nThis newfound unity has not gone unnoticed. Across the Aegean, the influence of the [**GetCultureGroupName(***'hittite_group'***)**] and the [**GetCountry(***'HIT'***)**.**GetLongName**] reaches deep into western Anatolia. Among their vassals stands the wealthy city of [**ShowLocationName(***'troy'***)**], whose position commands the approaches between the Aegean and the lands of Anatolia. Relations between the Greeks and Troy have grown increasingly hostile, and war now appears closer with every passing season.\n\nThe kings of the Aegean have gathered their ships and warriors, but whether this fragile alliance will hold once the first blood is spilled remains uncertain. A campaign against Troy could bring glory and wealth to Mycenae, yet it could just as easily place the newly-united kingdoms against the might of the Hittite world. The decisions of [**GetCountry(***'0001G'***)**.**GetGovernment.GetRuler.GetName**] may determine whether this alliance becomes the foundation of a lasting Mycenaean realm, or merely a temporary union forged in anticipation of war.\n\nWill [**GetCountry(***'0001G'***)**.**GetGovernment.GetRuler.GetHeShe**] lead the united kingdoms of Greece against [**ShowLocationName(***'troy'***)**] and challenge the Hittite influence in the Aegean? Will [**GetCountry(***'0001G'***)**.**GetGovernment.GetRuler.GetHeShe**] seek to strengthen the realm before committing to such a dangerous campaign? Or will the rival kings of Greece prove too difficult to keep united once the threat of war begins to test their loyalty?"
 country_history_HATTI: "The [**GetCountry(***'HATTI'***)**.**GetLongName**] stands among the greatest powers of the ancient world, ruling from the highlands of central Anatolia and commanding a vast network of vassals, tributary kingdoms, and fortified cities. For generations, the kings of Hatti have expanded their influence across Anatolia and into northern Syria, binding distant lands to the authority of the Great King through diplomacy, tribute, and war.\n\nYet the western frontier is becoming increasingly unsettled. The kingdoms of the Aegean have grown more united under the rising power of Mycenae, while the wealthy city of [**ShowLocationName(***'troy'***)**], a loyal vassal of Hatti, stands at the crossroads between the Aegean and Anatolia. Tensions with the Mycenaean kings are rising, and reports of ships gathering across the sea have reached the court of the Great King. Should war come, Troy may become the first battlefield in a much greater struggle for influence over the western seas.\n\nThe strength of the [**GetCountry(***'HATTI'***)**.**GetLongName**] depends upon keeping its many vassals loyal and its borders secure. To the east, rival powers and restless subjects demand attention, while in the west, Mycenae grows bolder with every passing year. The Great King must decide where to place the strength of Hatti before the fragile balance of the region is broken.\n\nWill [**GetCountry(***'HATTI'***)**.**GetGovernment.GetRuler.GetHeShe**] reinforce the western kingdoms and ensure that [**ShowLocationName(***'troy'***)**] remains loyal to Hatti? Will [**GetCountry(***'HATTI'***)**.**GetGovernment.GetRuler.GetHeShe**] turn toward the Aegean and confront the growing power of Mycenae before it becomes an even greater threat? Or will [**GetCountry(***'HATTI'***)**.**GetGovernment.GetRuler.GetHeShe**] focus on preserving the vast realm already held by the Great King, lest its many vassals begin to question the strength of their master?"


# Generic Regional
# America
# Europe
 country_history_scandinavia: "The lands of [**ShowRegionName(***'scandinavian_region'***)**] and the [**ShowRegionName(***'north_atlantic_islands_region'***)**] lie at the northern edge of the known world. Their scattered communities are bound together by kinship, seasonal migration, seafaring, and trade. The cold seas provide [**ShowGoodsName(***'fish'***)**], timber, furs, amber, and other resources sought by merchants from distant lands.\n\nYet the prosperity of these northern peoples depends upon their ability to master the sea and unite their scattered settlements. Rival chiefs compete for followers and fertile lands, while the harsh climate and long winters test every community. A strong ruler may forge these peoples into a greater power, but only if the ancient bonds of kinship can overcome the rivalries that divide them."

 country_history_ruthenia: "The lands around the great rivers of the north and east are home to scattered peoples, forests, and fortified settlements. The great waterways connect the [**ShowRegionName(***'ruthenia_region'***)**] with the Baltic, the Pontic Steppe, and the distant lands beyond. Traders, warriors, and craftsmen follow these rivers, carrying amber, furs, metals, grain, and other goods between distant peoples.\n\nYet the land is far from united. Rival tribes and chiefs compete for control of the river valleys, while mounted peoples of the [**ShowRegionName(***'steppes_region'***)**] remain a constant threat from the south. To build a lasting realm in these lands, a ruler must command the rivers, secure the forests, and bring the many peoples of the north beneath a single banner."

 country_history_france: "The lands of [**ShowRegionName(***'france_region'***)**] are inhabited by numerous peoples and communities, their territories divided by rivers, forests, mountains, and ancient rivalries. Across the region, fortified settlements and hilltop strongholds guard fertile valleys and important routes, while merchants carry metals, salt, grain, and other goods between the Atlantic coast, the Mediterranean, and the lands beyond the Rhine.\n\nPower rests in the hands of local chiefs and warrior elites, whose alliances can change as quickly as the fortunes of war. Beyond the mountains and rivers lie other peoples with their own ambitions, while the growing influence of the Mediterranean powers reaches ever farther into Gaul. The coming generations will determine whether these lands remain divided among rival peoples or whether one great power can unite them."

 country_history_britain: "The lands of [**ShowRegionName(***'great_britain_region'***)**] are divided among numerous peoples and chiefdoms, bound together by ancient traditions but separated by rivalries over land, cattle, trade, and prestige. Across the island, fortified hilltop settlements command the countryside, while coastal communities maintain contact with merchants crossing the western seas.\n\nThe wealth of the island lies in its fertile lands, livestock, metals, timber, and access to the surrounding seas. Yet its peoples must contend not only with rival chiefs but also with growing contacts and competition from across the Channel and the North Sea. In time, foreign merchants and warriors may seek to influence the island, while ambitious rulers may attempt to bring its many peoples beneath a single banner."

 country_history_balkan: "The [**ShowRegionName(***'balkan_region'***)**] stands between the great worlds of the Mediterranean, the Danube, and the Pontic Steppe. Its mountains and river valleys are home to numerous peoples, tribes, and fortified settlements, while ancient routes connect the Aegean coast with the lands of the interior.\n\nTo the south, the wealthy cities and kingdoms of the Aegean exert a growing influence, while peoples from the north and east cross the great river valleys in search of land and wealth. Warriors, merchants, and settlers compete for control of the region's fertile plains, mines, and mountain passes. The coming centuries will decide whether the peoples of the Balkans remain divided or whether a powerful kingdom can unite these lands and challenge the great powers surrounding them."

# Africa
 country_history_maghreb: "The main cultural players in the region of [ShowRegionName('maghreb_region')] are the [ShowCultureGroupName('amazigh_group')], and the [ShowCultureGroupName('arabic_group')], who have cohabited and fought one another since the invasions of the 7th century. Dynasties originating in both sides, some of mixed heritage, have risen and fallen in this region of [ShowSubContinentName('north_africa')].\n\nOnce again, division among the different nations have made them potentially vulnerable to stronger powers. Will this land become united again?"

 country_history_sahel: "The regions of the [ShowRegionName('sahel_region')] and West Africa shift gradually from the arid expanse of the Sahara Desert, to the coasts of the [ShowAreaName('gulf_of_guinea_area')], through the golden savannahs of the [ShowRegionNameWithNoTooltip('sahel_region')] and the deep jungles of the Lower Niger River. Across these expansive territories, the Empires of [GetCountry('MAL').GetName] and [GetCountry('KBO').GetName] control vast holdings as well as the Saharan trade routes, while other peoples, such as the [ShowCultureName('mossi')], [ShowCultureName('hausa')], and [ShowCultureName('yoruba')], wait for opportunities to consolidate their respective lands, and expand past their neighbors."

 country_history_kongo: "The [ShowRegionName('kongo_region')] is a land of river kingdoms and forested heartlands, where clans and chieftains forge alliances through blood, trade, and war. In recent decades, ambitious rulers have begun to bind these lands into greater realms, each seeking to dominate the fertile valleys and control the flow of goods along the great river.\n\nThe balance of power remains fragile, and in the decades ahead, a single strong leader could unite the [ShowCultureName('kongo')] people... or plunge them into a cycle of endless rivalry, weakened and exploitable by outsiders."

 country_history_east_africa: "From the fertile banks of the Nile to the stunning coastlines of [ShowRegionName('madagascar_region')]; from the ancient ports of [ShowRegionName('somalia_region')] to the vibrant communities of the [ShowRegionName('swahili_coast_region')], a myriad of nations have confronted both the forces of nature, and the incursions of would-be conquerors, and remained steadfast. This is a land of opportunity, with abundant riches waiting to be collected and used to forge a mighty empire whose reach extends across the seas."

# Asia
 country_history_anatolia: "The lands of [**ShowRegionName(***'anatolia_region'***)**] stand at the crossroads of many worlds. Great kingdoms and peoples have risen and fallen across this rugged plateau, leaving behind fortified cities, ancient roads, and long memories of war. Hittite kings, Luwian princes, Phrygian warriors, and many other peoples have each sought to command these lands, yet none have found it easy to hold them for long. *$anatolia_desc$*"

 anatolia_desc: "The balance of power in [**ShowRegionName(***'anatolia_region'***)**] is constantly shifting. Old kingdoms weaken, ambitious rulers gather their armies, and new peoples arrive from beyond the mountains and seas. Whoever commands the great river valleys, mountain passes, and wealthy cities of Anatolia may become a power capable of challenging the great kingdoms of the surrounding world."

 country_history_caucasus: "The [**ShowRegionName(***'caucasus_region'***)**] has always been a world unto its own. Great mountains divide its valleys and peoples, while the passes through them connect the Black Sea, Anatolia, the Iranian Plateau, and the northern steppe. Kingdoms and tribal peoples have risen among these mountains, guarding their independence against every power that seeks to cross them.\n\nTo control the Caucasus is to command the roads between great civilizations. Yet the mountains themselves are difficult to conquer, and the peoples who dwell among them are fiercely attached to their lands and traditions. Assyria, Urartu, and the great kingdoms to the south may seek to extend their influence here, but the future will belong to those who can unite the scattered peoples of the mountains and master the passes that bind them together."

 country_history_middle_east: "Across the lands of [**ShowRegionName(***'egypt_region'***)**], [**ShowRegionName(***'crescent_region'***)**], and [**ShowRegionName(***'arabia_region'***)**], the oldest civilizations of the known world meet. The great rivers of Egypt and Mesopotamia sustain powerful kingdoms, while the Levant forms a narrow bridge between them. Beyond the settled lands, the deserts of Arabia are crossed by pastoral peoples and merchants carrying goods between distant settlements.\n\nThe region has long been contested by ambitious kings. Egypt, the kingdoms of Mesopotamia, Anatolian powers, and the peoples of the Levant all seek influence over its fertile valleys, ports, caravan routes, and sacred cities. Whoever can command these lands will possess the crossroads between Africa, Asia, and the Mediterranean."

 country_history_china: "The lands of *$china$* are home to some of the oldest kingdoms and cities of the eastern world. Along the great rivers, powerful rulers command fertile plains, fortified settlements, and armies of bronze-armed warriors. The traditions of the ancient royal houses have shaped the customs, rituals, and political ambitions of countless peoples, while the wealth of the eastern plains draws merchants and envoys from distant lands.\n\nYet these lands are far from united. Rival kingdoms compete for territory and prestige, while peoples beyond the northern frontier constantly test the strength of the settled states. The rulers who can gather the greatest armies, control the richest river valleys, and claim the Mandate of Heaven may forge an empire capable of dominating the eastern world."

 country_history_indonesia: "[**ShowRegionName(***'indonesia_region'***)**] is a land of countless islands, separated by narrow seas yet bound together by ancient traditions of seafaring and exchange. Its peoples have long travelled between the islands, trading [**ShowGoodsName(***'fish'***)**], spices, precious woods, and other goods from distant shores. The waters of [**ShowRegionNameWithNoTooltip(***'indonesia_region'***)**] form part of the great maritime routes connecting the lands of *$india$* and *$china$*, bringing foreign merchants, customs, and beliefs to its shores.\n\nThe influence of [**ShowReligionName(***'hindu'***)**] and [**ShowReligionGroupName(***'buddhist'***)**] traditions is beginning to reach these distant islands, mingling with ancient local beliefs and customs. Yet no single power commands the archipelago, and the many island communities remain divided among chiefs, coastal settlements, and emerging kingdoms. Whoever masters these seas may one day control one of the richest crossroads of the eastern world."

 country_history_indochina: "Lying between the great civilizations of *$india$* and *$china$*, [**ShowRegionName(***'indochina_region'***)**] has long stood at the crossroads of peoples, cultures, and trade. Fertile river valleys sustain growing settlements, while the great waterways provide natural routes for merchants and armies alike. Ancient kingdoms are beginning to emerge from these lands, competing for control of fertile plains and important river passages.\n\nIndian merchants and religious traditions are spreading eastward, while the influence of *$china$* reaches south through trade, diplomacy, and migration. Yet neither great civilization fully commands [**ShowRegionNameWithNoTooltip(***'indochina_region'***)**]. The region remains divided between numerous peoples and emerging powers, and the coming centuries may see one of them rise above the rest."

  # Generic Continental
  # America
 country_history_america: "Across the lands of [**ShowContinentName(***'america'***)**], countless peoples have built their lives according to the rivers, forests, mountains, plains, and coasts that surround them. Communities have developed their own traditions, trade networks, sacred places, and ways of life, while distant peoples remain separated by vast wildernesses.\n\nOur ancestors have endured changing climates, migrations, rivalries, and the constant struggle to make a living from the land. Some peoples have gathered into great settlements, while others continue to follow seasonal paths through the wilderness. Whether we preserve the traditions handed down by our ancestors or forge a new path will determine the future of our people."

 # Europe
 country_history_europe: "The lands of [**ShowContinentName(***'europe'***)**] are home to countless peoples, kingdoms, tribes, and fortified settlements. From the shores of the Mediterranean to the forests of the north and the great rivers of the east, communities compete for fertile lands, metals, trade routes, and control of the seas. The wealth of the southern kingdoms has begun to reach ever farther into the lands of the north and west, bringing new goods, technologies, and ideas.\n\nBronze weapons and chariots have transformed warfare, while iron is beginning to spread among the peoples of the continent. Great kingdoms may rise from this age of upheaval, but old powers can fall just as quickly. The coming generations will determine which peoples master these changes and which are swept aside by them."

  # Africa
 country_history_africa: "The lands of [**ShowContinentName(***'africa'***)**] are among the most diverse in the known world. Great river valleys sustain settled farmers, vast savannas support pastoral peoples, forests shelter countless communities, and deserts separate distant lands while also carrying merchants and travelers along ancient routes.\n\nAlong the Nile, powerful kingdoms have risen beside one of the world's greatest rivers, while farther west and south other peoples have developed their own traditions, crafts, and systems of exchange. Gold, copper, ivory, livestock, salt, and other resources connect communities across great distances. Despite the barriers of desert, forest, and mountain, Africa's peoples are bound together by networks of migration, trade, and cultural exchange that have endured for generations."
  # Asia
 country_history_asia: "The lands of [**ShowContinentName(***'asia'***)**] stretch across an immense world of mountains, deserts, fertile river valleys, forests, and great plains. From the kingdoms of *$china$* in the east to the ancient civilizations of *$india$*, Mesopotamia, and the Iranian Plateau, powerful societies have risen beside the great rivers and along the routes that connect them.\n\nLong-distance trade carries metals, horses, precious stones, textiles, spices, and other goods across deserts and mountains, while merchants and travelers carry languages, technologies, beliefs, and customs with them. No single power commands this vast continent, but the kingdoms and peoples that learn to control its rivers, passes, and trade routes may build realms unlike anything seen before. The age ahead promises both prosperity and conflict."

  # Fallback
 country_history_fallback: "In this pivotal moment, our nation faces new opportunities and challenges. As global trade routes expand, we stand to benefit from novel ideas, goods, and cultural exchanges. However, maintaining our traditions and sovereignty amid these shifts remains a critical task.\n\nOur country must choose whether to focus on enhancing cultural richness or fortifying military strength. Our decisions will shape our nation's future trajectory in this increasingly interconnected world."
