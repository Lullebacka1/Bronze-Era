l_english:
 ISRAEL_f: "Israel"
 ISRAEL_f_desc: "The highland cities of Safed, Shechem, Jaffa and Irbid can be bound into a Canaanite kingdom once foreign overlordship has been thrown off."
 JUDAH_f: "Judah"
 JUDAH_f_desc: "Jerusalem, Hebron and Beersheba can be gathered into a southern hill kingdom rooted in Canaanite rites and local royal authority."
 MOAB_f: "Moab"
 MOAB_f_desc: "Madaba and Karak can be joined into the kingdom of Moab, a compact Transjordanian crown controlling the roads east of the Dead Sea."
 EDOM_f: "Edom"
 EDOM_f_desc: "Sughar, Shoubak and Maan can be united into Edom, a highland kingdom of southern marches, caravan tracks and defended uplands."
 ARDAM_f: "Aram-Damascus"
 ARDAM_f_desc: "The oases, plains and roads around Damascus can be gathered into an Aramaean kingdom centered on the royal city of Damascus."
 AMMON_f: "Ammon"
 AMMON_f_desc: "Amman and Bosra can be united into Ammon, a hill kingdom controlling the eastern approaches to Canaan."
 PHILST_f: "Philistine States"
 PHILST_f_desc: "Gaza and Majdal can be bound into a Peleset coastal kingdom, using maritime trade, raiding traditions and fortified ports to dominate the southern coast."
 PHO_f: "Phoenicia"
 PHO_f_desc: "The Phoenician port kingdoms of Sidon, Byblos, Berit and Arwad can be bound with Akshaph into a maritime kingdom of purple dye, cedar ships and eastern sea trade."
 bronze_canaanite_kingdom_foundation: "Canaanite Kingdom Foundation"
 bronze_canaanite_kingdom_foundation_desc: "This kingdom has unified its local city lands into a durable Canaanite crown. Levies, legitimacy and local control improve modestly."
 bronze_philistine_maritime_states: "Peleset Maritime States"
 bronze_philistine_maritime_states_desc: "The Philistine cities organize ships, ports and coastal workshops into a stronger maritime economy."
 bronze_phoenician_maritime_kingdom: "Phoenician Maritime Kingdom"
 bronze_phoenician_maritime_kingdom_desc: "The Phoenician cities coordinate harbors, timber routes, dye workshops and ship crews into a stronger commercial sea power."
 bronze_phoenician_merchant_republic: "Council of the Harbors"
 bronze_phoenician_merchant_republic_desc: "Merchant houses, temple treasuries and harbor elders guide the new Phoenician state through civic assemblies and commercial patronage."
 bronze_phoenician_royal_thalassocracy: "Royal Thalassocracy"
 bronze_phoenician_royal_thalassocracy_desc: "A royal house claims command over the Phoenician harbors, binding ships, levies and dynastic legitimacy into a single maritime crown."
 bronze_formed_canaanite_kingdom: "Formed a Canaanite Kingdom"
 bronze_formed_canaanite_kingdom_desc: "This country has formed one of the Canaanite regional kingdoms."
 bronze_formed_philistine_states: "Formed the Philistine States"
 bronze_formed_philistine_states_desc: "This country has formed the Philistine States."
 bronze_formed_phoenicia: "Formed Phoenicia"
 bronze_formed_phoenicia_desc: "This country has united the Phoenician city kingdoms."
 bronze_phoenicia.1.title: "The Harbors Decide"
 bronze_phoenicia.1.desc: "Sidon, Byblos, Berit, Arwad and Akshaph now answer to one Phoenician authority. The ports are wealthy, but the new kingdom must decide whether power rests with a royal house or with the councils of merchants, temple treasuries and harbor elders."
 bronze_phoenicia.1.a: "Let the harbor councils govern."
 bronze_phoenicia.1.b: "Raise a king over the purple coast."
 bronze_phoenicia_1a_tt: "Phoenicia becomes a republic and gains a permanent modest bonus to republican tradition, stability investment and construction speed."
 bronze_phoenicia_1b_tt: "Phoenicia remains a monarchy and gains a permanent modest bonus to legitimacy, levies and land morale."
