l_english:
  bronze_age_triumphal_monument: "Triumphal Monument"
  bronze_age_triumphal_monument_desc: "A monument erected to commemorate military victories, royal achievements, dynastic foundations, or other events deemed worthy of remembrance. Through inscriptions, reliefs, and public display, such monuments proclaim authority and preserve memory for future generations."

  megalithic_religious_monument: "Megalithic Sanctuary"
  megalithic_religious_monument_desc: "Raised through the collective labor of entire communities, these great stone monuments serve as centers of ritual, assembly, and ancestral remembrance. Their enduring presence reinforces shared traditions, sacred authority, and the cultural identity of the surrounding population."

  bronze_monumental_gates: "Monumental Gates"
  bronze_monumental_gates_desc: "Grand gates transform a city's walls from mere fortifications into symbols of power and prestige. Decorated with reliefs, inscriptions, sculptures, and costly materials, they proclaim the wealth, authority, and cultural achievements of the community to all who enter."


# PRODUCTION AND MAINTENANCE METHODS

  bronze_age_triumphal_monument_maintenance_simple: "Monument Upkeep"
  bronze_age_triumphal_monument_maintenance_simple_desc: "Artisans and laborers maintain inscriptions, decorative elements, and ceremonial surroundings, ensuring that the monument continues to project prestige and authority."

  megalithic_religious_monument_maintenance_simple: "Ritual Observances"
  megalithic_religious_monument_maintenance_simple_desc: "Ceremonies, offerings, feasts, and periodic upkeep preserve the sanctity of the monument and maintain its role as a focal point of religious and communal life."

  bronze_age_triumphal_monument_maintenance_simple: "Gate Upkeep"
  bronze_age_triumphal_monument_maintenance_simple_desc: "The gates require continual maintenance of their masonry, wooden structures, metal fittings, decorations, and ceremonial features to preserve both their defensive function and symbolic grandeur."

# CONSTRUCTION COSTS

  bronze_age_monument_construction: "Monumental Construction"
  bronze_age_monument_construction_desc: "The construction of a monumental structure requires vast quantities of building materials, skilled craftsmen, precious resources, and organized labor. Such projects serve as enduring symbols of authority, faith, and collective achievement."

  neolithic_monument_construction: "Megalithic Construction"
  neolithic_monument_construction_desc: "The raising of great stone monuments demands the coordinated effort of entire communities. Quarrying, transporting, and erecting massive stones requires careful organization, communal labor, and substantial resources."
