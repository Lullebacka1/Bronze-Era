l_english:
  bronze_age_tablets: "Writing Tablets"
  bronze_age_tablets_desc: "The invention of writing tablets allows for the recording of information, communication, and the development of complex administrative systems in Bronze Age societies."

  fine_pottery: "Fine Pottery"
  fine_pottery_desc: "Skilled potters produce carefully shaped and finished vessels, distinguished by finer fabrics, more regular forms, and greater attention to decoration. Such wares serve households, feasts, trade, and ceremonial use, reflecting the growing specialization of ceramic craft."