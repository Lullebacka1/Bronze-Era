l_english:
  religious_tolerance_reform: "Religious Tolerance"
  religious_tolerance_reform_desc: "The administration permits different religious communities to retain their established rites and institutions, reducing the need for direct state intervention in matters of local worship."

  thalassocracy_reform: "Thalassocracy"
  thalassocracy_reform_desc: "The state places maritime affairs among its principal concerns, directing greater administrative attention toward ports, shipping, naval forces, and the communities that sustain them."

  agricultural_cultivation_reform: "Agricultural Cultivation"
  agricultural_cultivation_reform_desc: "The administration takes a more active role in organizing and encouraging the productive use of agricultural land. Improved oversight of cultivation and related resources strengthens the material foundations of the state."

  religious_laws_enforced_reform: "Enforced Religious Law"
  religious_laws_enforced_reform_desc: "Religious customs become more closely incorporated into the administration of the realm, with officials entrusted to uphold established religious obligations and regulate conduct accordingly."

  vassal_obligation_decree_reform: "Vassal Obligations"
  vassal_obligation_decree_reform_desc: "The duties owed by subordinate rulers and communities are increasingly defined and enforced through established obligations. Tribute, military service, and other forms of support become more regular elements of state administration."

  literate_aristocracy_reform: "Literate Aristocracy"
  literate_aristocracy_reform_desc: "Members of the aristocracy increasingly acquire the literacy needed to participate in the work of government. Their ability to read, write, and maintain records provides the court with a broader pool of capable administrators."

  diplomatic_traditions_reform: "Diplomatic Traditions"
  diplomatic_traditions_reform_desc: "The state develops established practices for conducting relations with foreign rulers, giving envoys and other representatives recognized procedures for negotiation, communication, and the maintenance of diplomatic ties."

  patrimonialism_reform: "Patrimonialism"
  patrimonialism_reform_desc: "The ruler's household serves as the foundation of government, with political authority exercised through personal relationships of loyalty and dependence. Administrative responsibilities are entrusted to members of the ruler's wider household and personal following."

  trade_office_network_reform: "Trade Office Network"
  trade_office_network_reform_desc: "The state develops a network of offices and appointed representatives to oversee commerce in distant markets. These establishments provide the administration with a regular presence abroad and facilitate the movement and supervision of foreign trade."

  merchant_seals_reform: "Merchant Seals"
  merchant_seals_reform_desc: "The administration adopts established seals and marks to authenticate commercial documents, goods, and transactions. Such practices make it easier to identify legitimate merchants and maintain reliable records across the state's commercial networks."

  multilingual_diplomats_reform: "Multilingual Diplomats"
  multilingual_diplomats_reform_desc: "Diplomatic representatives acquire greater familiarity with the languages used by neighboring courts and peoples. This allows state representatives to conduct negotiations and correspondence more effectively across linguistic boundaries."