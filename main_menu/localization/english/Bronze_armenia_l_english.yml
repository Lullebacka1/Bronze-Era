l_english:
 ARM: "Armenia"
 ARM_ADJ: "Armenian"
 AZZI_HAJAS: "Azzi-Hayasa-Urartu"
 AZZI_HAJAS_ADJ: "Azzi-Hayasa-Urartian"
 armenian_culture: "Armenian"
 armenian_culture_ADJ: "Armenian"
 armenian_pagan: "Armenian Rites"
 armenian_pagan_ADJ: "Armenian"
 armenian_pagan_desc: "A highland religious tradition centered on sacred mountains, royal ancestors, warrior cults and local sanctuaries."
 BRONZE_ARMENIA_f: "Form the Great Kingdom of Armenia"
 BRONZE_ARMENIA_f_desc: "The highlands around Ararat, Van and the upper Euphrates can be bound into a new Armenian kingdom, joining older Hayasan, Urartian and Caucasian traditions under one royal house."
 bronze_azzi_hayasa_unify_confederation: "Unify the Highland Confederation"
 bronze_azzi_hayasa_unify_confederation_desc: "Integrate the junior partners of the highland union into a single Armenian confederation joining Azzi, Hayasa and Urartu."
 bronze_azzi_hayasa_unify_tt: "The union partners are integrated. Our state adopts an Armenian identity, and Urartian communities across the map adopt Armenian culture."
 bronze_armenia_urartian_conversion_tt: "Urartian communities across the map adopt Armenian culture."
 bronze_azzi_hayasa_confederation: "Azzi-Hayasa Confederation"
 bronze_azzi_hayasa_confederation_desc: "The highland houses of Azzi, Hayasa and Urartu have been joined into one confederation, strengthening royal control over the Armenian highlands."
 bronze_armenia_foundation: "Great Armenian Kingship"
 bronze_armenia_foundation_desc: "The royal house claims authority over the Armenian highlands and the mountain corridors between Anatolia, the Caucasus and Mesopotamia."
 bronze_yerevan_foundation_site: "Royal Foundation at Yerevan"
 bronze_yerevan_foundation_site_desc: "New walls, storehouses and palace workshops mark Yerevan as a royal center of the highlands."
 bronze_armenia.1.title: "The Foundation at Yerevan"
 bronze_armenia.1.desc: "The hill country around Yerevan has become a natural gathering point for highland chiefs, scribes and warrior retinues. With enough royal treasure, the settlement can be raised into a fortified city and palace center, giving the Armenian highlands a durable political heart."
 bronze_armenia.1.a: "Raise the walls and palace."
 bronze_yerevan_foundation_1a_tt: "Spend #negative_value 200#! gold. Yerevan becomes a city, gains City Walls and a Palatial Complex, and our country adopts the name Armenia. We gain #positive_value 10#! Stability, #positive_value 20#! Legitimacy and #positive_value 20#! Prestige."
