l_english:

  warrior_lodges: "Warrior Lodges"
  warrior_lodges_desc: "Young warriors, retainers, and fighting men gather in communal lodges where they train, feast, and prepare for military service. These institutions strengthen martial traditions while providing communities with a pool of experienced fighters that can be called upon in times of need."

  warrior_lodges_maintenance: "Warrior Retinues"
  warrior_lodges_maintenance_desc: "Weapons, clothing, provisions, and hunting supplies are provided to the lodge's inhabitants in exchange for military service, training, and participation in communal defense."