l_english:
 bronze_rome_foundation.1.title: "The Foundation of Rome"
 bronze_rome_foundation.1.desc: "On the banks of the Tiber, a fortified Latin settlement gathers around a new royal house. Its elders speak of omens, cattle paths, border stones and a city that may command the hills of Latium. If recognized, Rome will stand apart as a young kingdom."
 bronze_rome_foundation.1.a: "Raise the wolf banner over Rome."
 bronze_rome_foundation.1.b: "Keep the settlement under the Latin kings."
 bronze_rome_foundation.2.title: "The Settlement on the Tiber"
 bronze_rome_foundation.2.desc: "Latin settlers and warrior bands around the Tiber ask to form their own city under a new king. Granting them independence will create Rome, but refusing them will keep the river crossing under our direct rule."
 bronze_rome_foundation.2.a: "Permit the foundation of Rome."
 bronze_rome_foundation.2.b: "Absorb the settlement into our realm."
 bronze_rome_foundation_1a_tt: "Rome is created as an independent Latial kingdom in the location of Rome. You will continue as Rome."
 bronze_rome_foundation_1b_tt: "Rome is not created. The settlement remains under your current country and receives a smaller local bonus. This refusal does not permanently block Rome if another ruler later controls the Tiber."
 bronze_rome_foundation_2a_tt: "Rome is created as an independent Latial kingdom. Your country loses the location of Rome by choice."
 bronze_rome_foundation_2b_tt: "Rome is not created. The settlement remains under your current country and receives a smaller local bonus. This refusal does not permanently block Rome if another ruler later controls the Tiber."
 bronze_rome_foundation_momentum: "Foundation Momentum"
 bronze_rome_foundation_momentum_desc: "The new kingdom of Rome draws prestige, settlers and aristocratic support from the foundation rites on the Tiber."
 bronze_rome_foundation_site: "Foundation Site of Rome"
 bronze_rome_foundation_site_desc: "The newly recognized settlement is attracting warriors, migrants and local nobles around its fortified river crossing."
 bronze_rome_absorbed_settlement: "Absorbed Tiber Settlement"
 bronze_rome_absorbed_settlement_desc: "The Latin settlement on the Tiber has been folded into the existing realm rather than allowed to become a separate kingdom."
