l_english:
 bronze_monument_giza_pyramid_complex: "Giza Pyramid Complex"
 bronze_monument_giza_pyramid_complex_desc: "The royal pyramid fields of Giza proclaim the enduring divine authority of Egypt's kings."
 bronze_monument_karnak_complex: "Karnak Temple Complex"
 bronze_monument_karnak_complex_desc: "A vast sacred enclosure sustained by royal gifts, priestly service, and the wealth of the Nile."
 bronze_monument_luxor_temple: "Luxor Temple"
 bronze_monument_luxor_temple_desc: "A royal sanctuary devoted to divine kingship and the renewal of sovereign authority."
 bronze_monument_abu_simbel: "Temples of Abu Simbel"
 bronze_monument_abu_simbel_desc: "Rock-cut temples that bind royal cult, frontier power, and the sacred landscape of Nubia."
 bronze_monument_theban_necropolis: "Theban Necropolis"
 bronze_monument_theban_necropolis_desc: "Royal tombs, mortuary temples, and priestly estates preserve the memory of Egypt's sovereigns."
 bronze_monument_hattusa_complex: "Monumental Complex of Hattusa"
 bronze_monument_hattusa_complex_desc: "The Great Temple, royal gates, and nearby sanctuary embody the authority of the Great King."
 bronze_monument_mycenae_citadel: "Citadel of Mycenae"
 bronze_monument_mycenae_citadel_desc: "Cyclopean walls, royal tombs, and the Lion Gate dominate the Argolid from the seat of the wanax."
 bronze_monument_tiryns_cyclopean: "Cyclopean Fortifications of Tiryns"
 bronze_monument_tiryns_cyclopean_desc: "Massive stone walls protect one of the strongest citadels of the Mycenaean world."
 bronze_monument_pylos_palace: "Palace of Pylos"
 bronze_monument_pylos_palace_desc: "A palace of archives, storerooms, workshops, and agricultural administration."
 bronze_monument_troy_citadel: "Citadel of Troy"
 bronze_monument_troy_citadel_desc: "A fortified citadel commanding the approaches between the Aegean and the straits."
 bronze_monument_knossos_complex: "Palatial Complex of Knossos"
 bronze_monument_knossos_complex_desc: "The surviving palace complex remains a powerful symbol of Cretan administration and sacred kingship."
 bronze_monument_ugarit_complex: "Royal Complex of Ugarit"
 bronze_monument_ugarit_complex_desc: "Palace archives, temples, and harbor commerce connect the city to every shore of the eastern sea."
 bronze_monument_ur_ziggurat: "Great Ziggurat of Ur"
 bronze_monument_ur_ziggurat_desc: "The monumental temple platform of Ur dominates the sacred and political life of the city."
 bronze_monument_assur_complex: "Sacred Complex of Assur"
 bronze_monument_assur_complex_desc: "Temple, palace, and trading institutions gather around the holy city of the Assyrians."
 bronze_monument_chogha_zanbil: "Ziggurat of Chogha Zanbil"
 bronze_monument_chogha_zanbil_desc: "An Elamite sacred city centered on a towering ziggurat raised for the gods of the highlands and lowlands."
 bronze_monument_yin_xu: "Royal Complex of Yin Xu"
 bronze_monument_yin_xu_desc: "Palaces, ancestral sanctuaries, royal tombs, and workshops form the ceremonial heart of Shang power."
 bronze_monument_su_nuraxi: "Nuragic Complex of Su Nuraxi"
 bronze_monument_su_nuraxi_desc: "A fortified nuraghe and surrounding settlement command the Sardinian interior."
 bronze_monument_stonehenge: "Stonehenge"
 bronze_monument_stonehenge_desc: "The great stone circle remains a focus of ceremony, memory, and seasonal gathering."
 bronze_monument_avebury: "Avebury Sacred Landscape"
 bronze_monument_avebury_desc: "Circles, avenues, and earthworks shape a broad ceremonial landscape."
 bronze_monument_bru_na_boinne: "Brú na Bóinne"
 bronze_monument_bru_na_boinne_desc: "Ancient passage tombs and sacred mounds preserve the authority of distant ancestors."
 bronze_monument_great_pyramid_new: "Great Pyramid Complex"
 bronze_monument_great_pyramid_new_desc: "A new royal pyramid and mortuary complex built through decades of quarrying, transport, and organized labor."
 bronze_monument_great_pyramid_unfinished: "Unfinished Great Pyramid"
 bronze_monument_great_pyramid_unfinished_desc: "Quarried stone, ramps, foundations, and abandoned work camps mark an immense royal project awaiting completion."
