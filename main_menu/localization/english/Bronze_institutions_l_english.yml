l_english:

  # BRONZE AGE (AGE 1)

  bronze_routes: "Long Distance Trade Networks"
  bronze_routes_desc: "Long-distance trade networks refer to the complex systems of trade and commerce that connect different regions and civilizations across vast distances. These networks facilitate the exchange of goods, ideas, and cultural influences between societies."

  palatial_economy: "Palace Economy"
  palatial_economy_desc: "The palace economy is a system of economic organization in which the ruling elite, often centered around a palace or royal court, controls and manages the production and distribution of goods and resources."

  chariot_warfare: "Warrior Aristocracy"
  chariot_warfare_desc: "The warrior aristocracy is a social class or group of individuals who hold power and influence primarily through their military prowess and leadership."

  # IRON AGE (AGE 2)

  commercial_counters: "Alphabetic Writing"
  commercial_counters_desc: "Writing systems based on a limited set of signs representing individual sounds make literacy easier to adapt and transmit between languages. Their relative simplicity allows writing to spread beyond specialized scribal traditions into trade, administration, and wider social use."

  iron_metallurgy: "Iron Metallurgy"
  iron_metallurgy_desc: "The working of iron develops into a major metallurgical tradition, as smiths learn to smelt, refine, and forge iron into useful tools and weapons. Its widespread adoption expands access to durable metal implements and gradually reduces dependence on bronze for many purposes."

  peer_polities: "Peer Polities"
  peer_polities_desc: "Independent communities of comparable strength develop in close proximity, competing and interacting through warfare, trade, diplomacy, and imitation. Their rivalry encourages political experimentation, cultural exchange, and the rapid spread of new practices between neighboring societies."