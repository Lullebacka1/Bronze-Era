l_english:
 bronze_city_razing.1.title: "The City Has Fallen"
 bronze_city_razing.1.desc: "[bronze_captured_city.GetName] is under our control. The gates are open, the stores are exposed, and the fate of the people now rests with the victorious army."
 bronze_city_razing.1.a: "Occupy the city."
 bronze_city_razing.1.b: "Sack the city."
 bronze_city_razing.1.c: "Raze it to the ground."
 bronze_city_razing.2.title: "The Sack Is Complete"
 bronze_city_razing.2.desc: "The sack order at [bronze_captured_city.GetName] has reached its end. If our army still holds the city, the plunder is completed. If the army withdrew or the city was relieved, the action is interrupted and only early damage remains."
 bronze_city_razing.2.a: "Take the spoils."
 bronze_city_razing.3.title: "The City Is Broken"
 bronze_city_razing.3.desc: "The razing order at [bronze_captured_city.GetName] has reached its end. If our army still holds the city, the destruction is completed. If the city has been liberated, the operation is interrupted, though the first damage has already been done."
 bronze_city_razing.3.a: "Resolve the razing order."
 bronze_city_razing.9.title: "Ruins Await Exploration"
 bronze_city_razing.9.desc: "Old walls, broken shrines, and buried storerooms still stand within our lands. Scribes and adventurers believe an expedition to [bronze_ruins_site.GetName] could recover valuables, records, or royal remains from a destroyed city."
 bronze_city_razing.9.a: "Fund the expedition."
 bronze_city_razing.9.b: "Leave the dead city alone."
 bronze_city_razing.10.title: "The Expedition Reaches the Ruins"
 bronze_city_razing.10.desc: "The expedition has reached the shattered remains of [bronze_ruins_site.GetName]. The first chambers are unstable, but the guides insist the deeper passages may still hold something worth the cost."
 bronze_city_razing.10.a: "Press deeper into the ruins."
 bronze_city_razing.10.b: "Withdraw before more is lost."
 bronze_city_razing.11.title: "A Lost Expedition"
 bronze_city_razing.11.desc: "The expedition has returned late, hungry, and badly reduced. Collapsed passages, sickness, and hostile country consumed much of the effort before anything useful could be recovered."
 bronze_city_razing.11.a: "Write off the losses."
 bronze_city_razing.12.title: "Hidden Treasure"
 bronze_city_razing.12.desc: "A sealed storeroom beneath the ruins has yielded metalwork, stored valuables, and ritual gifts hidden during the city's final days."
 bronze_city_razing.12.a: "Bring the treasure to the palace."
 bronze_city_razing.13.title: "Ancient Texts Found"
 bronze_city_razing.13.desc: "Scribes have recovered damaged tablets and inscriptions from the ruins. Much is fragmentary, but enough remains to preserve lost administrative and ritual knowledge."
 bronze_city_razing.13.a: "Send the texts to our scholars."
 bronze_city_razing.14.title: "A Royal Burial Chamber"
 bronze_city_razing.14.desc: "The expedition has uncovered a chamber prepared for a forgotten ruler. Its contents are modestly useful, but its ceremonial importance is far greater."
 bronze_city_razing.14.a: "Honor the dead and record the discovery."
 bronze_city_razing.15.title: "The Sacred Curse"
 bronze_city_razing.15.desc: "The workers whisper that the buried gods have been disturbed. Whether curse, sickness, or fear, the expedition's return has brought unease to the court."
 bronze_city_razing.15.a: "Make offerings and end the work."
 bronze_city_razing_1a_tt: "The city is occupied with minimal additional damage."
 bronze_city_razing_1b_tt: "Begins a two-week sack from the army that captured the city. The location receives a visible sacking marker. Player armies may move away to cancel; AI armies are locked until resolution. If an army is still present and we still control the city when the sack ends, we gain loot, the city loses prosperity, population, food, and City Prestige, and civilian losses add bonus warscore."
 bronze_city_razing_1c_tt: "Begins a two-week razing operation from the army that captured the city. The location receives a visible razing marker. Player armies may move away to cancel; AI armies are locked until resolution. If an army is still present and we still control the city when the razing ends, the city suffers heavy population loss, building destruction, rank downgrade, severe prosperity loss, and civilian losses add bonus warscore. If the action is interrupted, partial damage is applied."
 bronze_city_razing_2a_tt: "If our army is still in the city, apply the final sack: loot, population loss, food loss, prosperity damage, City Prestige loss, and bonus warscore from civilian losses. If the army left or the city was relieved, interrupt the sack and apply only minor damage."
 bronze_city_razing_3a_tt: "If our army is still in the city, apply the final razing: loot, major population loss, building destruction, settlement rank downgrade, City Prestige removal if the location is no longer a city, and bonus warscore from civilian losses. If the army left or the city was relieved, interrupt the razing and apply partial damage."
 bronze_city_razing_9a_tt: "Spend 50 gold to begin a ruins expedition. Results will arrive after several months."
 bronze_city_razing_9b_tt: "No expedition is launched."
 bronze_city_razing_10a_tt: "Spend 20 additional gold and continue. The expedition may discover treasure, texts, a burial chamber, or suffer losses."
 bronze_city_razing_10b_tt: "End the expedition and mark the ruin as recently explored."
 bronze_city_razing_11a_tt: "Lose additional gold and prestige. The expedition ends."
 bronze_city_razing_12a_tt: "Gain gold and prestige. The expedition ends."
 bronze_city_razing_13a_tt: "Gain research progress and prestige. The expedition ends."
 bronze_city_razing_14a_tt: "Gain gold and prestige. The expedition ends."
 bronze_city_razing_15a_tt: "Lose stability and prestige. The expedition ends."
 bronze_city_capture_occupy_effect_tt: "Orderly Occupation"
 bronze_city_start_sack_effect_tt: "Begin Sack"
 bronze_city_start_unit_sack_effect_tt: "The army begins a two-week pillage operation. It is exposed and tied to the occupied city until the action ends."
 bronze_city_sack_interrupted_effect_tt: "Sack Interrupted"
 bronze_city_sack_effect_tt: "Sack City"
 bronze_city_start_raze_effect_tt: "Begin Razing"
 bronze_city_start_unit_raze_effect_tt: "The army begins a two-week razing operation. It is exposed and tied to the occupied city until the action ends."
 bronze_city_raze_interrupted_effect_tt: "Razing Interrupted"
 bronze_city_raze_effect_tt: "Raze City"
 bronze_city_create_ancient_ruins_effect_tt: "The destroyed city becomes permanent Ancient Ruins."
 bronze_ruins_start_expedition_effect_tt: "A funded expedition is sent to an ancient ruin."
 STATIC_MODIFIER_NAME_bronze_city_orderly_occupation: "Orderly Occupation"
 STATIC_MODIFIER_DESC_bronze_city_orderly_occupation: "The city has been taken under controlled occupation rather than abandoned to uncontrolled plunder."
 STATIC_MODIFIER_NAME_bronze_city_being_sacked: "Being Sacked"
 STATIC_MODIFIER_DESC_bronze_city_being_sacked: "Soldiers are stripping the city of valuables, food, captives, and prestige."
 STATIC_MODIFIER_NAME_bronze_city_recently_sacked: "Recently Sacked"
 STATIC_MODIFIER_DESC_bronze_city_recently_sacked: "The city's markets, households, and reputation have not recovered from a recent sack."
 STATIC_MODIFIER_NAME_bronze_city_razing_underway: "Razing Underway"
 STATIC_MODIFIER_DESC_bronze_city_razing_underway: "The occupying army is dismantling the city over two weeks. If the city is liberated before completion, the razing is interrupted but partial damage remains."
 STATIC_MODIFIER_NAME_bronze_city_razed: "Razed City"
 STATIC_MODIFIER_DESC_bronze_city_razed: "Much of the settlement has been deliberately destroyed."
 STATIC_MODIFIER_NAME_bronze_city_severe_ruins: "Severe Ruins"
 STATIC_MODIFIER_DESC_bronze_city_severe_ruins: "Large parts of the city are shattered, abandoned, or unusable. This is a visual marker; the damage is handled by the razed city modifier."
 STATIC_MODIFIER_NAME_bronze_ancient_ruins_location: "Ancient Ruins"
 STATIC_MODIFIER_DESC_bronze_ancient_ruins_location: "This location preserves the remains of a destroyed Bronze Age city. This marker has no direct gameplay effect."
 STATIC_MODIFIER_NAME_bronze_ruins_expedition_camp: "Ruins Expedition Camp"
 STATIC_MODIFIER_DESC_bronze_ruins_expedition_camp: "Scribes, laborers, guards, and guides are working through the remains of an ancient city."
 bronze_ruins_button: "Ancient Ruins"
 bronze_ruins_button_desc: "Open the Ancient Ruins panel for this location."
 bronze_ruins_panel_title: "Ancient Ruins"
 bronze_ruins_panel_empty_desc: "This destroyed city has been marked as an ancient ruin. The panel is intentionally empty for now and can receive excavation, restoration, or memory mechanics later."
