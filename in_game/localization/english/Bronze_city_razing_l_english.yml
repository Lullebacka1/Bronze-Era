 bronze_ruins_debug.1.title: "Ruins Expedition Debug"
 bronze_ruins_debug.1.desc: "This debug event is only meant for console testing. Use it to bypass expedition timers, force an active expedition to return, or choose the expedition leader profile before launching."
 bronze_ruins_debug.1.a: "Clear expedition timers."
 bronze_ruins_debug.1.b: "Force the active expedition to return."
 bronze_ruins_debug.1.c: "Choose expedition leader profile."
 bronze_ruins_debug.1.d: "Enable selected-ruin debug buttons."
 bronze_ruins_debug.1.e: "Close."
 bronze_ruins_debug.2.title: "Choose Expedition Leader Profile"
 bronze_ruins_debug.2.desc: "Select the profile used by the next ruins expedition. This is a profile-based leader selection, not a full character assignment system."
 bronze_ruins_debug.2.a: "Royal Archivist"
 bronze_ruins_debug.2.b: "Guard Captain"
 bronze_ruins_debug.2.c: "Quartermaster"
 bronze_ruins_debug.2.d: "Temple Diviner"
 bronze_ruins_debug_1a_tt: "Console command: event bronze_ruins_debug.1\nClears the country expedition cooldown, clears stale expedition capacity if no expedition is active, and removes recent exploration locks from owned ruins."
 bronze_ruins_debug_1b_tt: "Sets the current active expedition to 100% progress and triggers its return event on the next day if a valid active expedition exists."
 bronze_ruins_debug_1c_tt: "Opens the debug profile selector for the next expedition leader."
 bronze_ruins_debug_1d_tt: "Enables temporary debug buttons in the ruins location interface. Use them to prepare or directly launch an expedition from the currently selected ruin."
 bronze_ruins_debug_2a_tt: "The next expedition uses the Royal Archivist profile: better success and artifact chance."
 bronze_ruins_debug_2b_tt: "The next expedition uses the Guard Captain profile: better safety in dangerous ruins."
 bronze_ruins_debug_2c_tt: "The next expedition uses the Quartermaster profile: better recovery logistics and gold potential."
 bronze_ruins_debug_2d_tt: "The next expedition uses the Temple Diviner profile: better artifact and lore potential."
 be_ruins_debug_reset_launch_timers_effect_tt: "Ruins expedition launch timers and recent-exploration locks are cleared for debug testing."
 be_ruins_debug_force_active_expedition_return_effect_tt: "An active ruins expedition is forced to return for debug testing."
 be_ruins_debug_enable_location_buttons_effect_tt: "Temporary selected-ruin debug buttons are enabled in the ruins interface."
 be_ruins_debug_prepare_selected_ruin_effect_tt: "The selected ruin is force-prepared for debug testing."
 be_ruins_debug_start_selected_expedition_effect_tt: "A debug expedition is launched from the selected ruin using the normal expedition flow."
 be_ruins_debug_prepare_selected_ruin: "Debug: Prepare Selected Ruin"
 be_ruins_debug_prepare_selected_ruin_tt: "Clears too-fresh, explored, cooldown, stale capacity, and active expedition markers from this selected ruin."
 be_ruins_debug_start_selected_expedition: "Debug: Launch Selected Expedition"
 be_ruins_debug_start_selected_expedition_tt: "Force-prepares this selected ruin and launches the normal expedition flow immediately. Normal expedition costs still apply."
