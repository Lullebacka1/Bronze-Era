l_english:
 bronze_city_razing.1.title: "The City Has Fallen"
 bronze_city_razing.1.desc: "[bronze_captured_city.GetName] is under our control. The gates are open, the stores are exposed, and the fate of the people now rests with the victorious army."
 bronze_city_razing.1.a: "Occupy the city."
 bronze_city_razing.1.b: "Sack the city."
 bronze_city_razing.1.c: "Raze it to the ground."
 bronze_city_razing.2.title: "The Sack Is Complete"
 bronze_city_razing.2.desc: "The sack order at [bronze_captured_city.GetName] has reached its end. If we still control the city and no new siege has begun, the plunder is completed. If the city was relieved or contested, only early damage remains."
 bronze_city_razing.2.a: "Take the spoils."
 bronze_city_razing.3.title: "The City Is Broken"
 bronze_city_razing.3.desc: "The razing order at [bronze_captured_city.GetName] has reached its end. If we still control the city and no new siege has begun, the destruction is completed. If the city was relieved or contested, the first damage has already been done."
 bronze_city_razing.3.a: "Resolve the razing order."
 bronze_city_razing.9.title: "Ruins Await Exploration"
 bronze_city_razing.9.desc: "Old walls, broken shrines, and buried storerooms still stand within our lands. Scribes and adventurers believe an expedition to [bronze_ruins_site.GetName] could recover valuables, records, or royal remains from a destroyed city."
 bronze_city_razing.9.a: "Fund the expedition."
 bronze_city_razing.9.b: "Leave the dead city alone."
 bronze_city_razing.10.title: "The Expedition Reaches the Ruins"
 bronze_city_razing.10.desc: "The expedition has reached the shattered remains of [bronze_ruins_site.GetName]. The first chambers are unstable, but the guides insist the deeper passages may still hold something worth the cost."
 bronze_city_razing.10.a: "Press deeper into the ruins."
 bronze_city_razing.10.b: "Withdraw before more is lost."
 bronze_city_razing.11.title: "A Lost Expedition"
 bronze_city_razing.11.desc: "The expedition has returned late, hungry, and badly reduced. Collapsed passages, sickness, and hostile country consumed much of the effort before anything useful could be recovered."
 bronze_city_razing.11.a: "Write off the losses."
 bronze_city_razing.12.title: "Hidden Treasure"
 bronze_city_razing.12.desc: "A sealed storeroom beneath the ruins has yielded metalwork, stored valuables, and ritual gifts hidden during the city's final days."
 bronze_city_razing.12.a: "Bring the treasure to the palace."
 bronze_city_razing.13.title: "Ancient Texts Found"
 bronze_city_razing.13.desc: "Scribes have recovered damaged tablets and inscriptions from the ruins. Much is fragmentary, but enough remains to preserve lost administrative and ritual knowledge."
 bronze_city_razing.13.a: "Send the texts to our scholars."
 bronze_city_razing.14.title: "A Royal Burial Chamber"
 bronze_city_razing.14.desc: "The expedition has uncovered a chamber prepared for a forgotten ruler. Its contents are modestly useful, but its ceremonial importance is far greater."
 bronze_city_razing.14.a: "Honor the dead and record the discovery."
 bronze_city_razing.15.title: "The Sacred Curse"
 bronze_city_razing.15.desc: "The workers whisper that the buried gods have been disturbed. Whether curse, sickness, or fear, the expedition's return has brought unease to the court."
 bronze_city_razing.15.a: "Make offerings and end the work."
 bronze_city_razing.20.title: "Stores, Seals, and Orders"
 bronze_city_razing.20.desc: "Before the expedition enters [bronze_ruins_site.GetName], scribes count the baskets of grain, guards inspect their spearheads, and laborers wait for final orders. The first choices will shape the whole journey."
 bronze_city_razing.20.a: "Load extra supplies."
 bronze_city_razing.20.b: "Travel light and move quickly."
 bronze_city_razing.20.c: "Hire local guides."
 bronze_city_razing.21.title: "The Road to the Ruins"
 bronze_city_razing.21.desc: "The path toward [bronze_ruins_site.GetName] crosses broken fields, dry gullies, and abandoned watch posts. The expedition can preserve strength, or sacrifice safety for speed."
 bronze_city_razing.21.a: "Take the safer road."
 bronze_city_razing.21.b: "Force the march."
 bronze_city_razing.21.c: "Ask for omens before moving."
 bronze_city_razing.22.title: "An Unknown Chamber"
 bronze_city_razing.22.desc: "Behind a fallen wall, the workers uncover a sealed chamber. Faded symbols still cling to the plaster, and cold air moves through a crack beneath the stones."
 bronze_city_razing.22.a: "Map and record everything."
 bronze_city_razing.22.b: "Break the seal."
 bronze_city_razing.22.c: "Leave it sealed."
 bronze_city_razing.23.title: "Stone and Dust"
 bronze_city_razing.23.desc: "A passage collapses under the weight of the expedition. Men shout from behind broken stones while the chief must decide whether to risk more lives in the unstable dark."
 bronze_city_razing.23.a: "Rescue the trapped workers."
 bronze_city_razing.23.b: "Abandon that section."
 bronze_city_razing.23.c: "Send the guards first."
 bronze_city_razing.24.title: "Claimants in the Ruins"
 bronze_city_razing.24.desc: "The expedition is not alone. Armed scavengers, local elders, and guides with uncertain loyalties all claim some right to what lies under [bronze_ruins_site.GetName]."
 bronze_city_razing.24.a: "Negotiate passage."
 bronze_city_razing.24.b: "Drive them away."
 bronze_city_razing.24.c: "Buy their map."
 bronze_city_razing.25.title: "The First Discovery"
 bronze_city_razing.25.desc: "The expedition uncovers traces of a lost order: marked jars, broken tablets, ritual bronzes, and rooms sealed during the city's last days."
 bronze_city_razing.25.a: "Document the find."
 bronze_city_razing.25.b: "Recover the valuables."
 bronze_city_razing.25.c: "Consecrate the chamber."
 bronze_city_razing.26.title: "The Sealed Door"
 bronze_city_razing.26.desc: "At the center of the ruin stands a door blocked by heavy stones. The workers say no ordinary storeroom would have been sealed with such care."
 bronze_city_razing.26.a: "Open it."
 bronze_city_razing.26.b: "Send a small team."
 bronze_city_razing.26.c: "Mark it for later."
 bronze_city_razing.27.title: "Foreign Eyes"
 bronze_city_razing.27.desc: "The expedition has drawn attention from the rulers of this land. Their messengers ask why armed workers are digging through ruins under their authority."
 bronze_city_razing.27.a: "Request formal permission."
 bronze_city_razing.27.b: "Continue quietly."
 bronze_city_razing.27.c: "Withdraw before this becomes a scandal."
 bronze_city_razing.28.title: "Stores Run Low"
 bronze_city_razing.28.desc: "The expedition's food stores are almost gone. Sickness, bad roads, and longer passages than expected have turned careful plans into a contest of endurance."
 bronze_city_razing.28.a: "Send more supplies."
 bronze_city_razing.28.b: "Cut our losses."
 bronze_city_razing.28.c: "Push deeper before the men scatter."
 bronze_city_razing.29.title: "The Expedition Returns"
 bronze_city_razing.29.desc: "The survivors return from [bronze_ruins_site.GetName] with tablets, fragments, stories, and sealed baskets. Whether triumph or warning, the ruin has left its mark on the court."
 bronze_city_razing.29.a: "Receive the expedition."
 be_ruin_final_artifact_unique_tt: "A unique artifact is added to the palace records."
 be_ruin_final_artifact_rare_tt: "A rare artifact is added to the palace records."
 be_ruin_final_artifact_common_tt: "A recovered artifact is added to the palace records."
 bronze_city_razing.30.title: "The Royal Quarter"
 bronze_city_razing.30.desc: "The expedition reaches a raised district of stone thresholds, painted plaster, and collapsed storerooms. Even ruined, this was once a place of authority."
 bronze_city_razing.30.a: "Send scribes into the palace rooms."
 bronze_city_razing.30.b: "Open the royal stores."
 bronze_city_razing.30.c: "Seal the throne room with offerings."
 bronze_city_razing.31.title: "The Archive Room"
 bronze_city_razing.31.desc: "Rows of broken shelves and hardened tablets lie beneath ash and roof beams. Some records survived the city's last fire."
 bronze_city_razing.31.a: "Let the scholars work slowly."
 bronze_city_razing.31.b: "Remove what can be carried."
 bronze_city_razing.31.c: "Copy the fragile signs in place."
 bronze_city_razing.32.title: "The Royal Tomb"
 bronze_city_razing.32.desc: "A burial chamber opens under the ruin. The bones are old, but the objects around them still speak of a ruler's final honors."
 bronze_city_razing.32.a: "Respect the dead."
 bronze_city_razing.32.b: "Strip the chamber."
 bronze_city_razing.32.c: "Set guards before the entrance."
 bronze_city_razing.33.title: "The Harbor Warehouses"
 bronze_city_razing.33.desc: "Near the old quays, the expedition finds sealed storage rooms filled with broken jars, trade marks, and signs of hurried evacuation."
 bronze_city_razing.33.a: "Record the trade marks."
 bronze_city_razing.33.b: "Recover the stored goods."
 bronze_city_razing.33.c: "Secure the docks first."
 bronze_city_razing.34.title: "Buried Ship Cargo"
 bronze_city_razing.34.desc: "Mud and fallen masonry have preserved part of a vessel's cargo. Foreign marks remain on some jars."
 bronze_city_razing.34.a: "Raise the cargo carefully."
 bronze_city_razing.34.b: "Strip the vessel quickly."
 bronze_city_razing.34.c: "Study the foreign marks."
 bronze_city_razing.35.title: "The Inner Sanctuary"
 bronze_city_razing.35.desc: "A sanctuary survives behind a fallen wall. Charred beams, ritual vessels, and cracked statues fill the chamber."
 bronze_city_razing.35.a: "Make offerings before entering."
 bronze_city_razing.35.b: "Remove the relics."
 bronze_city_razing.35.c: "Question the temple signs."
 bronze_city_razing.36.title: "The Armory"
 bronze_city_razing.36.desc: "Bronze spearheads, broken shields, and stacked fittings lie beneath a barrack roof. The place was abandoned in haste."
 bronze_city_razing.36.a: "Catalogue the weapons."
 bronze_city_razing.36.b: "Recover the bronze."
 bronze_city_razing.36.c: "Secure the barracks."
 bronze_city_razing.37.title: "The Workshop Street"
 bronze_city_razing.37.desc: "Kilns, anvils, benches, and half-finished goods line a narrow street. The hands that used them are long gone."
 bronze_city_razing.37.a: "Study the craft marks."
 bronze_city_razing.37.b: "Gather the tools."
 bronze_city_razing.37.c: "Hire surviving craftsmen nearby."
 bronze_city_razing.38.title: "A Hidden Passage"
 bronze_city_razing.38.desc: "A narrow passage runs beneath the ruin. It may have carried guards, priests, smugglers, or fugitives during the city's last days."
 bronze_city_razing.38.a: "Map the passage."
 bronze_city_razing.38.b: "Send armed men inside."
 bronze_city_razing.38.c: "Block the dangerous branch."
 bronze_city_razing.39.title: "Fire in the Camp"
 bronze_city_razing.39.desc: "A spark catches dry timber and old cloth. Smoke rolls through the camp while workers drag baskets away from the flames."
 bronze_city_razing.39.a: "Save the workers and stores."
 bronze_city_razing.39.b: "Abandon the burning district."
 bronze_city_razing.39.c: "Use the flames to clear debris."
 bronze_city_razing.40.title: "Raiders in the Ruins"
 bronze_city_razing.40.desc: "Armed men appear among the outer walls. They know the broken streets well and watch the expedition's stores with interest."
 bronze_city_razing.40.a: "Pay them to leave."
 bronze_city_razing.40.b: "Drive them out."
 bronze_city_razing.40.c: "Hire them as guides."
 bronze_city_razing.41.title: "Flooded Passages"
 bronze_city_razing.41.desc: "Water seeps into the lower passages. The footing turns slick, lamps sputter, and the air grows foul."
 bronze_city_razing.41.a: "Drain the passage."
 bronze_city_razing.41.b: "Turn back for now."
 bronze_city_razing.41.c: "Push through."
 bronze_city_razing.42.title: "A Silent District"
 bronze_city_razing.42.desc: "The expedition spends days in empty streets. Pottery, ash, and bones remain, but nothing yet explains why this part of the city died."
 bronze_city_razing.42.a: "Keep searching carefully."
 bronze_city_razing.42.b: "Break into the next district."
 bronze_city_razing.42.c: "Return with what we have."
 bronze_city_razing_1a_tt: "The city is occupied with minimal additional damage."
 bronze_city_razing_1b_tt: "Begins a two-week sack. The location receives a visible sacking marker. The action no longer locks the army; it only fails if the city is liberated or a new siege contests it before completion. On success, we gain loot, while the city loses prosperity, population, food, and City Prestige. Civilian losses add bonus warscore."
 bronze_city_razing_1c_tt: "Begins a razing operation. Cities take one month; megalopolises take two months. The location receives a visible razing marker. The action no longer locks the army; it only fails if the city is liberated or a new siege contests it before completion. On success, the city suffers heavy population loss, building destruction, market center destruction if present, rank downgrade, severe prosperity loss, and civilian losses add bonus warscore."
 bronze_city_razing_2a_tt: "If we still control the city and it is not under siege, apply the final sack: loot, population loss, food loss, prosperity damage, City Prestige loss, and bonus warscore from civilian losses. If the city was relieved or contested, interrupt the sack and apply only minor damage."
 bronze_city_razing_3a_tt: "If we still control the city and it is not under siege, apply the final razing: loot, major population loss, building destruction, market center destruction if present, settlement rank downgrade, City Prestige removal if the location is no longer a city, and bonus warscore from civilian losses. If the city was relieved or contested, interrupt the razing and apply partial damage."
