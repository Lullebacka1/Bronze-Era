 STATIC_MODIFIER_NAME_bronze_city_royal_capital_world: "Capital of the Known World"
 STATIC_MODIFIER_DESC_bronze_city_royal_capital_world: "The greatest city of the age stands as the foremost symbol of dynastic authority."
 STATIC_MODIFIER_NAME_bronze_city_scholars_gathered: "Scholars Gathered"
 STATIC_MODIFIER_DESC_bronze_city_scholars_gathered: "Scribes, priests, and learned visitors have made this city a center of knowledge."
 STATIC_MODIFIER_NAME_bronze_city_scholarly_patronage: "Scholarly Patronage"
 STATIC_MODIFIER_DESC_bronze_city_scholarly_patronage: "The court supports teachers, archives, scribes, and the exchange of new ideas."
 STATIC_MODIFIER_NAME_bronze_city_scholarly_court: "Scholarly Court"
 STATIC_MODIFIER_DESC_bronze_city_scholarly_court: "Teachers and learned scribes improve the education available within the ruling household."
 STATIC_MODIFIER_NAME_bronze_city_famous_craftsmen: "Famous Craftsmen"
 STATIC_MODIFIER_DESC_bronze_city_famous_craftsmen: "Master artisans attract commissions and apprentices from distant lands."
 STATIC_MODIFIER_NAME_bronze_city_merchant_caravan: "Merchant Caravan"
 STATIC_MODIFIER_DESC_bronze_city_merchant_caravan: "A wealthy caravan has renewed commerce and carried news of the city's prosperity abroad."
 STATIC_MODIFIER_NAME_bronze_city_foreign_envoys: "Foreign Envoys"
 STATIC_MODIFIER_DESC_bronze_city_foreign_envoys: "Foreign delegations at court improve the realm's diplomatic standing."
 STATIC_MODIFIER_NAME_bronze_city_famine: "Urban Famine"
 STATIC_MODIFIER_DESC_bronze_city_famine: "Food scarcity is killing inhabitants, emptying workshops, and tarnishing the city's reputation."
 STATIC_MODIFIER_NAME_bronze_city_trade_collapse: "Collapsed Urban Trade"
 STATIC_MODIFIER_DESC_bronze_city_trade_collapse: "Broken routes and deserted markets have sharply reduced the city's prosperity and influence."
 STATIC_MODIFIER_NAME_bronze_city_population_exodus: "Population Exodus"
