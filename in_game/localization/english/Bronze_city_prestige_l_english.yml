 STATIC_MODIFIER_NAME_bronze_city_royal_capital_regional: "Renowned Royal Capital"
 STATIC_MODIFIER_DESC_bronze_city_royal_capital_regional: "A respected regional capital lends authority to the ruling dynasty."
 STATIC_MODIFIER_NAME_bronze_city_royal_capital_great: "Great Royal Capital"
 STATIC_MODIFIER_DESC_bronze_city_royal_capital_great: "The fame of this great capital strengthens the ruler's legitimacy."
 STATIC_MODIFIER_NAME_bronze_city_royal_capital_imperial: "Imperial Royal Capital"
