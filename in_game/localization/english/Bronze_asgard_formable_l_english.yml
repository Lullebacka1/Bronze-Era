l_english:
 ASGARD_f: "Asgard"
 ASGARD_f_desc: "The sea lanes, forests and bronze halls of the north can be gathered under one high crown. Asgard is not a divine realm, but a human kingdom claiming the prestige of the Aesir's domain."
 bronze_asgard_high_kingship: "High Kingship of Asgard"
 bronze_asgard_high_kingship_desc: "The rulers of Asgard bind Nordic chiefs, cult places and sea-routes into a lasting royal order."
 bronze_asgard_remaining_claims_tt: "Gain claims, but not cores, on the remaining Asgard locations."
 bronze_formed_asgard: "Formed Asgard"
 bronze_formed_asgard_desc: "This country formed Asgard and now stands above the regional Nordic crowns."
