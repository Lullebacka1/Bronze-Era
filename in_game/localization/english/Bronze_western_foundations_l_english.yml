l_english:
 bronze_western_foundations.1.title: "The Etruscan Cities"
 bronze_western_foundations.1.desc: "Across Etruria, the Villanovan hill communities are hardening into aristocratic cities. Palace accounting, iron tools and new elite rites give the old settlements a different political language, one centered on Etruscan temples, magistrates and noble houses."
 bronze_western_foundations.1.a: "Recognize the Etruscan order."
 bronze_western_foundations_1a_tt: "The state culture and state religion become Etruscan. In owned starting Etrurian locations only, roughly 55% of the population becomes Etruscan culture and roughly 45% follows the Etruscan religion."
 bronze_western_foundations.2.title: "The Foundation of Carthage"
 bronze_western_foundations.2.desc: "The western harbor at Tunis has become the anchor of a new Phoenician colony. Merchants, sailors and temple households ask for recognition as Carthage, a city placed to command the central routes of the western Mediterranean."
 bronze_western_foundations.2.a: "Found Carthage in the west."
 bronze_western_foundations_2a_tt: "Carthage is created in Tunis, Tebourba, Nabeul, Kelibia, Bizerte and Zaghouan with the founder's Levantine culture and the Punic religion."
 bronze_western_foundations.3.title: "Carthage on the African Shore"
 bronze_western_foundations.3.desc: "Foreign traders and settlers have gathered around the harbor of Tunis, drawing the nearby towns into a new Punic city. Even without a ruling Phoenician metropolis, the colony now has the weight to stand as Carthage."
 bronze_western_foundations.3.a: "Let Carthage take shape."
 bronze_western_foundations_3a_tt: "Carthage is created in Tunis, Tebourba, Nabeul, Kelibia, Bizerte and Zaghouan with Phoenician-Punic culture and the Punic religion. You will continue as Carthage."
