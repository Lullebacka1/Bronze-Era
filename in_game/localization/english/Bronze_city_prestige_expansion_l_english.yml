l_english:
 bronze_begin_great_pyramid_project: "Raise a New Great Pyramid"
 bronze_begin_great_pyramid_project_desc: "Commit Egypt's treasury, labor, and royal authority to one final great pyramid complex."
 bronze_begin_great_pyramid_project_price: "Prepare the Royal Works"
 bronze_begin_great_pyramid_project_tt: "Select a prestigious Egyptian city. The project takes roughly 20-30 years, demands repeated investment, and permanently consumes the world's only additional Great Pyramid slot."
 bronze_resume_great_pyramid_project: "Resume the Great Pyramid"
 bronze_resume_great_pyramid_project_desc: "Return laborers and overseers to the unfinished royal works."
 bronze_resume_great_pyramid_project_price: "Restore the Work Camps"
 bronze_resume_great_pyramid_project_tt: "Resume the project from its last completed phase."
 bronze_choose_great_pyramid_site: "Choose the Pyramid Site"
 bronze_no_valid_great_pyramid_site: "No owned Egyptian city has at least 100 City Prestige and a suitable site."

 bronze_city_mission_grand_festival: "Hold a Grand Festival"
 bronze_city_mission_grand_festival_desc: "Commission several years of preparation for a festival worthy of a renowned city."
 bronze_city_mission_grand_festival_price: "Festival Endowment"
 bronze_city_mission_artisans_and_scribes: "Attract Artisans and Scribes"
 bronze_city_mission_artisans_and_scribes_desc: "Endow workshops and archives to attract skilled households."
 bronze_city_mission_artisans_and_scribes_price: "Workshop Grants"
 bronze_city_mission_develop_market: "Develop the City Market"
 bronze_city_mission_develop_market_desc: "Invest in roads, stalls, storehouses, and merchant protection."
 bronze_city_mission_develop_market_price: "Market Investment"
 bronze_city_mission_restore_fortifications: "Restore the Fortifications"
 bronze_city_mission_restore_fortifications_desc: "Repair walls and garrison works around a chosen city."
 bronze_city_mission_restore_fortifications_price: "Fortification Works"
 bronze_city_mission_secure_food_supply: "Secure the Food Supply"
 bronze_city_mission_secure_food_supply_desc: "Reorganize granaries and supply routes for a vulnerable city."
 bronze_city_mission_secure_food_supply_price: "Granary Purchases"
 bronze_choose_urban_mission_city: "Choose a City"
 bronze_no_valid_urban_mission_city: "No eligible city is ready for another urban mission."
 bronze_no_valid_artisan_mission_city: "No eligible city has the required artisan industry."
 bronze_no_valid_market_mission_city: "No eligible city has the required trade infrastructure."
 bronze_no_valid_fortification_mission_city: "No eligible city has fortifications to restore."
 bronze_no_valid_food_mission_city: "No eligible city currently suffers from an insecure food supply."

 bronze_city_monuments.100.title: "The Royal Quarries"
 bronze_city_monuments.100.desc: "Surveyors have marked the stone and organized the roads to [bronze_great_pyramid_site.GetName]. The scale of the quarry works will determine everything that follows."
 bronze_city_monuments.100.a: "Open the full royal quarries."
 bronze_city_monuments.100.b: "Reduce the intended scale."
 bronze_city_monuments.101.title: "The Labor of Egypt"
 bronze_city_monuments.101.desc: "Overseers request workers, rations, tools, and protection for a project that will outlive its first builders."
 bronze_city_monuments.101.a: "Mobilize the royal labor system."
 bronze_city_monuments.101.b: "Demand more from the local districts."
 bronze_city_monuments.102.title: "Stone for the Horizon"
 bronze_city_monuments.102.desc: "The greatest blocks must cross roads and waterways without starving the work camps or nearby cities."
 bronze_city_monuments.102.a: "Fund secure transport and supply."
 bronze_city_monuments.102.b: "Strip the nearby granaries."
 bronze_city_monuments.103.title: "The Pyramid Rises"
 bronze_city_monuments.103.desc: "Course after course now rises above [bronze_great_pyramid_site.GetName], but the main structure still demands years of labor."
 bronze_city_monuments.103.a: "Keep the work at full strength."
 bronze_city_monuments.103.b: "Accept a smaller monument."
 bronze_city_monuments.104.title: "The House of Eternity"
 bronze_city_monuments.104.desc: "Priests and architects call for the mortuary temple, processional ways, and final sacred enclosure."
 bronze_city_monuments.104.a: "Complete the full funerary complex."
 bronze_city_monuments.104.b: "Finish only the essential rites."
 bronze_city_monuments.105.title: "A New Great Pyramid"
 bronze_city_monuments.105.desc: "The last stones are set and the royal complex at [bronze_great_pyramid_site.GetName] is ready for consecration."
 bronze_city_monuments.105.a: "Consecrate the monument for eternity."
 bronze_city_monuments.107.title: "Laborers Refuse the Quarries"
 bronze_city_monuments.107.desc: "Exhaustion and poor rations have brought work to a halt. The court must either meet the workers' needs or impose order."
 bronze_city_monuments.107.a: "Pay and provision the workers."
 bronze_city_monuments.107.b: "Compel them to return."
 bronze_city_monuments.108.title: "The Supply Convoys Fail"
 bronze_city_monuments.108.desc: "Delayed barges and empty granaries threaten both the building crews and the surrounding countryside."
 bronze_city_monuments.108.a: "Buy emergency supplies."
 bronze_city_monuments.108.b: "Let the districts bear the shortage."
 bronze_city_monuments.suspend: "Suspend the royal works."

 bronze_city_development.200.title: "The Festival Reckoning"
 bronze_city_development.200.desc: "Years of preparation in [bronze_city_mission_site.GetName] have reached their appointed season. Prosperity will decide whether visitors remember splendor or disorder."
 bronze_city_development.200.a: "The festival honors the city."
 bronze_city_development.201.title: "New Masters of the Workshops"
 bronze_city_development.201.desc: "Artisans and scribes have tested the patronage offered by [bronze_city_mission_site.GetName]. Lasting industry is now within reach."
 bronze_city_development.201.a: "Grant them permanent quarters."
 bronze_city_development.202.title: "The Renewed Market"
 bronze_city_development.202.desc: "New storehouses and protected roads have brought merchants back to [bronze_city_mission_site.GetName]."
 bronze_city_development.202.a: "Open the market to distant traders."
 bronze_city_development.203.title: "Walls Restored"
 bronze_city_development.203.desc: "The repaired defenses of [bronze_city_mission_site.GetName] again command its approaches."
 bronze_city_development.203.a: "Dedicate the restored walls."
 bronze_city_development.204.title: "Granaries Secured"
 bronze_city_development.204.desc: "The supply officers of [bronze_city_mission_site.GetName] report that the city can again withstand a poor harvest."
 bronze_city_development.204.a: "Seal the full granaries."
 bronze_city_development.mission_failed: "The effort has failed; bear the consequences."

 bronze_city_development.320.title: "Rival Cities"
 bronze_city_development.320.desc: "[bronze_city_rivalry_home.GetName] and [bronze_city_rivalry_other.GetName] now compete for merchants, craftsmen, and renown. Their rivalry can be mediated, answered with investment, or turned into a dangerous intrigue."
 bronze_city_development.320.a: "Negotiate a commercial accord."
 bronze_city_development.320.b: "Outbuild the rival city."
 bronze_city_development.320.c: "Undermine their prosperity."
 bronze_city_development.321.title: "Rivalry Within the Realm"
 bronze_city_development.321.desc: "The elites of [bronze_city_rivalry_home.GetName] and [bronze_city_rivalry_other.GetName] demand precedence, investment, and royal favor."
 bronze_city_development.321.a: "Invest in both cities."
 bronze_city_development.321.b: "Favor the first city."
 bronze_city_development.330.title: "A City Near Abandonment"
 bronze_city_development.330.desc: "Whole districts of [bronze_declining_city.GetName] stand empty. We may fund a costly restoration, oversee a partial evacuation, or formally abandon the city to its ruins."
 bronze_city_development.330.a: "Restore the city at any cost."
 bronze_city_development.330.b: "Evacuate the weakest districts."
 bronze_city_development.330.c: "Abandon the city."

 STATIC_MODIFIER_NAME_bronze_great_pyramid_construction_site: "Great Pyramid Worksite"
 STATIC_MODIFIER_DESC_bronze_great_pyramid_construction_site: "Quarries, ramps, work camps, and supply depots dominate this city."
