 STATIC_MODIFIER_DESC_bronze_city_market_renewal: "Protected roads and improved storehouses support urban commerce."
 STATIC_MODIFIER_NAME_bronze_city_restored_fortifications: "Restored Fortifications"
 STATIC_MODIFIER_DESC_bronze_city_restored_fortifications: "The city's defensive works have been repaired and rededicated."
 STATIC_MODIFIER_NAME_bronze_city_secured_granaries: "Secured Granaries"
 STATIC_MODIFIER_DESC_bronze_city_secured_granaries: "Improved storage and supply arrangements protect the urban population."
 STATIC_MODIFIER_NAME_bronze_city_rivalry_investment: "Rivalry Investment"
 STATIC_MODIFIER_DESC_bronze_city_rivalry_investment: "Competition with another great city has drawn new patronage."
 STATIC_MODIFIER_NAME_bronze_city_rivalry_trade_accord: "Rival Cities Trade Accord"
 STATIC_MODIFIER_DESC_bronze_city_rivalry_trade_accord: "Former rivals now coordinate tolls, merchants, and routes."
 STATIC_MODIFIER_NAME_bronze_city_rivalry_sabotaged: "Urban Sabotage"
 STATIC_MODIFIER_DESC_bronze_city_rivalry_sabotaged: "Hidden interference has disrupted workshops and merchant confidence."
 STATIC_MODIFIER_NAME_bronze_city_decline_stage_1: "Stagnant City"
 STATIC_MODIFIER_DESC_bronze_city_decline_stage_1: "Weak conditions are slowly diminishing the city's attraction and prestige."
 STATIC_MODIFIER_NAME_bronze_city_decline_stage_2: "Urban Decline"
 STATIC_MODIFIER_DESC_bronze_city_decline_stage_2: "Commerce, production, and urban confidence are failing."
 STATIC_MODIFIER_NAME_bronze_city_decline_stage_3: "Abandoned Districts"
 STATIC_MODIFIER_DESC_bronze_city_decline_stage_3: "Artisans and families are leaving entire districts behind."
 STATIC_MODIFIER_NAME_bronze_city_decline_stage_4: "Nearly Abandoned City"
 STATIC_MODIFIER_DESC_bronze_city_decline_stage_4: "The remaining population struggles to sustain a functioning city."
 STATIC_MODIFIER_NAME_bronze_city_foremost_world: "Seat of the World's Foremost City"
 STATIC_MODIFIER_DESC_bronze_city_foremost_world: "Our greatest city stands first among all known urban centers."
 STATIC_MODIFIER_NAME_bronze_city_foremost_top_ten: "Seat of a Celebrated City"
 STATIC_MODIFIER_DESC_bronze_city_foremost_top_ten: "Our foremost city is counted among the ten greatest in the world."
 STATIC_MODIFIER_NAME_bronze_city_foremost_top_thirty: "Seat of a Renowned City"
 STATIC_MODIFIER_DESC_bronze_city_foremost_top_thirty: "Our foremost city is widely known beyond the realm."
 STATIC_MODIFIER_NAME_bronze_city_foremost_noted: "Noted Urban Seat"
 STATIC_MODIFIER_DESC_bronze_city_foremost_noted: "The reputation of our foremost city lends modest weight to diplomacy."
