l_french:
 bronze_begin_great_pyramid_project: "Élever une nouvelle grande pyramide"
 bronze_begin_great_pyramid_project_desc: "Engager le trésor, la main-d'œuvre et l'autorité royale de l'Égypte dans un dernier grand complexe pyramidal."
 bronze_begin_great_pyramid_project_price: "Préparer les travaux royaux"
 bronze_begin_great_pyramid_project_tt: "Sélectionnez une ville égyptienne prestigieuse. Le projet dure environ 20 à 30 ans, exige des investissements répétés et consomme définitivement l'unique emplacement mondial supplémentaire."
 bronze_resume_great_pyramid_project: "Reprendre la grande pyramide"
 bronze_resume_great_pyramid_project_desc: "Renvoyer ouvriers et contremaîtres sur le chantier royal inachevé."
 bronze_resume_great_pyramid_project_price: "Rétablir les camps de travail"
 bronze_resume_great_pyramid_project_tt: "Reprendre le projet depuis sa dernière phase achevée."
 bronze_choose_great_pyramid_site: "Choisir le site de la pyramide"
 bronze_no_valid_great_pyramid_site: "Aucune ville égyptienne possédée ne dispose de 100 points de prestige urbain et d'un site adapté."

 bronze_city_mission_grand_festival: "Organiser un grand festival"
 bronze_city_mission_grand_festival_desc: "Financer plusieurs années de préparation pour un festival digne d'une cité renommée."
 bronze_city_mission_grand_festival_price: "Dotation du festival"
 bronze_city_mission_artisans_and_scribes: "Attirer artisans et scribes"
 bronze_city_mission_artisans_and_scribes_desc: "Doter ateliers et archives afin d'attirer des familles qualifiées."
 bronze_city_mission_artisans_and_scribes_price: "Concessions aux ateliers"
 bronze_city_mission_develop_market: "Développer le marché urbain"
 bronze_city_mission_develop_market_desc: "Investir dans les routes, étals, entrepôts et la protection des marchands."
 bronze_city_mission_develop_market_price: "Investissement commercial"
 bronze_city_mission_restore_fortifications: "Restaurer les fortifications"
 bronze_city_mission_restore_fortifications_desc: "Réparer les murailles et ouvrages de garnison d'une ville choisie."
 bronze_city_mission_restore_fortifications_price: "Travaux défensifs"
 bronze_city_mission_secure_food_supply: "Sécuriser l'approvisionnement"
 bronze_city_mission_secure_food_supply_desc: "Réorganiser les greniers et les routes de ravitaillement d'une ville vulnérable."
 bronze_city_mission_secure_food_supply_price: "Achats de grain"
 bronze_choose_urban_mission_city: "Choisir une ville"
 bronze_no_valid_urban_mission_city: "Aucune ville éligible n'est prête pour une nouvelle mission urbaine."
 bronze_no_valid_artisan_mission_city: "Aucune ville éligible ne dispose de l'activité artisanale requise."
 bronze_no_valid_market_mission_city: "Aucune ville éligible ne dispose des infrastructures commerciales requises."
 bronze_no_valid_fortification_mission_city: "Aucune ville éligible ne possède de fortifications à restaurer."
 bronze_no_valid_food_mission_city: "Aucune ville éligible ne souffre actuellement d'un ravitaillement insuffisant."

 bronze_city_monuments.100.title: "Les carrières royales"
 bronze_city_monuments.100.desc: "Les arpenteurs ont marqué la pierre et organisé les routes vers [bronze_great_pyramid_site.GetName]. L'ampleur des carrières déterminera toute la suite."
 bronze_city_monuments.100.a: "Ouvrir les grandes carrières royales."
 bronze_city_monuments.100.b: "Réduire l'ampleur prévue."
 bronze_city_monuments.101.title: "Le travail de l'Égypte"
 bronze_city_monuments.101.desc: "Les contremaîtres réclament ouvriers, rations, outils et protection pour un projet qui survivra à ses premiers bâtisseurs."
 bronze_city_monuments.101.a: "Mobiliser le système de travail royal."
 bronze_city_monuments.101.b: "Exiger davantage des districts locaux."
 bronze_city_monuments.102.title: "La pierre pour l'horizon"
 bronze_city_monuments.102.desc: "Les plus grands blocs doivent franchir routes et voies d'eau sans affamer les camps ni les cités voisines."
 bronze_city_monuments.102.a: "Financer le transport et le ravitaillement."
 bronze_city_monuments.102.b: "Vider les greniers voisins."
 bronze_city_monuments.103.title: "La pyramide s'élève"
 bronze_city_monuments.103.desc: "Assise après assise, la structure domine [bronze_great_pyramid_site.GetName], mais elle exige encore des années de travail."
 bronze_city_monuments.103.a: "Maintenir le chantier à pleine puissance."
 bronze_city_monuments.103.b: "Accepter un monument plus modeste."
 bronze_city_monuments.104.title: "La demeure d'éternité"
 bronze_city_monuments.104.desc: "Prêtres et architectes réclament le temple funéraire, les voies processionnelles et l'enceinte sacrée."
 bronze_city_monuments.104.a: "Achever tout le complexe funéraire."
 bronze_city_monuments.104.b: "N'accomplir que les rites essentiels."
 bronze_city_monuments.105.title: "Une nouvelle grande pyramide"
 bronze_city_monuments.105.desc: "Les dernières pierres sont posées et le complexe royal de [bronze_great_pyramid_site.GetName] attend sa consécration."
 bronze_city_monuments.105.a: "Consacrer le monument pour l'éternité."
 bronze_city_monuments.107.title: "Les ouvriers refusent les carrières"
 bronze_city_monuments.107.desc: "L'épuisement et les mauvaises rations ont arrêté le travail. La cour doit satisfaire les ouvriers ou imposer l'ordre."
 bronze_city_monuments.107.a: "Payer et nourrir les ouvriers."
 bronze_city_monuments.107.b: "Les contraindre à reprendre."
 bronze_city_monuments.108.title: "Les convois n'arrivent plus"
 bronze_city_monuments.108.desc: "Les barges retardées et les greniers vides menacent les équipes comme les campagnes voisines."
 bronze_city_monuments.108.a: "Acheter des réserves d'urgence."
 bronze_city_monuments.108.b: "Laisser les districts supporter la pénurie."
 bronze_city_monuments.suspend: "Suspendre les travaux royaux."

 bronze_city_development.200.title: "Le jugement du festival"
 bronze_city_development.200.desc: "Des années de préparation à [bronze_city_mission_site.GetName] atteignent leur terme. La prospérité décidera si les visiteurs retiennent la splendeur ou le désordre."
 bronze_city_development.200.a: "Le festival honore la ville."
 bronze_city_development.201.title: "De nouveaux maîtres artisans"
 bronze_city_development.201.desc: "Artisans et scribes ont éprouvé le patronage offert par [bronze_city_mission_site.GetName]. Une activité durable est désormais possible."
 bronze_city_development.201.a: "Leur accorder des quartiers permanents."
 bronze_city_development.202.title: "Le marché renouvelé"
 bronze_city_development.202.desc: "Les nouveaux entrepôts et les routes protégées ont ramené les marchands à [bronze_city_mission_site.GetName]."
 bronze_city_development.202.a: "Ouvrir le marché aux négociants lointains."
 bronze_city_development.203.title: "Murailles restaurées"
 bronze_city_development.203.desc: "Les défenses réparées de [bronze_city_mission_site.GetName] commandent de nouveau ses approches."
 bronze_city_development.203.a: "Consacrer les murailles restaurées."
 bronze_city_development.204.title: "Greniers sécurisés"
 bronze_city_development.204.desc: "Les responsables de [bronze_city_mission_site.GetName] annoncent que la ville peut de nouveau résister à une mauvaise récolte."
 bronze_city_development.204.a: "Sceller les greniers pleins."
 bronze_city_development.mission_failed: "L'effort a échoué ; supportons les conséquences."

 bronze_city_development.320.title: "Cités rivales"
 bronze_city_development.320.desc: "[bronze_city_rivalry_home.GetName] et [bronze_city_rivalry_other.GetName] se disputent marchands, artisans et renommée. Nous pouvons négocier, investir ou recourir à une dangereuse intrigue."
 bronze_city_development.320.a: "Négocier un accord commercial."
 bronze_city_development.320.b: "Surpasser la cité rivale."
 bronze_city_development.320.c: "Saper sa prospérité."
 bronze_city_development.321.title: "Rivalité au sein du royaume"
 bronze_city_development.321.desc: "Les élites de [bronze_city_rivalry_home.GetName] et [bronze_city_rivalry_other.GetName] exigent préséance, investissements et faveur royale."
 bronze_city_development.321.a: "Investir dans les deux villes."
 bronze_city_development.321.b: "Favoriser la première ville."
 bronze_city_development.330.title: "Une ville presque abandonnée"
 bronze_city_development.330.desc: "Des quartiers entiers de [bronze_declining_city.GetName] sont vides. Nous pouvons financer une restauration coûteuse, superviser une évacuation ou abandonner la cité à ses ruines."
 bronze_city_development.330.a: "Restaurer la ville à tout prix."
 bronze_city_development.330.b: "Évacuer les quartiers les plus faibles."
 bronze_city_development.330.c: "Abandonner la cité."

 STATIC_MODIFIER_NAME_bronze_great_pyramid_construction_site: "Chantier de grande pyramide"
 STATIC_MODIFIER_DESC_bronze_great_pyramid_construction_site: "Carrières, rampes, camps et dépôts dominent cette ville."
 STATIC_MODIFIER_NAME_bronze_great_pyramid_reduced_scope: "Projet pyramidal réduit"
 STATIC_MODIFIER_DESC_bronze_great_pyramid_reduced_scope: "Les architectes royaux ont réduit l'ampleur prévue du monument."
 STATIC_MODIFIER_NAME_bronze_city_mission_underway: "Mission urbaine en cours"
 STATIC_MODIFIER_DESC_bronze_city_mission_underway: "Ressources et administrateurs sont engagés dans un projet urbain de longue durée."
 STATIC_MODIFIER_NAME_bronze_city_grand_festival_legacy: "Héritage d'un grand festival"
 STATIC_MODIFIER_DESC_bronze_city_grand_festival_legacy: "Les visiteurs se souviennent des rites et spectacles organisés dans cette ville."
 STATIC_MODIFIER_NAME_bronze_city_artisan_settlement: "Quartier d'artisans doté"
 STATIC_MODIFIER_DESC_bronze_city_artisan_settlement: "Des familles qualifiées ont reçu ateliers et protection durable."
 STATIC_MODIFIER_NAME_bronze_city_market_renewal: "Marché urbain renouvelé"
 STATIC_MODIFIER_DESC_bronze_city_market_renewal: "Routes protégées et entrepôts améliorés soutiennent le commerce."
 STATIC_MODIFIER_NAME_bronze_city_restored_fortifications: "Fortifications restaurées"
 STATIC_MODIFIER_DESC_bronze_city_restored_fortifications: "Les ouvrages défensifs ont été réparés et consacrés."
 STATIC_MODIFIER_NAME_bronze_city_secured_granaries: "Greniers sécurisés"
 STATIC_MODIFIER_DESC_bronze_city_secured_granaries: "Stockage et ravitaillement protègent mieux la population urbaine."
 STATIC_MODIFIER_NAME_bronze_city_rivalry_investment: "Investissement de rivalité"
 STATIC_MODIFIER_DESC_bronze_city_rivalry_investment: "La concurrence avec une autre grande cité attire de nouveaux mécènes."
 STATIC_MODIFIER_NAME_bronze_city_rivalry_trade_accord: "Accord entre cités rivales"
 STATIC_MODIFIER_DESC_bronze_city_rivalry_trade_accord: "D'anciennes rivales coordonnent désormais péages, marchands et routes."
 STATIC_MODIFIER_NAME_bronze_city_rivalry_sabotaged: "Sabotage urbain"
 STATIC_MODIFIER_DESC_bronze_city_rivalry_sabotaged: "Une intervention clandestine perturbe ateliers et confiance marchande."
 STATIC_MODIFIER_NAME_bronze_city_decline_stage_1: "Stagnation urbaine"
 STATIC_MODIFIER_DESC_bronze_city_decline_stage_1: "Des conditions fragiles diminuent lentement l'attraction et le prestige de la ville."
 STATIC_MODIFIER_NAME_bronze_city_decline_stage_2: "Déclin urbain"
 STATIC_MODIFIER_DESC_bronze_city_decline_stage_2: "Commerce, production et confiance urbaine s'affaiblissent."
 STATIC_MODIFIER_NAME_bronze_city_decline_stage_3: "Quartiers abandonnés"
 STATIC_MODIFIER_DESC_bronze_city_decline_stage_3: "Artisans et familles délaissent des quartiers entiers."
 STATIC_MODIFIER_NAME_bronze_city_decline_stage_4: "Cité presque abandonnée"
 STATIC_MODIFIER_DESC_bronze_city_decline_stage_4: "La population restante peine à maintenir une véritable ville."
 STATIC_MODIFIER_NAME_bronze_city_foremost_world: "Siège de la première cité du monde"
 STATIC_MODIFIER_DESC_bronze_city_foremost_world: "Notre plus grande ville domine tous les centres urbains connus."
 STATIC_MODIFIER_NAME_bronze_city_foremost_top_ten: "Siège d'une cité célèbre"
 STATIC_MODIFIER_DESC_bronze_city_foremost_top_ten: "Notre première cité compte parmi les dix plus grandes du monde."
 STATIC_MODIFIER_NAME_bronze_city_foremost_top_thirty: "Siège d'une cité renommée"
 STATIC_MODIFIER_DESC_bronze_city_foremost_top_thirty: "Notre première cité est connue bien au-delà du royaume."
 STATIC_MODIFIER_NAME_bronze_city_foremost_noted: "Siège urbain reconnu"
 STATIC_MODIFIER_DESC_bronze_city_foremost_noted: "La réputation de notre première ville donne un poids modeste à notre diplomatie."
 bronze_city_rivalry_mediated: "Rivalité urbaine apaisée"
 bronze_city_rivalry_competition: "Concurrence urbaine"
 bronze_city_rivalry_sabotage: "A saboté notre cité"
