 bronze_city_prestige_debug.2.title: "Debug de la grande pyramide"
 bronze_city_prestige_debug.2.desc: "Faire avancer le projet actif jusqu'à son prochain événement de phase."
 bronze_city_prestige_debug.2.a: "Faire avancer le projet."
 bronze_city_prestige_debug.3.title: "Debug des missions urbaines"
 bronze_city_prestige_debug.3.desc: "Ouvrir l'événement de résolution de la mission urbaine actuellement active."
 bronze_city_prestige_debug.3.a: "Résoudre la mission active."
 bronze_city_prestige_debug.4.title: "Debug des rivalités urbaines"
 bronze_city_prestige_debug.4.desc: "Créer une rivalité de test entre deux grandes cités éligibles. Une cité étrangère voisine est privilégiée."
 bronze_city_prestige_debug.4.a: "Créer la rivalité de test."
