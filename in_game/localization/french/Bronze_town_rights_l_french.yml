l_french:
 bronze_local_market_right: "Droit de marche local"
 bronze_local_market_right_desc: "La cite recoit le droit d'organiser un marche local regulier, placant les echanges voisins sous son autorite reconnue."
 bronze_council_of_elders_right: "Conseil des anciens"
 bronze_council_of_elders_right_desc: "Les anciens locaux sont charges de regler les litiges et de maintenir l'ordre dans l'arriere-pays de la cite."
 bronze_communal_granary_right: "Droit de grenier communautaire"
 bronze_communal_granary_right_desc: "La cite peut entretenir des reserves collectives de grain pour le stockage, la redistribution et les disettes."
 bronze_artisan_quarter_right: "Droit de quartier artisanal"
 bronze_artisan_quarter_right_desc: "Des quartiers specialises rassemblent les artisans qualifies sous la protection et la surveillance de la cite."
 bronze_regional_warehouse_right: "Droit d'entrepots regionaux"
 bronze_regional_warehouse_right_desc: "La cite est autorisee a stocker et redistribuer les biens regionaux des etablissements voisins."
 bronze_sanctuary_privilege: "Privilege de sanctuaire"
 bronze_sanctuary_privilege_desc: "Un sanctuaire reconnu renforce le prestige rituel de la cite et son autorite sur les communautes proches."
 bronze_palatial_redistribution_right: "Droit de redistribution palatiale"
 bronze_palatial_redistribution_right_desc: "Le palais controle les reserves, les obligations de travail et la redistribution reguliere dans le territoire urbain."
 bronze_scribe_archive_right: "Droit d'archives scribales"
 bronze_scribe_archive_right_desc: "Des archives scribales consignent les redevances, livraisons, obligations et transactions des elites."
 bronze_fortified_citadel_right: "Droit de citadelle fortifiee"
 bronze_fortified_citadel_right_desc: "La cite peut entretenir une citadelle fortifiee pour la protection locale et le controle administratif."
 bronze_protected_emporion_right: "Droit d'emporion protege"
 bronze_protected_emporion_right_desc: "Les marchands et les biens echanges sont proteges par l'autorite urbaine, soutenant les reseaux commerciaux etendus."
 bronze_regional_tribute_right: "Droit de tribut regional"
 bronze_regional_tribute_right_desc: "La cite peut prelever tribut et travail aupres de ses dependances regionales."
 bronze_palace_workshop_monopoly: "Monopole des ateliers palatiaux"
 bronze_palace_workshop_monopoly_desc: "Le palais reserve les productions essentielles des ateliers a la redistribution royale ou civique."
 bronze_royal_palace_complex_privilege: "Privilege du complexe palatial royal"
 bronze_royal_palace_complex_privilege_desc: "Un grand complexe palatial ancre la richesse, l'administration et le prestige de la cite."
 bronze_great_sanctuary_right: "Grand sanctuaire"
 bronze_great_sanctuary_right_desc: "Un sanctuaire majeur attire offrandes, visiteurs et autorite rituelle depuis toute la region."
 bronze_hegemonic_city_right: "Droit de cite hegemonique"
 bronze_hegemonic_city_right_desc: "La cite revendique un role dominant reconnu sur les communautes urbaines et rurales environnantes."
 bronze_town_right_rank_5_tt: "Necessite le rang de Prestige urbain : Ville locale ou superieur."
 bronze_town_right_rank_4_tt: "Necessite le rang de Prestige urbain : Ville regionale ou superieur."
 bronze_town_right_rank_3_tt: "Necessite le rang de Prestige urbain : Grande ville ou superieur."
 bronze_town_right_rank_2_tt: "Necessite le rang de Prestige urbain : Ville imperiale ou superieur."
 bronze_town_right_rank_1_tt: "Necessite le rang de Prestige urbain : Ville mondiale."
 bronze_town_right_trade_infrastructure_tt: "La cite doit posseder un marche ou une autre infrastructure commerciale."
