l_french:
 bronze_city_razing.1.title: "La ville est tombee"
 bronze_city_razing.1.desc: "[bronze_captured_city.GetName] est sous notre controle. Les portes sont ouvertes, les reserves sont exposees, et le sort de la population depend maintenant de l'armee victorieuse."
 bronze_city_razing.1.a: "Occuper la ville."
 bronze_city_razing.1.b: "Piller la ville."
 bronze_city_razing.1.c: "La raser jusqu'aux fondations."
 bronze_city_razing.2.title: "Le pillage est termine"
 bronze_city_razing.2.desc: "L'ordre de pillage a [bronze_captured_city.GetName] arrive a son terme. Si nous controlons encore la ville et qu'aucun nouveau siege n'a commence, le pillage est acheve. Si la ville a ete secourue ou contestee, seuls les premiers degats restent."
 bronze_city_razing.2.a: "Prendre le butin."
 bronze_city_razing.3.title: "La ville est brisee"
 bronze_city_razing.3.desc: "L'ordre de rasage a [bronze_captured_city.GetName] arrive a son terme. Si nous controlons encore la ville et qu'aucun nouveau siege n'a commence, la destruction est achevee. Si la ville a ete secourue ou contestee, les premiers degats sont deja faits."
 bronze_city_razing.3.a: "Resoudre l'ordre de rasage."
 bronze_city_razing.9.title: "Des ruines attendent d'etre explorees"
 bronze_city_razing.9.desc: "De vieux murs, des sanctuaires brises et des reserves enterrees subsistent dans nos terres. Des scribes et des aventuriers pensent qu'une expedition vers [bronze_ruins_site.GetName] pourrait retrouver des richesses, des archives ou des tombes royales."
 bronze_city_razing.9.a: "Financer l'expedition."
 bronze_city_razing.9.b: "Laisser la cite morte en paix."
 bronze_city_razing.10.title: "L'expedition atteint les ruines"
 bronze_city_razing.10.desc: "L'expedition a atteint les restes brises de [bronze_ruins_site.GetName]. Les premieres chambres sont instables, mais les guides affirment que les passages profonds peuvent encore cacher quelque chose."
 bronze_city_razing.10.a: "Avancer plus profondement."
 bronze_city_razing.10.b: "Se retirer avant de perdre davantage."
 bronze_city_razing.11.title: "Une expedition perdue"
 bronze_city_razing.11.desc: "L'expedition revient tard, affamee et reduite. Les passages effondres, la maladie et les terres hostiles ont consume l'effort sans veritable resultat."
 bronze_city_razing.11.a: "Accepter les pertes."
 bronze_city_razing.12.title: "Un tresor cache"
 bronze_city_razing.12.desc: "Une reserve scellee sous les ruines contient du metal travaille, des biens precieux et des offrandes cachees durant les derniers jours de la ville."
 bronze_city_razing.12.a: "Porter le tresor au palais."
 bronze_city_razing.13.title: "Des textes anciens retrouves"
 bronze_city_razing.13.desc: "Des scribes ont recupere des tablettes et inscriptions endommagees. Beaucoup sont fragmentaires, mais certaines preservent un savoir administratif et rituel perdu."
 bronze_city_razing.13.a: "Envoyer les textes aux savants."
 bronze_city_razing.14.title: "Une chambre funeraire royale"
 bronze_city_razing.14.desc: "L'expedition a trouve une chambre preparee pour un souverain oublie. Son contenu est utile, mais son importance ceremonielle est plus grande encore."
 bronze_city_razing.14.a: "Honorer les morts et consigner la decouverte."
 bronze_city_razing.15.title: "La malediction sacree"
 bronze_city_razing.15.desc: "Les ouvriers murmurent que les dieux enterres ont ete deranges. Malediction, maladie ou simple peur, le retour de l'expedition trouble la cour."
 bronze_city_razing.15.a: "Faire des offrandes et arreter les travaux."
 bronze_city_razing.20.title: "Reserves, sceaux et ordres"
 bronze_city_razing.20.desc: "Avant d'entrer dans [bronze_ruins_site.GetName], les scribes comptent les paniers de grain, les gardes inspectent leurs lances, et les ouvriers attendent les derniers ordres. Les premiers choix vont orienter toute l'expedition."
 bronze_city_razing.20.a: "Charger des provisions supplementaires."
 bronze_city_razing.20.b: "Voyager leger et avancer vite."
 bronze_city_razing.20.c: "Engager des guides locaux."
 bronze_city_razing.21.title: "La route des ruines"
 bronze_city_razing.21.desc: "La route vers [bronze_ruins_site.GetName] traverse champs brises, ravins secs et postes de garde abandonnes. L'expedition peut preserver ses forces ou sacrifier la securite pour la vitesse."
 bronze_city_razing.21.a: "Prendre la route sure."
 bronze_city_razing.21.b: "Forcer la marche."
 bronze_city_razing.21.c: "Demander des presages avant d'avancer."
 bronze_city_razing.22.title: "Une chambre inconnue"
 bronze_city_razing.22.desc: "Derriere un mur effondre, les ouvriers decouvrent une chambre scellee. Des signes effaces couvrent encore le platre, et un air froid passe sous les pierres."
 bronze_city_razing.22.a: "Cartographier et noter chaque detail."
 bronze_city_razing.22.b: "Briser le sceau."
 bronze_city_razing.22.c: "La laisser scellee."
 bronze_city_razing.23.title: "Pierre et poussiere"
 bronze_city_razing.23.desc: "Un passage s'effondre sous le poids de l'expedition. Des hommes crient derriere les pierres brisees pendant que le chef doit choisir s'il risque davantage de vies dans l'obscurite instable."
 bronze_city_razing.23.a: "Sauver les ouvriers pieges."
 bronze_city_razing.23.b: "Abandonner cette section."
 bronze_city_razing.23.c: "Envoyer les gardes en premier."
 bronze_city_razing.24.title: "Pretendants dans les ruines"
 bronze_city_razing.24.desc: "L'expedition n'est pas seule. Pillards armes, anciens locaux et guides douteux revendiquent tous un droit sur ce qui dort sous [bronze_ruins_site.GetName]."
 bronze_city_razing.24.a: "Negocier le passage."
 bronze_city_razing.24.b: "Les chasser."
 bronze_city_razing.24.c: "Acheter leur carte."
 bronze_city_razing.25.title: "La premiere decouverte"
 bronze_city_razing.25.desc: "L'expedition decouvre les traces d'un ordre disparu : jarres marquees, tablettes brisees, bronzes rituels et pieces scellees pendant les derniers jours de la cite."
 bronze_city_razing.25.a: "Documenter la decouverte."
 bronze_city_razing.25.b: "Recuperer les richesses."
 bronze_city_razing.25.c: "Consacrer la chambre."
 bronze_city_razing.26.title: "La porte scellee"
 bronze_city_razing.26.desc: "Au centre de la ruine se dresse une porte bloquee par de lourdes pierres. Les ouvriers disent qu'aucune simple reserve n'aurait ete scellee avec tant de soin."
 bronze_city_razing.26.a: "L'ouvrir."
 bronze_city_razing.26.b: "Envoyer une petite equipe."
 bronze_city_razing.26.c: "La marquer pour plus tard."
 bronze_city_razing.27.title: "Des regards etrangers"
 bronze_city_razing.27.desc: "L'expedition attire l'attention des maitres de ce pays. Leurs messagers demandent pourquoi des ouvriers armes fouillent des ruines sous leur autorite."
 bronze_city_razing.27.a: "Demander une permission officielle."
 bronze_city_razing.27.b: "Continuer discretement."
 bronze_city_razing.27.c: "Se retirer avant le scandale."
 bronze_city_razing.28.title: "Les reserves baissent"
 bronze_city_razing.28.desc: "Les reserves de nourriture de l'expedition sont presque epuisees. Maladie, mauvaises routes et passages plus longs que prevu transforment les plans prudents en epreuve d'endurance."
 bronze_city_razing.28.a: "Envoyer plus de provisions."
 bronze_city_razing.28.b: "Limiter les pertes."
 bronze_city_razing.28.c: "Avancer avant que les hommes se dispersent."
 bronze_city_razing.29.title: "Le retour de l'expedition"
 bronze_city_razing.29.desc: "Les survivants reviennent de [bronze_ruins_site.GetName] avec tablettes, fragments, recits et paniers scelles. Triomphe ou avertissement, la ruine a marque la cour."
 bronze_city_razing.29.a: "Recevoir l'expedition."
 be_ruin_final_artifact_unique_tt: "Un artefact unique est ajoute aux archives du palais."
 be_ruin_final_artifact_rare_tt: "Un artefact rare est ajoute aux archives du palais."
 be_ruin_final_artifact_common_tt: "Un artefact recupere est ajoute aux archives du palais."
 bronze_city_razing.30.title: "Le quartier royal"
 bronze_city_razing.30.desc: "L'expedition atteint un quartier sureleve de seuils de pierre, d'enduits peints et de reserves effondrees. Meme ruine, ce lieu portait autrefois l'autorite."
 bronze_city_razing.30.a: "Envoyer les scribes dans les salles du palais."
 bronze_city_razing.30.b: "Ouvrir les reserves royales."
 bronze_city_razing.30.c: "Sceller la salle du trone avec des offrandes."
 bronze_city_razing.31.title: "La salle des archives"
 bronze_city_razing.31.desc: "Des rangees d'etageres brisees et de tablettes durcies reposent sous la cendre et les poutres. Certaines archives ont survecu au dernier incendie."
 bronze_city_razing.31.a: "Laisser les savants travailler lentement."
 bronze_city_razing.31.b: "Retirer ce qui peut etre porte."
 bronze_city_razing.31.c: "Copier les signes fragiles sur place."
 bronze_city_razing.32.title: "La tombe royale"
 bronze_city_razing.32.desc: "Une chambre funeraire s'ouvre sous la ruine. Les ossements sont vieux, mais les objets autour d'eux parlent encore des derniers honneurs d'un souverain."
 bronze_city_razing.32.a: "Respecter les morts."
 bronze_city_razing.32.b: "Depouiller la chambre."
 bronze_city_razing.32.c: "Poster des gardes devant l'entree."
 bronze_city_razing.33.title: "Les entrepots du port"
 bronze_city_razing.33.desc: "Pres des anciens quais, l'expedition trouve des reserves scellees remplies de jarres brisees, marques commerciales et traces d'une evacuation precipitee."
 bronze_city_razing.33.a: "Noter les marques de commerce."
 bronze_city_razing.33.b: "Recuperer les biens stockes."
 bronze_city_razing.33.c: "Securiser d'abord les quais."
 bronze_city_razing.34.title: "Cargaison ensevelie"
 bronze_city_razing.34.desc: "La boue et les pierres tombees ont preserve une partie de la cargaison d'un navire. Des marques etrangeres subsistent sur certaines jarres."
 bronze_city_razing.34.a: "Remonter la cargaison avec soin."
 bronze_city_razing.34.b: "Depouiller vite le navire."
 bronze_city_razing.34.c: "Etudier les marques etrangeres."
 bronze_city_razing.35.title: "Le sanctuaire interieur"
 bronze_city_razing.35.desc: "Un sanctuaire survit derriere un mur effondre. Poutres brulees, vases rituels et statues fendues remplissent la chambre."
 bronze_city_razing.35.a: "Faire des offrandes avant d'entrer."
 bronze_city_razing.35.b: "Retirer les reliques."
 bronze_city_razing.35.c: "Interroger les signes du temple."
 bronze_city_razing.36.title: "L'armurerie"
 bronze_city_razing.36.desc: "Pointes de lance en bronze, boucliers brises et pieces empilees reposent sous le toit d'une caserne. Le lieu fut abandonne dans la hate."
 bronze_city_razing.36.a: "Cataloguer les armes."
 bronze_city_razing.36.b: "Recuperer le bronze."
 bronze_city_razing.36.c: "Securiser les casernes."
 bronze_city_razing.37.title: "La rue des ateliers"
 bronze_city_razing.37.desc: "Fours, enclumes, etablis et biens inacheves bordent une rue etroite. Les mains qui les utilisaient ont disparu depuis longtemps."
 bronze_city_razing.37.a: "Etudier les marques d'artisanat."
 bronze_city_razing.37.b: "Rassembler les outils."
 bronze_city_razing.37.c: "Engager des artisans survivants proches."
 bronze_city_razing.38.title: "Un passage cache"
 bronze_city_razing.38.desc: "Un passage etroit court sous la ruine. Il a pu servir aux gardes, pretres, contrebandiers ou fuyards pendant les derniers jours de la cite."
 bronze_city_razing.38.a: "Cartographier le passage."
 bronze_city_razing.38.b: "Envoyer des hommes armes."
 bronze_city_razing.38.c: "Bloquer la branche dangereuse."
 bronze_city_razing.39.title: "Incendie dans le camp"
 bronze_city_razing.39.desc: "Une etincelle prend dans du bois sec et de vieux tissus. La fumee traverse le camp pendant que les ouvriers trainent les paniers loin des flammes."
 bronze_city_razing.39.a: "Sauver les ouvriers et les reserves."
 bronze_city_razing.39.b: "Abandonner le quartier en flammes."
 bronze_city_razing.39.c: "Utiliser le feu pour degager les decombres."
 bronze_city_razing.40.title: "Pillards dans les ruines"
 bronze_city_razing.40.desc: "Des hommes armes apparaissent parmi les murs exterieurs. Ils connaissent bien les rues brisees et observent les reserves de l'expedition."
 bronze_city_razing.40.a: "Les payer pour partir."
 bronze_city_razing.40.b: "Les chasser."
 bronze_city_razing.40.c: "Les engager comme guides."
 bronze_city_razing.41.title: "Passages inondes"
 bronze_city_razing.41.desc: "L'eau s'infiltre dans les passages bas. Le sol devient glissant, les lampes faiblissent et l'air tourne."
 bronze_city_razing.41.a: "Drainer le passage."
 bronze_city_razing.41.b: "Faire demi-tour pour l'instant."
 bronze_city_razing.41.c: "Continuer malgre tout."
 bronze_city_razing.42.title: "Un quartier silencieux"
 bronze_city_razing.42.desc: "L'expedition passe des jours dans des rues vides. Poteries, cendre et os demeurent, mais rien n'explique encore pourquoi cette partie de la cite est morte."
 bronze_city_razing.42.a: "Continuer les recherches avec prudence."
 bronze_city_razing.42.b: "Forcer l'entree du quartier suivant."
 bronze_city_razing.42.c: "Revenir avec ce que nous avons."
 bronze_city_razing_1a_tt: "La ville est occupee avec un minimum de degats supplementaires."
 bronze_city_razing_1b_tt: "Lance un pillage de deux semaines. La location recoit un marqueur visible de pillage. L'action ne verrouille plus l'armee ; elle echoue seulement si la ville est liberee ou si un nouveau siege la conteste avant la fin. En cas de succes, nous gagnons du butin, tandis que la ville perd prosperite, population, nourriture et prestige urbain. Les pertes civiles ajoutent du score de guerre bonus."
 bronze_city_razing_1c_tt: "Lance une operation de rasage. Les cites prennent un mois ; les megalopoles prennent deux mois. La location recoit un marqueur visible de rasage. L'action ne verrouille plus l'armee ; elle echoue seulement si la ville est liberee ou si un nouveau siege la conteste avant la fin. En cas de succes, la ville subit de lourdes pertes de population, destructions de batiments, destruction du centre de marche si present, baisse de rang, forte perte de prosperite et score de guerre bonus lie aux pertes civiles."
 bronze_city_razing_2a_tt: "Si nous controlons encore la ville et qu'elle n'est pas assiegee, applique le pillage final : butin, pertes de population, perte de nourriture, degats de prosperite, perte de prestige urbain et score de guerre bonus lie aux pertes civiles. Si la ville a ete secourue ou contestee, interrompt le pillage et applique seulement des degats mineurs."
 bronze_city_razing_3a_tt: "Si nous controlons encore la ville et qu'elle n'est pas assiegee, applique le rasage final : butin, lourdes pertes de population, destruction de batiments, destruction du centre de marche si present, baisse du rang de colonie, retrait du prestige urbain si la location n'est plus une cite, et score de guerre bonus lie aux pertes civiles. Si la ville a ete secourue ou contestee, interrompt le rasage et applique des degats partiels."
 bronze_city_razing_9a_tt: "Depense 50 d'or pour envoyer une expedition."
 bronze_city_razing_9b_tt: "Aucune expedition n'est lancee."
 bronze_city_razing_10a_tt: "Depense 20 d'or supplementaires et continue."
 bronze_city_razing_10b_tt: "Met fin a l'expedition et marque la ruine comme recemment exploree."
