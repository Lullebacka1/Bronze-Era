 STATIC_MODIFIER_NAME_bronze_city_orderly_occupation: "Occupation ordonnee"
 STATIC_MODIFIER_DESC_bronze_city_orderly_occupation: "La ville a ete prise sous occupation controlee plutot que livree a un pillage sans ordre."
 STATIC_MODIFIER_NAME_bronze_city_being_sacked: "En cours de pillage"
 STATIC_MODIFIER_DESC_bronze_city_being_sacked: "Les soldats arrachent a la ville ses richesses, sa nourriture, ses captifs et son prestige."
 STATIC_MODIFIER_NAME_bronze_city_recently_sacked: "Recemment pillee"
 STATIC_MODIFIER_DESC_bronze_city_recently_sacked: "Les marches, les foyers et la reputation de la ville ne se sont pas remis d'un pillage recent."
 STATIC_MODIFIER_NAME_bronze_city_razing_underway: "Rasage en cours"
 STATIC_MODIFIER_DESC_bronze_city_razing_underway: "La force occupante demantele la ville. Les cites prennent un mois ; les megalopoles prennent deux mois. Si la ville est liberee ou contestee avant la fin, le rasage est interrompu mais des degats partiels restent."
 STATIC_MODIFIER_NAME_bronze_city_razed: "Ville rasee"
 STATIC_MODIFIER_DESC_bronze_city_razed: "Une grande partie de la cite a ete volontairement detruite."
 STATIC_MODIFIER_NAME_bronze_city_severe_ruins: "Ruines severes"
 STATIC_MODIFIER_DESC_bronze_city_severe_ruins: "De larges parties de la ville sont brisees, abandonnees ou inutilisables. Ceci est un marqueur visuel ; les degats sont portes par le modificateur de ville rasee."
 STATIC_MODIFIER_NAME_bronze_ancient_ruins_location: "Ruines antiques"
 STATIC_MODIFIER_DESC_bronze_ancient_ruins_location: "Ce lieu conserve les restes d'une ville detruite de l'age du bronze. Ce marqueur n'a aucun effet gameplay direct."
 STATIC_MODIFIER_NAME_bronze_ruins_expedition_camp: "Camp d'expedition des ruines"
 STATIC_MODIFIER_DESC_bronze_ruins_expedition_camp: "Scribes, ouvriers, gardes et guides fouillent les restes d'une cite antique."
