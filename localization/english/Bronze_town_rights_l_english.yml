l_english:
 bronze_local_market_right: "Local Market Right"
 bronze_local_market_right_desc: "The city receives the right to organize a regular local market, drawing nearby exchange under its recognized authority."
 bronze_council_of_elders_right: "Council of Elders"
 bronze_council_of_elders_right_desc: "Local elders are entrusted with settling disputes and maintaining order in the city's hinterland."
 bronze_communal_granary_right: "Communal Granary Right"
 bronze_communal_granary_right_desc: "The city may maintain communal grain reserves for storage, redistribution, and famine relief."
 bronze_artisan_quarter_right: "Artisan Quarter Right"
 bronze_artisan_quarter_right_desc: "Special quarters gather skilled craft workers under urban protection and supervision."
 bronze_regional_warehouse_right: "Regional Warehouse Right"
 bronze_regional_warehouse_right_desc: "The city is authorized to store and redistribute regional goods for surrounding settlements."
 bronze_sanctuary_privilege: "Sanctuary Privilege"
 bronze_sanctuary_privilege_desc: "A recognized sanctuary strengthens the city's ritual prestige and its authority over nearby communities."
 bronze_palatial_redistribution_right: "Palatial Redistribution Right"
 bronze_palatial_redistribution_right_desc: "The palace controls stores, labor obligations, and regular redistribution across the urban territory."
 bronze_scribe_archive_right: "Scribe Archive Right"
 bronze_scribe_archive_right_desc: "A scribal archive records dues, deliveries, obligations, and elite transactions."
 bronze_fortified_citadel_right: "Fortified Citadel Right"
 bronze_fortified_citadel_right_desc: "The city may maintain a fortified citadel for local protection and administrative control."
 bronze_protected_emporion_right: "Protected Emporion Right"
 bronze_protected_emporion_right_desc: "Merchants and exchanged goods are protected by the city's authority, supporting wider trade networks."
 bronze_regional_tribute_right: "Regional Tribute Right"
 bronze_regional_tribute_right_desc: "The city can gather tribute and labor from its regional dependencies."
 bronze_palace_workshop_monopoly: "Palace Workshop Monopoly"
 bronze_palace_workshop_monopoly_desc: "The palace reserves key workshop production for royal or civic redistribution."
 bronze_royal_palace_complex_privilege: "Royal Palace Complex Privilege"
 bronze_royal_palace_complex_privilege_desc: "A large palace complex anchors the city's wealth, administration, and prestige."
 bronze_great_sanctuary_right: "Great Sanctuary Right"
 bronze_great_sanctuary_right_desc: "A major sanctuary draws offerings, visitors, and ritual authority from across the region."
 bronze_hegemonic_city_right: "Hegemonic City Right"
 bronze_hegemonic_city_right_desc: "The city claims a recognized leading role over surrounding urban and rural communities."
 bronze_town_right_rank_5_tt: "Requires City Prestige rank: Local City or higher."
 bronze_town_right_rank_4_tt: "Requires City Prestige rank: Regional City or higher."
 bronze_town_right_rank_3_tt: "Requires City Prestige rank: Great City or higher."
 bronze_town_right_rank_2_tt: "Requires City Prestige rank: Imperial City or higher."
 bronze_town_right_rank_1_tt: "Requires City Prestige rank: World City."
 bronze_town_right_trade_infrastructure_tt: "The city must have a market or other trade infrastructure."
