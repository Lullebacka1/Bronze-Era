 STATIC_MODIFIER_DESC_bronze_city_prestige_influence_1: "The realm controls at least one of the foremost cities of the known world."
 STATIC_MODIFIER_NAME_bronze_city_prestige_influence_2: "Regional Urban Influence"
 STATIC_MODIFIER_DESC_bronze_city_prestige_influence_2: "The realm's great cities project authority beyond their immediate hinterlands."
 STATIC_MODIFIER_NAME_bronze_city_prestige_influence_3: "Great Urban Influence"
 STATIC_MODIFIER_DESC_bronze_city_prestige_influence_3: "The realm commands major centers of population, trade, and administration."
 STATIC_MODIFIER_NAME_bronze_city_prestige_influence_4: "Dominant Urban Influence"
 STATIC_MODIFIER_DESC_bronze_city_prestige_influence_4: "The realm's cities shape diplomacy, commerce, and prestige across the known world."
 STATIC_MODIFIER_NAME_bronze_city_prestige_influence_5: "Master of the Great Cities"
 STATIC_MODIFIER_DESC_bronze_city_prestige_influence_5: "Several of the world's greatest cities stand under this realm's authority."
 STATIC_MODIFIER_NAME_bronze_city_royal_capital_regional: "Renowned Royal Capital"
 STATIC_MODIFIER_DESC_bronze_city_royal_capital_regional: "A respected regional capital lends authority to the ruling dynasty."
 STATIC_MODIFIER_NAME_bronze_city_royal_capital_great: "Great Royal Capital"
 STATIC_MODIFIER_DESC_bronze_city_royal_capital_great: "The fame of this great capital strengthens the ruler's legitimacy."
 STATIC_MODIFIER_NAME_bronze_city_royal_capital_imperial: "Imperial Royal Capital"
 STATIC_MODIFIER_DESC_bronze_city_royal_capital_imperial: "A capital of imperial renown visibly confirms the ruler's claim to command."
 STATIC_MODIFIER_NAME_bronze_city_royal_capital_world: "Capital of the Known World"
 STATIC_MODIFIER_DESC_bronze_city_royal_capital_world: "The greatest city of the age stands as the foremost symbol of dynastic authority."
 STATIC_MODIFIER_NAME_bronze_city_scholars_gathered: "Scholars Gathered"
 STATIC_MODIFIER_DESC_bronze_city_scholars_gathered: "Scribes, priests, and learned visitors have made this city a center of knowledge."
 STATIC_MODIFIER_NAME_bronze_city_scholarly_patronage: "Scholarly Patronage"
 STATIC_MODIFIER_DESC_bronze_city_scholarly_patronage: "The court supports teachers, archives, scribes, and the exchange of new ideas."
 STATIC_MODIFIER_NAME_bronze_city_scholarly_court: "Scholarly Court"
 STATIC_MODIFIER_DESC_bronze_city_scholarly_court: "Teachers and learned scribes improve the education available within the ruling household."
 STATIC_MODIFIER_NAME_bronze_city_famous_craftsmen: "Famous Craftsmen"
 STATIC_MODIFIER_DESC_bronze_city_famous_craftsmen: "Master artisans attract commissions and apprentices from distant lands."
 STATIC_MODIFIER_NAME_bronze_city_merchant_caravan: "Merchant Caravan"
 STATIC_MODIFIER_DESC_bronze_city_merchant_caravan: "A wealthy caravan has renewed commerce and carried news of the city's prosperity abroad."
 STATIC_MODIFIER_NAME_bronze_city_foreign_envoys: "Foreign Envoys"
 STATIC_MODIFIER_DESC_bronze_city_foreign_envoys: "Foreign delegations at court improve the realm's diplomatic standing."
 STATIC_MODIFIER_NAME_bronze_city_famine: "Urban Famine"
 STATIC_MODIFIER_DESC_bronze_city_famine: "Food scarcity is killing inhabitants, emptying workshops, and tarnishing the city's reputation."
 STATIC_MODIFIER_NAME_bronze_city_trade_collapse: "Collapsed Urban Trade"
 STATIC_MODIFIER_DESC_bronze_city_trade_collapse: "Broken routes and deserted markets have sharply reduced the city's prosperity and influence."
 STATIC_MODIFIER_NAME_bronze_city_population_exodus: "Population Exodus"
 STATIC_MODIFIER_DESC_bronze_city_population_exodus: "Families and craftsmen are abandoning the damaged city for safer settlements."
 bronze_city_welcomed_envoys: "Envoys Welcomed"
 bronze_city_taxed_envoys: "Envoys Heavily Taxed"
 bronze_city_prestige.1.title: "Scholars Gather"
 bronze_city_prestige.1.desc: "Scribes, priests, healers, and learned travelers are gathering in [bronze_city.GetName]. With suitable patronage, their debates and archives could enhance both the city's fame and the education of our court."
 bronze_city_prestige.1.a: "Endow their schools and archives."
 bronze_city_prestige.1.b: "Let them support themselves."
 bronze_city_prestige.2.title: "Famous Craftsmen"
 bronze_city_prestige.2.desc: "The workshops of [bronze_city.GetName] now shelter craftsmen whose work is sought far beyond our borders. Their skill could become a lasting source of prosperity, provided the court supports them."
 bronze_city_prestige.2.a: "Grant them workshops and royal commissions."
 bronze_city_prestige.2.b: "Collect an extraordinary levy from their success."
 bronze_city_prestige.3.title: "Merchant Caravan"
 bronze_city_prestige.3.desc: "A prosperous caravan has reached [bronze_city.GetName], bringing rare materials, foreign merchants, and valuable contracts. Its leaders request protection and favorable treatment."
 bronze_city_prestige.3.a: "Protect the merchants and encourage lasting trade."
 bronze_city_prestige.3.b: "Take the richest possible toll."
 bronze_city_prestige.4.title: "Foreign Envoys"
 bronze_city_prestige.4.desc: "The fame of [bronze_city.GetName] has drawn envoys from neighboring courts. Their reception will shape how foreign rulers judge both our capital and our dynasty."
 bronze_city_prestige.4.a: "Receive them with costly honors."
 bronze_city_prestige.4.b: "Demand gifts and ceremonial dues."
 bronze_city_prestige.5.title: "Famine in a Great City"
 bronze_city_prestige.5.desc: "The granaries of [bronze_city.GetName] cannot feed its crowded districts. Prices are rising, the weakest inhabitants are dying, and every empty street damages the city's reputation."
 bronze_city_prestige.5.a: "Purchase grain at any price."
 bronze_city_prestige.5.b: "Impose strict rationing."
 bronze_city_prestige.6.title: "Trade Collapse"
 bronze_city_prestige.6.desc: "Merchants are abandoning [bronze_city.GetName] as roads fail, markets shrink, and distant suppliers cease arriving. Without intervention, the city will lose wealth, people, and prestige."
 bronze_city_prestige.6.a: "Subsidize the markets and trade routes."
 bronze_city_prestige.6.b: "Seize what remains and accept the decline."
 bronze_city_prestige.7.title: "Population Exodus"
 bronze_city_prestige.7.desc: "Damage and insecurity have driven families from [bronze_city.GetName]. Artisans carry away their tools, farmers abandon nearby fields, and the city's former prestige is fading with its inhabitants."
 bronze_city_prestige.7.a: "Organize an orderly resettlement within the realm."
 bronze_city_prestige.7.b: "Close the gates and preserve the treasury."
