 bronze_city_monuments.100.title: "Les carrières royales"
 bronze_city_monuments.100.desc: "Les arpenteurs ont marqué la pierre et organisé les routes vers [bronze_great_pyramid_site.GetName]. L'ampleur des carrières déterminera toute la suite."
 bronze_city_monuments.100.a: "Ouvrir les grandes carrières royales."
 bronze_city_monuments.100.b: "Réduire l'ampleur prévue."
 bronze_city_monuments.101.title: "Le travail de l'Égypte"
 bronze_city_monuments.101.desc: "Les contremaîtres réclament ouvriers, rations, outils et protection pour un projet qui survivra à ses premiers bâtisseurs."
 bronze_city_monuments.101.a: "Mobiliser le système de travail royal."
 bronze_city_monuments.101.b: "Exiger davantage des districts locaux."
 bronze_city_monuments.102.title: "La pierre pour l'horizon"
 bronze_city_monuments.102.desc: "Les plus grands blocs doivent franchir routes et voies d'eau sans affamer les camps ni les cités voisines."
 bronze_city_monuments.102.a: "Financer le transport et le ravitaillement."
 bronze_city_monuments.102.b: "Vider les greniers voisins."
 bronze_city_monuments.103.title: "La pyramide s'élève"
 bronze_city_monuments.103.desc: "Assise après assise, la structure domine [bronze_great_pyramid_site.GetName], mais elle exige encore des années de travail."
 bronze_city_monuments.103.a: "Maintenir le chantier à pleine puissance."
 bronze_city_monuments.103.b: "Accepter un monument plus modeste."
 bronze_city_monuments.104.title: "La demeure d'éternité"
 bronze_city_monuments.104.desc: "Prêtres et architectes réclament le temple funéraire, les voies processionnelles et l'enceinte sacrée."
 bronze_city_monuments.104.a: "Achever tout le complexe funéraire."
 bronze_city_monuments.104.b: "N'accomplir que les rites essentiels."
 bronze_city_monuments.105.title: "Une nouvelle grande pyramide"
 bronze_city_monuments.105.desc: "Les dernières pierres sont posées et le complexe royal de [bronze_great_pyramid_site.GetName] attend sa consécration."
 bronze_city_monuments.105.a: "Consacrer le monument pour l'éternité."
 bronze_city_monuments.107.title: "Les ouvriers refusent les carrières"
 bronze_city_monuments.107.desc: "L'épuisement et les mauvaises rations ont arrêté le travail. La cour doit satisfaire les ouvriers ou imposer l'ordre."
 bronze_city_monuments.107.a: "Payer et nourrir les ouvriers."
 bronze_city_monuments.107.b: "Les contraindre à reprendre."
 bronze_city_monuments.108.title: "Les convois n'arrivent plus"
 bronze_city_monuments.108.desc: "Les barges retardées et les greniers vides menacent les équipes comme les campagnes voisines."
 bronze_city_monuments.108.a: "Acheter des réserves d'urgence."
 bronze_city_monuments.108.b: "Laisser les districts supporter la pénurie."
 bronze_city_monuments.suspend: "Suspendre les travaux royaux."
 bronze_city_development.200.title: "Le jugement du festival"
 bronze_city_development.200.desc: "Des années de préparation à [bronze_city_mission_site.GetName] atteignent leur terme. La prospérité décidera si les visiteurs retiennent la splendeur ou le désordre."
 bronze_city_development.200.a: "Le festival honore la ville."
 bronze_city_development.201.title: "De nouveaux maîtres artisans"
 bronze_city_development.201.desc: "Artisans et scribes ont éprouvé le patronage offert par [bronze_city_mission_site.GetName]. Une activité durable est désormais possible."
 bronze_city_development.201.a: "Leur accorder des quartiers permanents."
 bronze_city_development.202.title: "Le marché renouvelé"
 bronze_city_development.202.desc: "Les nouveaux entrepôts et les routes protégées ont ramené les marchands à [bronze_city_mission_site.GetName]."
 bronze_city_development.202.a: "Ouvrir le marché aux négociants lointains."
 bronze_city_development.203.title: "Murailles restaurées"
 bronze_city_development.203.desc: "Les défenses réparées de [bronze_city_mission_site.GetName] commandent de nouveau ses approches."
 bronze_city_development.203.a: "Consacrer les murailles restaurées."
 bronze_city_development.204.title: "Greniers sécurisés"
 bronze_city_development.204.desc: "Les responsables de [bronze_city_mission_site.GetName] annoncent que la ville peut de nouveau résister à une mauvaise récolte."
 bronze_city_development.204.a: "Sceller les greniers pleins."
 bronze_city_development.mission_failed: "L'effort a échoué ; supportons les conséquences."
 bronze_city_development.320.title: "Cités rivales"
 bronze_city_development.320.desc: "[bronze_city_rivalry_home.GetName] et [bronze_city_rivalry_other.GetName] se disputent marchands, artisans et renommée. Nous pouvons négocier, investir ou recourir à une dangereuse intrigue."
 bronze_city_development.320.a: "Négocier un accord commercial."
 bronze_city_development.320.b: "Surpasser la cité rivale."
 bronze_city_development.320.c: "Saper sa prospérité."
 bronze_city_development.321.title: "Rivalité au sein du royaume"
 bronze_city_development.321.desc: "Les élites de [bronze_city_rivalry_home.GetName] et [bronze_city_rivalry_other.GetName] exigent préséance, investissements et faveur royale."
 bronze_city_development.321.a: "Investir dans les deux villes."
 bronze_city_development.321.b: "Favoriser la première ville."
 bronze_city_development.330.title: "Une ville presque abandonnée"
 bronze_city_development.330.desc: "Des quartiers entiers de [bronze_declining_city.GetName] sont vides. Nous pouvons financer une restauration coûteuse, superviser une évacuation ou abandonner la cité à ses ruines."
 bronze_city_development.330.a: "Restaurer la ville à tout prix."
 bronze_city_development.330.b: "Évacuer les quartiers les plus faibles."
 bronze_city_development.330.c: "Abandonner la cité."
