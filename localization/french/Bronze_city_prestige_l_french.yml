 BRONZE_CITY_PRESTIGE_OWNER: "Proprietaire"
 BRONZE_CITY_PRESTIGE_POPULATION: "Population"
 BRONZE_CITY_PRESTIGE_CULTURE: "Culture"
 BRONZE_CITY_PRESTIGE_RELATIVE_SCORE: "Score relatif"
 BRONZE_CITY_PRESTIGE_CURRENT_BONUSES: "Effets du rang actuel"
 BRONZE_CITY_PRESTIGE_LOCAL_CITY_NO_BONUS: "Les villes locales recoivent un faible bonus d'attraction migratoire."
 BRONZE_CITY_PRESTIGE_NO_KNOWN_CITIES: "Aucune ville ou megalopole n'est actuellement enregistree."
 BRONZE_CITY_PRESTIGE_DYNAMIC_SCORE_TT: "Le prestige brut determine la position mondiale exacte. Le rang d'influence depend aussi du classement, du prestige minimal et du statut politique des villes imperiales."
 STATIC_MODIFIER_NAME_bronze_city_prestige_influence_1: "Centre urbain renomme"
 STATIC_MODIFIER_DESC_bronze_city_prestige_influence_1: "Le royaume controle au moins une des principales villes du monde connu."
 STATIC_MODIFIER_NAME_bronze_city_prestige_influence_2: "Influence urbaine regionale"
 STATIC_MODIFIER_DESC_bronze_city_prestige_influence_2: "Les grandes villes du royaume projettent leur autorite au-dela de leur arriere-pays."
 STATIC_MODIFIER_NAME_bronze_city_prestige_influence_3: "Grande influence urbaine"
 STATIC_MODIFIER_DESC_bronze_city_prestige_influence_3: "Le royaume controle des centres majeurs de population, de commerce et d'administration."
 STATIC_MODIFIER_NAME_bronze_city_prestige_influence_4: "Influence urbaine dominante"
 STATIC_MODIFIER_DESC_bronze_city_prestige_influence_4: "Les villes du royaume influencent la diplomatie, le commerce et le prestige du monde connu."
 STATIC_MODIFIER_NAME_bronze_city_prestige_influence_5: "Maitre des grandes villes"
 STATIC_MODIFIER_DESC_bronze_city_prestige_influence_5: "Plusieurs des plus grandes villes du monde sont placees sous l'autorite de ce royaume."
 STATIC_MODIFIER_NAME_bronze_city_royal_capital_regional: "Capitale royale renommee"
 STATIC_MODIFIER_DESC_bronze_city_royal_capital_regional: "Une capitale regionale respectee renforce l'autorite de la dynastie."
 STATIC_MODIFIER_NAME_bronze_city_royal_capital_great: "Grande capitale royale"
 STATIC_MODIFIER_DESC_bronze_city_royal_capital_great: "La renommee de cette grande capitale renforce la legitimite du souverain."
 STATIC_MODIFIER_NAME_bronze_city_royal_capital_imperial: "Capitale royale imperiale"
 STATIC_MODIFIER_DESC_bronze_city_royal_capital_imperial: "Une capitale de renommee imperiale confirme visiblement le droit du souverain a commander."
 STATIC_MODIFIER_NAME_bronze_city_royal_capital_world: "Capitale du monde connu"
 STATIC_MODIFIER_DESC_bronze_city_royal_capital_world: "La plus grande ville de l'epoque est le principal symbole de l'autorite dynastique."
 STATIC_MODIFIER_NAME_bronze_city_scholars_gathered: "Rassemblement de savants"
 STATIC_MODIFIER_DESC_bronze_city_scholars_gathered: "Des scribes, pretres et erudits ont fait de cette ville un centre du savoir."
 STATIC_MODIFIER_NAME_bronze_city_scholarly_patronage: "Mecenat savant"
 STATIC_MODIFIER_DESC_bronze_city_scholarly_patronage: "La cour soutient les maitres, les archives, les scribes et l'echange des idees."
 STATIC_MODIFIER_NAME_bronze_city_scholarly_court: "Cour savante"
 STATIC_MODIFIER_DESC_bronze_city_scholarly_court: "Des maitres et scribes erudits ameliorent l'education dispensee dans la maison souveraine."
 STATIC_MODIFIER_NAME_bronze_city_famous_craftsmen: "Artisans renommes"
 STATIC_MODIFIER_DESC_bronze_city_famous_craftsmen: "Des maitres artisans attirent commandes et apprentis venus de terres lointaines."
 STATIC_MODIFIER_NAME_bronze_city_merchant_caravan: "Caravane marchande"
 STATIC_MODIFIER_DESC_bronze_city_merchant_caravan: "Une riche caravane a relance le commerce et diffuse la renommee de la ville."
 STATIC_MODIFIER_NAME_bronze_city_foreign_envoys: "Envoyes etrangers"
 STATIC_MODIFIER_DESC_bronze_city_foreign_envoys: "Les delegations etrangeres presentes a la cour ameliorent la reputation diplomatique du royaume."
 STATIC_MODIFIER_NAME_bronze_city_famine: "Famine urbaine"
 STATIC_MODIFIER_DESC_bronze_city_famine: "Le manque de nourriture tue les habitants, vide les ateliers et ternit la reputation de la ville."
 STATIC_MODIFIER_NAME_bronze_city_trade_collapse: "Effondrement du commerce urbain"
 STATIC_MODIFIER_DESC_bronze_city_trade_collapse: "Les routes brisees et les marches desertes reduisent fortement la prosperite et l'influence de la ville."
 STATIC_MODIFIER_NAME_bronze_city_population_exodus: "Exode de la population"
 STATIC_MODIFIER_DESC_bronze_city_population_exodus: "Les familles et les artisans abandonnent la ville endommagee pour des implantations plus sures."
 bronze_city_welcomed_envoys: "Envoyes accueillis"
 bronze_city_taxed_envoys: "Envoyes lourdement taxes"
 bronze_city_prestige.1.title: "Les savants se rassemblent"
 bronze_city_prestige.1.desc: "Des scribes, pretres, guerisseurs et voyageurs erudits se rassemblent a [bronze_city.GetName]. Un soutien adapte pourrait accroitre la renommee de la ville et ameliorer l'education de notre cour."
 bronze_city_prestige.1.a: "Financer leurs ecoles et leurs archives."
 bronze_city_prestige.1.b: "Les laisser subvenir a leurs propres besoins."
 bronze_city_prestige.2.title: "Des artisans renommes"
 bronze_city_prestige.2.desc: "Les ateliers de [bronze_city.GetName] abritent desormais des artisans dont les ouvrages sont recherches bien au-dela de nos frontieres. Leur talent peut devenir une source durable de prosperite."
 bronze_city_prestige.2.a: "Leur accorder des ateliers et des commandes royales."
 bronze_city_prestige.2.b: "Prelever une contribution exceptionnelle."
 bronze_city_prestige.3.title: "Une caravane marchande"
 bronze_city_prestige.3.desc: "Une caravane prospere a atteint [bronze_city.GetName], apportant des materiaux rares, des marchands etrangers et de precieux contrats. Ses chefs demandent protection et faveur."
 bronze_city_prestige.3.a: "Proteger les marchands et favoriser un commerce durable."
 bronze_city_prestige.3.b: "Prelever le peage le plus eleve possible."
 bronze_city_prestige.4.title: "Des envoyes etrangers"
 bronze_city_prestige.4.desc: "La renommee de [bronze_city.GetName] attire des envoyes des cours voisines. Leur accueil influencera le jugement des souverains etrangers sur notre dynastie."
 bronze_city_prestige.4.a: "Les recevoir avec des honneurs couteux."
 bronze_city_prestige.4.b: "Exiger des presents et des droits ceremoniels."
 bronze_city_prestige.5.title: "Famine dans une grande ville"
 bronze_city_prestige.5.desc: "Les greniers de [bronze_city.GetName] ne peuvent plus nourrir ses quartiers peuples. Les prix montent, les plus faibles meurent et chaque rue vide nuit a la reputation de la ville."
 bronze_city_prestige.5.a: "Acheter du grain a n'importe quel prix."
 bronze_city_prestige.5.b: "Imposer un rationnement strict."
 bronze_city_prestige.6.title: "Effondrement du commerce"
 bronze_city_prestige.6.desc: "Les marchands abandonnent [bronze_city.GetName] tandis que les routes se degradent, les marches diminuent et les fournisseurs lointains cessent de venir."
 bronze_city_prestige.6.a: "Subventionner les marches et les routes commerciales."
 bronze_city_prestige.6.b: "Saisir les richesses restantes et accepter le declin."
 bronze_city_prestige.7.title: "Exode de la population"
 bronze_city_prestige.7.desc: "Les destructions et l'insecurite chassent les familles de [bronze_city.GetName]. Les artisans emportent leurs outils et la renommee de la ville disparait avec ses habitants."
 bronze_city_prestige.7.a: "Organiser leur reinstallation dans le royaume."
 bronze_city_prestige.7.b: "Fermer les portes et preserver le tresor."
