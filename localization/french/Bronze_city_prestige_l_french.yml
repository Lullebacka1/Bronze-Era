 STATIC_MODIFIER_NAME_bronze_city_prestige_rank_1_world_city: "Prestige urbain : ville mondiale"
 STATIC_MODIFIER_DESC_bronze_city_prestige_rank_1_world_city: "L'une des principales villes du monde connu, renommee pour sa population, ses richesses, ses monuments et son influence politique."
 STATIC_MODIFIER_NAME_bronze_city_prestige_rank_2_imperial_city: "Prestige urbain : ville imperiale"
 STATIC_MODIFIER_DESC_bronze_city_prestige_rank_2_imperial_city: "Un centre royal et administratif dominant dont l'influence depasse largement les terres environnantes."
 STATIC_MODIFIER_NAME_bronze_city_prestige_rank_3_great_city: "Prestige urbain : grande ville"
 STATIC_MODIFIER_DESC_bronze_city_prestige_rank_3_great_city: "Un centre majeur de population, de commerce, de religion et d'autorite regionale."
 STATIC_MODIFIER_NAME_bronze_city_prestige_rank_4_regional_city: "Prestige urbain : ville regionale"
 STATIC_MODIFIER_DESC_bronze_city_prestige_rank_4_regional_city: "Une implantation importante servant de marche regional et de siege de l'autorite."
 STATIC_MODIFIER_NAME_bronze_city_prestige_rank_5_local_city: "Prestige urbain : ville locale"
 STATIC_MODIFIER_DESC_bronze_city_prestige_rank_5_local_city: "Un centre urbain reconnu exercant son influence sur son arriere-pays immediat."
 BRONZE_CITY_PRESTIGE_LEDGER_TAB: "Grandes villes"
 BRONZE_CITY_PRESTIGE_LEDGER_TITLE: "Grandes villes du monde connu"
 BRONZE_CITY_PRESTIGE_URBAN_INFLUENCE: "Influence urbaine"
 BRONZE_CITY_PRESTIGE_URBAN_INFLUENCE_DESC: "Toutes les villes et megalopoles du monde sont affichees. Les quinze villes les mieux classees accordent de l'influence urbaine a leur proprietaire."
 BRONZE_CITY_PRESTIGE_URBAN_INFLUENCE_TT: "L'influence urbaine est obtenue en possedant une ville du top 15 mondial. Elle est convertie en projection de puissance et en prestige mensuel par un seul modificateur national."
