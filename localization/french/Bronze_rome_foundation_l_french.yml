l_french:
 bronze_rome_foundation.1.title: "La fondation de Rome"
 bronze_rome_foundation.1.desc: "Sur les rives du Tibre, une communaute latiale fortifiee se rassemble autour d'une nouvelle maison royale. Ses anciens parlent d'augures, de chemins de betail, de bornes sacrees et d'une cite appelee a dominer les collines du Latium. Si elle est reconnue, Rome deviendra un jeune royaume independant."
 bronze_rome_foundation.1.a: "Lever la banniere de la louve sur Rome."
 bronze_rome_foundation.1.b: "Garder la colonie sous les rois latins."
 bronze_rome_foundation.2.title: "La colonie du Tibre"
 bronze_rome_foundation.2.desc: "Des colons latiaux et des bandes guerrieres autour du Tibre demandent a former leur propre cite sous un nouveau roi. Leur accorder l'independance creera Rome, mais les refuser maintiendra le passage du fleuve sous notre autorite directe."
 bronze_rome_foundation.2.a: "Permettre la fondation de Rome."
 bronze_rome_foundation.2.b: "Absorber la colonie dans notre royaume."
 bronze_rome_foundation_1a_tt: "Rome est creee comme royaume latial independant dans la location de Rome. Vous continuerez la partie avec Rome."
 bronze_rome_foundation_1b_tt: "Rome n'est pas creee. La colonie reste sous votre pays actuel et recoit un bonus local plus faible. Ce refus ne bloque pas definitivement Rome si un autre souverain controle plus tard le Tibre."
 bronze_rome_foundation_2a_tt: "Rome est creee comme royaume latial independant. Votre pays perd volontairement la location de Rome."
 bronze_rome_foundation_2b_tt: "Rome n'est pas creee. La colonie reste sous votre pays actuel et recoit un bonus local plus faible. Ce refus ne bloque pas definitivement Rome si un autre souverain controle plus tard le Tibre."
 bronze_rome_foundation_momentum: "Elan de fondation"
 bronze_rome_foundation_momentum_desc: "Le nouveau royaume de Rome attire prestige, colons et soutien aristocratique grace aux rites de fondation sur le Tibre."
 bronze_rome_foundation_site: "Site de fondation de Rome"
 bronze_rome_foundation_site_desc: "La colonie nouvellement reconnue attire guerriers, migrants et nobles locaux autour de son passage fortifie sur le fleuve."
 bronze_rome_absorbed_settlement: "Colonie du Tibre absorbee"
 bronze_rome_absorbed_settlement_desc: "La colonie latiale du Tibre a ete integree au royaume existant au lieu de devenir une cite separee."
