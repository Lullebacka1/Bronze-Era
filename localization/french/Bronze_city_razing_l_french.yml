l_french:
 bronze_city_razing.1.title: "La ville est tombee"
 bronze_city_razing.1.desc: "[bronze_captured_city.GetName] est sous notre controle. Les portes sont ouvertes, les reserves sont exposees, et le sort de la population depend maintenant de l'armee victorieuse."
 bronze_city_razing.1.a: "Occuper la ville."
 bronze_city_razing.1.b: "Piller la ville."
 bronze_city_razing.1.c: "La raser jusqu'aux fondations."
 bronze_city_razing.2.title: "Le pillage est termine"
 bronze_city_razing.2.desc: "L'ordre de pillage a [bronze_captured_city.GetName] arrive a son terme. Si notre armee tient encore la ville, le pillage est acheve. Si l'armee s'est retiree ou si la ville a ete secourue, l'action est interrompue et seuls les premiers degats restent."
 bronze_city_razing.2.a: "Prendre le butin."
 bronze_city_razing.3.title: "La ville est brisee"
 bronze_city_razing.3.desc: "L'ordre de rasage a [bronze_captured_city.GetName] arrive a son terme. Si notre armee tient encore la ville, la destruction est achevee. Si la ville a ete liberee, l'operation est interrompue, mais les premiers degats sont deja faits."
 bronze_city_razing.3.a: "Resoudre l'ordre de rasage."
 bronze_city_razing.9.title: "Des ruines attendent d'etre explorees"
 bronze_city_razing.9.desc: "De vieux murs, des sanctuaires brises et des reserves enterrees subsistent dans nos terres. Des scribes et des aventuriers pensent qu'une expedition vers [bronze_ruins_site.GetName] pourrait retrouver des richesses, des archives ou des tombes royales."
 bronze_city_razing.9.a: "Financer l'expedition."
 bronze_city_razing.9.b: "Laisser la cite morte en paix."
 bronze_city_razing.10.title: "L'expedition atteint les ruines"
 bronze_city_razing.10.desc: "L'expedition a atteint les restes brises de [bronze_ruins_site.GetName]. Les premieres chambres sont instables, mais les guides affirment que les passages profonds peuvent encore cacher quelque chose."
 bronze_city_razing.10.a: "Avancer plus profondement."
 bronze_city_razing.10.b: "Se retirer avant de perdre davantage."
 bronze_city_razing.11.title: "Une expedition perdue"
 bronze_city_razing.11.desc: "L'expedition revient tard, affamee et reduite. Les passages effondres, la maladie et les terres hostiles ont consume l'effort sans veritable resultat."
 bronze_city_razing.11.a: "Accepter les pertes."
 bronze_city_razing.12.title: "Un tresor cache"
 bronze_city_razing.12.desc: "Une reserve scellee sous les ruines contient du metal travaille, des biens precieux et des offrandes cachees durant les derniers jours de la ville."
 bronze_city_razing.12.a: "Porter le tresor au palais."
 bronze_city_razing.13.title: "Des textes anciens retrouves"
 bronze_city_razing.13.desc: "Des scribes ont recupere des tablettes et inscriptions endommagees. Beaucoup sont fragmentaires, mais certaines preservent un savoir administratif et rituel perdu."
 bronze_city_razing.13.a: "Envoyer les textes aux savants."
 bronze_city_razing.14.title: "Une chambre funeraire royale"
 bronze_city_razing.14.desc: "L'expedition a trouve une chambre preparee pour un souverain oublie. Son contenu est utile, mais son importance ceremonielle est plus grande encore."
 bronze_city_razing.14.a: "Honorer les morts et consigner la decouverte."
 bronze_city_razing.15.title: "La malediction sacree"
 bronze_city_razing.15.desc: "Les ouvriers murmurent que les dieux enterres ont ete deranges. Malediction, maladie ou simple peur, le retour de l'expedition trouble la cour."
 bronze_city_razing.15.a: "Faire des offrandes et arreter les travaux."
 bronze_city_razing_1a_tt: "La ville est occupee avec un minimum de degats supplementaires."
 bronze_city_razing_1b_tt: "Lance un pillage de deux semaines depuis l'armee qui a capture la ville. La location recoit un marqueur visible de pillage. Les armees du joueur peuvent partir pour annuler l'action ; les armees IA sont bloquees jusqu'a la resolution. Si une armee est encore presente et que nous controlons toujours la ville a la fin, nous gagnons du butin, la ville perd prosperite, population, nourriture et prestige urbain, et les pertes civiles ajoutent du score de guerre bonus."
 bronze_city_razing_1c_tt: "Lance une operation de rasage de deux semaines depuis l'armee qui a capture la ville. La location recoit un marqueur visible de rasage. Les armees du joueur peuvent partir pour annuler l'action ; les armees IA sont bloquees jusqu'a la resolution. Si une armee est encore presente et que nous controlons toujours la ville a la fin, la ville subit de lourdes pertes de population, destructions de batiments, baisse de rang, forte perte de prosperite, et les pertes civiles ajoutent du score de guerre bonus. Si l'action est interrompue, des degats partiels sont appliques."
 bronze_city_razing_2a_tt: "Si notre armee est encore dans la ville, applique le pillage final : butin, pertes de population, perte de nourriture, degats de prosperite, perte de prestige urbain et score de guerre bonus lie aux pertes civiles. Si l'armee est partie ou si la ville a ete secourue, interrompt le pillage et applique seulement des degats mineurs."
 bronze_city_razing_3a_tt: "Si notre armee est encore dans la ville, applique le rasage final : butin, lourdes pertes de population, destruction de batiments, baisse du rang de colonie, retrait du prestige urbain si la location n'est plus une cite, et score de guerre bonus lie aux pertes civiles. Si l'armee est partie ou si la ville a ete secourue, interrompt le rasage et applique des degats partiels."
 bronze_city_razing_9a_tt: "Depense 50 d'or pour lancer une expedition. Les resultats arriveront apres plusieurs mois."
 bronze_city_razing_9b_tt: "Aucune expedition n'est lancee."
 bronze_city_razing_10a_tt: "Depense 20 d'or supplementaires et continue. L'expedition peut trouver un tresor, des textes, une tombe, ou subir des pertes."
 bronze_city_razing_10b_tt: "Met fin a l'expedition et marque la ruine comme recemment exploree."
 bronze_city_razing_11a_tt: "Perd de l'or supplementaire et du prestige. L'expedition prend fin."
 bronze_city_razing_12a_tt: "Gagne de l'or et du prestige. L'expedition prend fin."
 bronze_city_razing_13a_tt: "Gagne du progres de recherche et du prestige. L'expedition prend fin."
 bronze_city_razing_14a_tt: "Gagne de l'or et du prestige. L'expedition prend fin."
 bronze_city_razing_15a_tt: "Perd de la stabilite et du prestige. L'expedition prend fin."
 bronze_city_capture_occupy_effect_tt: "Occupation ordonnee"
 bronze_city_start_sack_effect_tt: "Commencer le pillage"
 bronze_city_start_unit_sack_effect_tt: "L'armee commence deux semaines de pillage. Elle reste exposee et liee a la ville occupee jusqu'a la fin de l'action."
 bronze_city_sack_interrupted_effect_tt: "Pillage interrompu"
 bronze_city_sack_effect_tt: "Pillage de ville"
 bronze_city_start_raze_effect_tt: "Commencer le rasage"
 bronze_city_start_unit_raze_effect_tt: "L'armee commence deux semaines de rasage. Elle reste exposee et liee a la ville occupee jusqu'a la fin de l'action."
 bronze_city_raze_interrupted_effect_tt: "Rasage interrompu"
 bronze_city_raze_effect_tt: "Rasage de ville"
 bronze_city_create_ancient_ruins_effect_tt: "La ville detruite devient des ruines antiques permanentes."
 bronze_ruins_start_expedition_effect_tt: "Une expedition financee part explorer des ruines antiques."
 STATIC_MODIFIER_NAME_bronze_city_orderly_occupation: "Occupation ordonnee"
 STATIC_MODIFIER_DESC_bronze_city_orderly_occupation: "La ville a ete prise sous occupation controlee plutot que livree a un pillage sans ordre."
 STATIC_MODIFIER_NAME_bronze_city_being_sacked: "En cours de pillage"
 STATIC_MODIFIER_DESC_bronze_city_being_sacked: "Les soldats arrachent a la ville ses richesses, sa nourriture, ses captifs et son prestige."
 STATIC_MODIFIER_NAME_bronze_city_recently_sacked: "Recemment pillee"
 STATIC_MODIFIER_DESC_bronze_city_recently_sacked: "Les marches, les foyers et la reputation de la ville ne se sont pas remis d'un pillage recent."
 STATIC_MODIFIER_NAME_bronze_city_razing_underway: "Rasage en cours"
 STATIC_MODIFIER_DESC_bronze_city_razing_underway: "L'armee occupante demantele la ville pendant deux semaines. Si la ville est liberee avant la fin, le rasage est interrompu mais des degats partiels restent."
 STATIC_MODIFIER_NAME_bronze_city_razed: "Ville rasee"
 STATIC_MODIFIER_DESC_bronze_city_razed: "Une grande partie de la cite a ete volontairement detruite."
 STATIC_MODIFIER_NAME_bronze_city_severe_ruins: "Ruines severes"
 STATIC_MODIFIER_DESC_bronze_city_severe_ruins: "De larges parties de la ville sont brisees, abandonnees ou inutilisables. Ceci est un marqueur visuel ; les degats sont portes par le modificateur de ville rasee."
 STATIC_MODIFIER_NAME_bronze_ancient_ruins_location: "Ruines antiques"
 STATIC_MODIFIER_DESC_bronze_ancient_ruins_location: "Ce lieu conserve les restes d'une ville detruite de l'age du bronze. Ce marqueur n'a aucun effet gameplay direct."
 STATIC_MODIFIER_NAME_bronze_ruins_expedition_camp: "Camp d'expedition des ruines"
 STATIC_MODIFIER_DESC_bronze_ruins_expedition_camp: "Scribes, ouvriers, gardes et guides fouillent les restes d'une cite antique."
 bronze_ruins_button: "Ruines antiques"
 bronze_ruins_button_desc: "Ouvrir le panneau des ruines antiques de cette location."
 bronze_ruins_panel_title: "Ruines antiques"
 bronze_ruins_panel_empty_desc: "Cette ville detruite est marquee comme une ruine antique. Le panneau est volontairement vide pour l'instant et pourra recevoir plus tard des mecaniques de fouilles, restauration ou memoire."
