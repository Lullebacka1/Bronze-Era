l_french:
 bronze_western_foundations.1.title: "Les cites etrusques"
 bronze_western_foundations.1.desc: "En Etrurie, les communautes villanoviennes des hauteurs deviennent des cites aristocratiques. La comptabilite palatiale, les outils de fer et les nouveaux rites des elites donnent aux anciens habitats une autre langue politique, centree sur les temples, les magistrats et les maisons nobles etrusques."
 bronze_western_foundations.1.a: "Reconnaitre l'ordre etrusque."
 bronze_western_foundations_1a_tt: "La culture d'Etat et la religion d'Etat deviennent etrusques. Uniquement dans les locations etruriennes de depart encore possedees, environ 55% de la population devient de culture etrusque et environ 45% suit la religion etrusque."
 bronze_western_foundations.2.title: "La fondation de Carthage"
 bronze_western_foundations.2.desc: "Le port occidental de Tunis devient le point d'appui d'une nouvelle colonie phenicienne. Marchands, marins et maisons de temple demandent a etre reconnus comme Carthage, une cite placee pour controler les routes centrales de la Mediterranee occidentale."
 bronze_western_foundations.2.a: "Fonder Carthage a l'ouest."
 bronze_western_foundations_2a_tt: "Carthage est creee a Tunis, Tebourba, Nabeul, Kelibia, Bizerte et Zaghouan avec la culture levantine du fondateur et la religion punique."
 bronze_western_foundations.3.title: "Carthage sur la cote africaine"
 bronze_western_foundations.3.desc: "Des marchands et des colons venus d'ailleurs se rassemblent autour du port de Tunis, entrainant les villes voisines dans une nouvelle cite punique. Meme sans metropole phenicienne dominante, la colonie a desormais assez de poids pour devenir Carthage."
 bronze_western_foundations.3.a: "Laisser Carthage prendre forme."
 bronze_western_foundations_3a_tt: "Carthage est creee a Tunis, Tebourba, Nabeul, Kelibia, Bizerte et Zaghouan avec la culture phenicienne-punique et la religion punique. Vous continuerez la partie avec Carthage."
