 egyptian_rule_in_canaan_panel_authority_value: "#Y [GetSituationByKey('egyptian_rule_in_canaan').MakeScope.GetVariable('egyptian_authority_in_canaan').GetValue|V0]#!/100"
 egyptian_rule_in_canaan_panel_subjects: "Vassaux cananeens"
 egyptian_rule_in_canaan_panel_subjects_value: "#Y [GetSituationByKey('egyptian_rule_in_canaan').MakeScope.GetVariable('egyptian_rule_in_canaan_subjects').GetValue|V0]#!/10"
 egyptian_rule_in_canaan_actions_card: "Actions disponibles"
 egyptian_rule_in_canaan_actions_card_desc: "L'Egypte peut depenser richesse et hommes pour renforcer les garnisons. Les vassaux cananeens peuvent defier l'autorite egyptienne au prix de risques internes et diplomatiques."
 egyptian_rule_in_canaan_map_card: "Marqueurs de carte"
 egyptian_rule_in_canaan_map_card_desc: "Le jaune marque les royaumes urbains cananeens. La couleur egyptienne marque les sites avec garnison egyptienne. Le rouge secondaire indique une garnison occupee."
 hint_egyptian_rule_in_canaan: "Domination egyptienne en Canaan"
 hint_egyptian_rule_in_canaan_hint_text: "L'Egypte controle Canaan par des royaumes urbains vassaux et des garnisons etrangeres. Si l'autorite atteint zero, l'Egypte doit abandonner Canaan ou payer un lourd cout unique pour maintenir le protectorat."
 egyptian_rule_in_canaan_phase_1: "Hegemonie egyptienne"
 egyptian_rule_in_canaan_phase_2: "Autorite declinante"
 egyptian_rule_in_canaan_phase_3: "Defiance cananeenne"
 egyptian_rule_reinforce_canaanite_garrisons: "Renforcer les garnisons cananeennes"
 egyptian_rule_reinforce_canaanite_garrisons_desc: "Envoyer soldats, scribes et argent dans les forteresses cananeennes. Le cout est reel, mais la force egyptienne visible peut retarder la rebellion."
 egyptian_rule_reinforce_canaanite_garrisons_tt: "L'autorite egyptienne en Canaan augmente de #P 8#!. La satisfaction des nobles egyptiens diminue legerement pendant que des hommes et des ressources sont envoyes au loin."
 egyptian_rule_defy_egyptian_authority: "Defier l'autorite egyptienne"
 egyptian_rule_defy_egyptian_authority_desc: "Retenir le tribut, proteger des bandes locales et tester la portee des officiels de Pharaon."
 egyptian_rule_defy_egyptian_authority_tt: "L'autorite egyptienne en Canaan baisse de #N 4#!. Ce pays gagne du desir de liberte et degrade ses relations avec l'Egypte."
 egyptian_rule_in_canaan.1.title: "Le protectorat cananeen"
 egyptian_rule_in_canaan.1.desc: "Les routes de Canaan repondent encore a l'Egypte. Des garnisons surveillent Gaza, Jaffa et Sichem, tandis que les rois des cites envoient leur tribut au Nil. Mais l'equilibre depend de la crainte, de l'or et de la reputation des armees de Pharaon."
 egyptian_rule_in_canaan.1.a: "Les rois vassaux se souviendront de l'Egypte."
 egyptian_rule_in_canaan_1a_tt: "La situation Domination egyptienne en Canaan commence avec #Y 80#! d'autorite."
 egyptian_rule_in_canaan.2.title: "Sous l'ombre de Pharaon"
 egyptian_rule_in_canaan.2.desc: "Les scribes egyptiens comptent le grain, les soldats gardent les routes et les messagers portent les exigences venues du sud. Votre cite conserve son trone, mais pas toute sa liberte."
 egyptian_rule_in_canaan.2.a: "Nous endurerons cet ordre."
 egyptian_rule_in_canaan_2a_tt: "Vous faites partie de la situation Domination egyptienne en Canaan comme vassal cananeen."
 egyptian_rule_in_canaan.10.title: "Tribut refuse"
 egyptian_rule_in_canaan.10.desc: "Plusieurs rois cananeens retardent le tribut et envoient des lettres evasives. Les garnisons demandent de l'argent, les envoyes exigent une punition et les scribes avertissent que l'autorite egyptienne devient negociable."
 egyptian_rule_in_canaan.10.a: "Que l'avertissement suffise."
 egyptian_rule_in_canaan_10a_tt: "L'autorite egyptienne en Canaan baisse de #N 4#!."
 egyptian_rule_in_canaan.10.b: "Payer nous-memes les arrieres."
 egyptian_rule_in_canaan_10b_tt: "Coute #N 45#! or. L'autorite egyptienne en Canaan augmente de #P 3#! et le desir de liberte des vassaux cananeens baisse legerement."
 egyptian_rule_in_canaan.20.title: "Une garnison est isolee"
 egyptian_rule_in_canaan.20.desc: "Un poste fortifie egyptien en Canaan a ete occupe ou coupe de son souverain local. La perte n'est pas seulement militaire. Chaque roi voisin mesure maintenant l'autorite egyptienne a la fumee qui monte de la route."
 egyptian_rule_in_canaan.20.a: "La nouvelle voyagera."
 egyptian_rule_in_canaan_20a_tt: "L'autorite egyptienne en Canaan a baisse parce qu'une location de garnison a ete occupee."
 egyptian_rule_in_canaan.100.title: "Le protectorat se brise"
 egyptian_rule_in_canaan.100.desc: "Les cites cananeennes n'obeissent plus par habitude ni par crainte. Les messagers de Pharaon sont ignores, les garnisons sont des ilots couteux de controle et le tresor doit choisir si Canaan merite un nouveau grand sacrifice."
 egyptian_rule_in_canaan.100.a: "Se retirer de Canaan."
 egyptian_rule_in_canaan_100a_tt: "Tous les vassaux cananeens restants sont liberes, les garnisons egyptiennes sont retirees et la situation prend fin."
 egyptian_rule_in_canaan.100.b: "Canaan doit etre tenu."
 egyptian_rule_in_canaan_100b_tt: "Mesure d'urgence unique. Coute #N 180#! or, #N 500#! manpower et de la stabilite. L'autorite revient a #Y 30#!, mais tous les vassaux cananeens deviennent plus defiants."
 egyptian_rule_in_canaan.200.title: "Canaan demeure sous l'Egypte"
 egyptian_rule_in_canaan.200.desc: "Les tempetes de l'effondrement plus large sont passees sans briser l'autorite egyptienne en Canaan. Les garnisons restent couteuses, mais les rois vassaux n'ont pas fait eclater le protectorat."
 egyptian_rule_in_canaan.200.a: "Les routes restent ouvertes a l'Egypte."
 egyptian_rule_in_canaan_200a_tt: "L'Egypte gagne du prestige et la situation prend fin tandis que Canaan reste sous vassalite egyptienne."
