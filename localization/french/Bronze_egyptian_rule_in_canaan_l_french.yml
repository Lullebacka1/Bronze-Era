l_french:
 egyptian_rule_in_canaan: "Domination egyptienne en Canaan"
 egyptian_rule_in_canaan_desc: "Les garnisons egyptiennes et les traites de vassalite lient Canaan au Nil, mais les rois des cites observent la force de l'Egypte. L'autorite progresse grace aux garnisons payees et aux sujets loyaux, et recule avec la defiance, les forteresses perdues, la famine et l'effondrement de l'age du Bronze."
 egyptian_rule_in_canaan_overview_card: "Protectorat cananeen"
 egyptian_rule_in_canaan_overview_card_desc: "L'Egypte commence avec un reseau imperial puissant mais fragile en Canaan. Les royaumes urbains locaux gardent leurs terres, tandis que les garnisons egyptiennes surveillent les routes et les ports."
 egyptian_rule_in_canaan_panel_phase: "Phase"
 egyptian_rule_in_canaan_panel_phase_value: "#Y [GetSituationByKey('egyptian_rule_in_canaan').MakeScope.GetVariable('egyptian_rule_in_canaan_phase').GetValue|V0]#!/3"
